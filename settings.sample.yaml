# alias-inject の設定ファイルのサンプル。実値は入れていない
# ~/.config/alias-inject/settings.yaml にコピーし、~/.claude/settings.json の env の ALIAS_INJECT_CONFIG にそのパスを指定する
global:
  # false のとき、何も追加しない
  enabled: true

  # 読むリポジトリの dev-docs.yaml。その documents のうち metadata.alias_type を持つ行が照合の定義になる。config の相対パスは、この設定ファイルのフォルダから解決する
  repositories:
    - config: ~/repo/knowledge/dev-docs.yaml
    - config: ../old-notes/dev-docs.yaml
      # false のとき、このリポジトリを読まない
      enabled: false

  # 端末だけのエイリアス。要素は schemas/aliases.schema.yaml のエイリアスの元の行と同じ構造。paths の相対パスは、この設定ファイルのフォルダから解決する
  # metadata の各キーは、文書の列から取る {type: ref, field: 列名} か、行の全文書に同じ値を使う {type: custom, value: 値}。書かないキーは同じ名前の列の ref とみなす
  aliases:
    - id: terms
      paths: [terms/*.yaml]
      metadata:
        alias_type:
          type: custom
          value: term
        # 文脈に出す語を title の列から取る
        name:
          type: ref
          field: title
    - id: docs
      paths: [docs/*.yaml]
      metadata:
        alias_type:
          type: custom
          value: doc
    - id: commands
      paths: [commands/*.yaml]
      metadata:
        alias_type:
          type: custom
          value: command
    - id: urls
      paths: [urls/*.yaml]
      # false のとき、この行を使わない
      enabled: true
      metadata:
        alias_type:
          type: custom
          value: url
    - id: skills
      paths: [skills/*.yaml]
      metadata:
        alias_type:
          type: custom
          value: skill
    - id: tools
      paths: [tools/*.yaml]
      metadata:
        alias_type:
          type: custom
          value: tool
    - id: paths
      paths: [paths/*.yaml]
      metadata:
        alias_type:
          type: custom
          value: path
    - id: envs
      paths: [envs/*.yaml]
      metadata:
        alias_type:
          type: custom
          value: env
        # url と port は、どちらか 1 つ以上を指定する（書かなくても同じ名前の列から取る）
        url:
          type: ref
          field: url
        port:
          type: ref
          field: port
    - id: avoids
      paths: [avoids/*.yaml]
      metadata:
        alias_type:
          type: custom
          value: avoid

  # 文脈を追加する入力の出所。user（利用者の入力）と plugin（プラグインが送信した入力）。書かないときはすべての出所
  origins: [user, plugin]

  # 1 回に追加する語の上限
  max_items: 20

  # 1 回に追加する文脈全体（見出しを含む）の文字数の上限
  max_chars: 4000

  # 照合しない語
  exclude: [それ]

  # 文脈の先頭の見出し
  heading: この発言に出る用語

# match が当たったプロジェクトの要素だけを、並びの順に global へ重ねる
projects:
  # match は絶対パスかプロジェクト名。repositories・aliases の相対パスは、起動したプロジェクトの直下から解決する
  - match: sample-project
    max_items: 10
    repositories:
      - config: dev-docs.yaml
    aliases:
      - id: project-commands
        paths: [docs/command.yaml]
        # 文書の並びを持つ配列のキー。書かないときは各ファイルが 1 件の文書
        records: commands
        metadata:
          alias_type:
            type: custom
            value: command
