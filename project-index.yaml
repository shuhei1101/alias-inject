version: "3"
name: alias-inject
worktrees: [".claude/worktrees/*"]
description: 入力の語を設定の YAML と照合し、引用の文脈を Claude Code に追加するプラグイン alias-inject の設計書・公開ドキュメント
when:
  - alias-inject が入力や読んだ本文に追加する引用の文脈（用語・エイリアス・変数参照の値）の仕様を調べるとき
  - alias-inject の設定ファイルと、project-index.yaml の alias_type を持つ行の書き方を調べるとき
  - alias-inject のフックのモジュール構成・テスト実行方法・開発コマンドを調べるとき
documents:
  - id: docs
    title: 公開ドキュメント
    paths: [docs/guide/files.yml]
    exclude: ["*.yaml", "*.yml", README.md, はじめに.md, 使い方.md, リファレンス.md]
    records: files
    body_file: path
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.1.0
    metadata:
      id: path
      visibility: visibility
      category: category
  - id: architecture
    title: アーキテクチャ図
    paths: ["docs/architecture/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/architecture.schema.yaml
      ref: design-schemas/v8.1.0
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: interface
    title: インターフェース定義
    paths: ["docs/interface/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/interface.schema.yaml
      ref: design-schemas/v8.1.0
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: scenario
    title: シナリオ
    paths: ["docs/scenario/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/scenario.schema.yaml
      ref: design-schemas/v8.1.0
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: test_procedure
    title: テスト実行方法
    paths: ["docs/test-procedure/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/test_procedure.schema.yaml
      ref: design-schemas/v8.1.0
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: module
    title: モジュール構成
    paths: ["docs/module/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/module.schema.yaml
      ref: design-schemas/v8.1.0
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: library
    title: 外部ライブラリ
    paths: ["docs/library/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/library.schema.yaml
      ref: design-schemas/v8.1.0
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: config
    title: 設定
    paths: ["docs/config/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/config.schema.yaml
      ref: design-schemas/v8.1.0
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: dev_command
    title: 開発コマンド
    paths: ["docs/dev-command/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/dev_command.schema.yaml
      ref: design-schemas/v8.1.0
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: nonfunctional
    title: 非機能要件
    paths: ["docs/nonfunctional/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/nonfunctional.schema.yaml
      ref: design-schemas/v8.1.0
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: layout
    title: フォルダ構成
    paths: ["docs/layout/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/layout.schema.yaml
      ref: design-schemas/v8.1.0
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: index
    title: 目次
    paths:
      - docs/index.yaml
      - "docs/*/index.yaml"
    schema:
      source: knowledge
      path: schemas/design/index.schema.yaml
      ref: design-schemas/v8.1.0
    metadata:
      description: summary
