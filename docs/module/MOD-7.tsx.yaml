id: MOD-7
visibility: internal
title: プラグイン / 入口 / register.tsx
lead: |-
  Claude Code が `hooks/hooks.json` の `modules` から参照する hooks モジュールの入口と、プラグイン・マーケットプレイス・型の確認の定義ファイル。
  入口は `prompt.submit`・`session.compact`・`session.end`・`tool.call` に処理を登録する。
test_files:
  - tests/unit/hooks/register.test.ts
functions:
  - name: register
    title: 入口
    kind: 関数
    container: hooks/register.tsx
    usecase: 共通
    role: 入口
    summary: hooks モジュールの入口として、4 つのイベントに処理を登録する
    inherits: LIB-1#catalogs[API].entries[Register]
    scope: public
    is_async: false
    args:
      - name: 'on'
        title: 処理の登録
        type: On（claude-code の Register の引数）
        required: true
        passing: injected
        description: イベントへ処理を登録する関数。エンジンから受け取る
        notes: 4 回呼ぶ
    args_example: |-
      ```ts
      import type { Register } from 'claude-code'

      export const register: Register = (on) => {
        on('prompt.submit', handlePromptSubmit)
        on('session.compact', handleSessionCompact)
        on('session.end', handleSessionEnd)
        on('tool.call', handleToolCall)
      }
      ```
    returns:
      type: void
      description: 何も返却しない
    process: 1. `on('prompt.submit', handlePromptSubmit)`・`on('session.compact', handleSessionCompact)`・`on('session.end', handleSessionEnd)`・`on('tool.call', handleToolCall)` を呼ぶ
    unit_tests:
      - name: test_register
        case: 正常
        summary: 設定ファイルのパスが無いとき、入力の送信が変わらずに届く
        condition: "テストの中で `prompt.submit` に届いた text と context をそのまま返却する処理を登録し、`$.prompt.submit({ text: 'hello', wait: false, origin: { kind: 'composer' } })` を実行する"
        mock: なし（`claude-code/testing` の `test` が mod を読み込んだ環境で実行する）
        expected: 結果の `text` が `hello` で、`context` に何も追加されていない（`undefined` か空の配列）
    status: implemented
notes:
  テストと型の確認: |-
    - テストは `claude plugin test` で実行する。`dir` の下の `*.test.ts` を全て実行するので、`tests/` の下に配置しても参照される
    - 型の確認は `npm run typecheck`。対象のファイルは `.claude-plugin/types/tsconfig.json` の `include` に従う。`tests/` が対象に入らないときは planner へ差し戻す
    - `.claude-plugin/types/` は、信頼済みのフォルダから `claude --plugin-dir {worktree}` の対話のセッションを 1 度起動すると書き出される（[PoC 結果](../pr/5/プラグイン.md)）
