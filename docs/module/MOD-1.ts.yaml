id: MOD-1
visibility: internal
title: プラグイン / イベントの処理 / handlers.ts
lead: |-
  入口が `prompt.submit`・`session.compact`・`session.end`・`tool.call` に登録するイベントの処理。
test_files:
  - tests/unit/hooks/handlers.test.ts
directory: |-
  ```text
  hooks/
    handlers.ts          prompt.submit・session.compact・session.end・tool.call の処理
  tests/
    unit/
      hooks/
        handlers.test.ts handlers.ts の単体テスト
  ```
functions:
  - name: handlePromptSubmit
    title: 入力への引用の文脈の追加
    kind: フック
    container: hooks/handlers.ts
    usecase: 入力への引用の文脈の追加
    summary: 入力を参照するリポジトリの `documents` と設定ファイルの `aliases` の行が指す YAML の単語と照合し、そのセッションで初めて出た単語の文脈を `context` の末尾に追加して返却する
    scope: public
    is_async: true
    side_effects: 追加した単語を `$.state` のセッションの記録に入れる。読み込めない設定ファイル・`project-index.yaml`・YAML と、除外した設定の値・行・文書を debug log に出す
    inherits: IF-3#
    args:
      - name: $
        type: EngineInterface
        required: true
        passing: injected
        description: エンジンから受け取る
      - name: e
        type: PromptSubmitInput
        required: true
        passing: positional
        description: 入力の送信の入力
      - name: next
        type: '(e: PromptSubmitInput) => Promise<PromptSubmitResult>'
        required: true
        passing: positional
        description: 下のプラグインとエンジンの処理
    returns:
      type: Promise<PromptSubmitResult>
      description: '`next` の結果'
    process: |-
      1. `e.command` があれば `next(e)` を返却する
      2. 設定ファイルのパスの取得が null なら `next(e)` を返却する（ログを出さない）
      3. スキーマの読み込みをする
      4. 設定ファイルを `$.fs.stat` で確認し、変わったファイルの読み込み（種類は `config`）で参照する。変換は YAML のパース（`ok` が false なら理由で ConfigError）と設定ファイルの検証（スキーマは 3 のもの）
      5. 4 が例外になったら、設定ファイルのパスと理由を `$.ui.log(text, { to: "debug" })` に出して `next(e)` を返却する
      6. 実効の設定の組み立てをする（configPath は設定ファイルのパス、projectRoot は `$.session.root()`、repoRoot は `$.session.repo()?.root ?? $.session.root()`）。設定ファイルの検証と組み立ての warnings を、設定ファイルのパスを添えて debug log に出す
      7. enabled が false、または出所の判定が false なら `next(e)` を返却する
      8. 実効の設定の repositories を順に project-index.yaml の読み込みで参照する。RepositoryError はパスと理由を debug log に出し、そのリポジトリだけを除外する。読み込めたリポジトリの warnings は、`project-index.yaml` のパスを添えて debug log に出す
      9. 8 のリポジトリの行を repositories の順に並べ、その後ろに実効の設定の aliases の行を並べ、作業場所での絞り込み（cwd は `$.session.root()`）を適用する。残った各行を並びの位置とともに行の文書の読み込みで参照し、failures は `照合から除外しました（{YAML のパス}）: {理由}` を debug log に出す
      10. 全ての単語を照合し、`e.text` で照合条件での絞り込みを適用する
      11. 記録への追加を、recordId を記録の ID（sessionId は `$.session.id()`、agentId は undefined）、select を記録済みのキーでの単語の選択にして呼ぶ
      12. 結果が null なら `next(e)`、それ以外は `next({ ...e, context: [...(e.context ?? []), selection.text] })` を返却する
      13. 3〜11 で想定しない例外（SchemaError・RecordConflictError を含む）が起きたら、理由を debug log に出して `next(e)` を返却する（入力を止めない）

      2〜6 の設定の読み込みと 8・9 の単語の読み込みは、handleToolCall と共有する内部の関数に配置する

      6・8 の warnings は、同じ読み込みの結果（設定ファイルは検証した設定、リポジトリは取り出した行）について同じ文言を 1 回だけ出す。再読み込みして結果が変われば、また出す
    callees:
      - MOD-15#functions[readConfigPath]
      - MOD-3#functions[loadAliasSchema]
      - MOD-16#functions[readIfChanged]
      - MOD-16#functions[parseYaml]
      - MOD-15#functions[parseConfig]
      - MOD-15#functions[resolveSettings]
      - MOD-15#functions[isOriginAllowed]
      - MOD-6#functions[loadRepositoryAliases]
      - MOD-17#functions[loadAliasEntries]
      - MOD-10#functions[findHits]
      - MOD-11#functions[filterByCondition]
      - MOD-14#functions[recordIdOf]
      - MOD-14#functions[addRecorded]
      - MOD-9#functions[selectEntries]
      - MOD-2#functions[filterByScope]
    unit_tests:
      - name: test_handle_prompt_submit_when_disabled
        case: 正常
        summary: enabled が false のときはそのまま返却する
        condition: 設定ファイルの `global.enabled` が false、入力「term-a とは」
        mock: テストの `on` で `settings.read`・`fs.stat`・`fs.list`・`fs.read` をメモリのファイル表から応答し、`mock.env` で `HOME` を指定する
        expected: 返る `context` が受け取ったままで、`project-index.yaml` と YAML の `fs.read` が呼ばれていない
      - name: test_handle_prompt_submit_when_context_given
        case: 正常
        summary: 他のフックが追加した文脈を残して末尾に追加する
        condition: "`e.context` が `['other']`、入力「term-a とは」"
        mock: 同上
        expected: 返る `context` が 2 要素で、先頭が `other`、末尾が term-a の文脈
      - name: test_handle_prompt_submit_when_settings_warned
        case: 正常
        summary: 除外した設定の値と aliases の要素は、読み込みの結果が変わらないうち 1 回だけ debug log に出す
        condition: '設定ファイルの `global.aliases` に `alias_type: memo` の行、`project-index.yaml` の `documents` に `alias_type: term` で `metadata.name` が空文字の行を配置して 2 回入力する'
        mock: 同上。`ui.log` は届いた行を記録する
        expected: '`ui.log` に `to` が `debug` で、設定ファイルのパスと `alias_type` を含む行と、`project-index.yaml` のパスと `metadata.name` を含む行が 1 回ずつだけ届く'
      - name: test_handle_prompt_submit_when_alias_paths_match_config
        case: 正常
        summary: aliases の要素の glob が設定ファイルに該当しても、その要素の他の単語の文脈を追加する
        condition: "設定ファイルの `global.aliases` に `paths: ['*.yaml']` の term の要素、同じフォルダに term-a.yaml、入力「term-a とは」"
        mock: 同上
        expected: 返る `context` の末尾が term-a の文脈で、`照合から除外しました` の debug log は、設定ファイル自身を必須の値が空の文書として除外した行（理由 `… が空です`）だけが出る
      - name: test_handle_prompt_submit_when_inject_condition
        case: 正常
        summary: 照合条件に該当しない単語の文脈を追加せず、記録にも入れない
        condition: 'term-c の YAML に `inject_when: {field: text, op: not_contains, values: [Python]}`。入力「term-a と term-c を Python で」の後に「term-c を tsx で」'
        mock: 同上
        expected: 1 回目の `context` の末尾が term-a の文脈だけで、記録に term-c のキーが無い。2 回目の `context` の末尾が term-c の文脈
        notes: 'PR #58 で追加'
      - name: test_handle_prompt_submit_when_cwd_scoped
        case: 正常
        summary: 作業場所が scope.cwd に該当しない行の YAML を読み込まず、その単語の文脈を追加しない
        condition: '`$.session.root()` が `/repo/sample`。設定ファイルの `global.aliases` に `scope.cwd: [/repo/other/**]` で term-s の YAML を指す term の行。入力「term-a と term-s」'
        mock: テストの `on` で `settings.read`・`fs.stat`・`fs.list`・`fs.read` をメモリのファイル表から応答し、`mock.env` で `HOME` を指定する。`fs.read` の呼ばれたパスを記録する
        expected: 返る `context` の末尾が term-a の文脈だけで、term-s の YAML に `fs.read` が呼ばれていない
  - name: handleSessionCompact
    title: 圧縮の後の記録の消去
    kind: フック
    container: hooks/handlers.ts
    usecase: 圧縮の後の記録の消去
    summary: メインの会話が圧縮された後に、そのセッションの記録を消去する
    scope: public
    is_async: true
    side_effects: '`$.state` のそのセッションの記録を空にする'
    inherits: IF-4#
    args:
      - name: $
        type: EngineInterface
        required: true
        passing: injected
        description: エンジンから受け取る
      - name: e
        type: SessionCompactInput
        required: true
        passing: positional
        description: 圧縮の入力
      - name: next
        type: '(e: SessionCompactInput) => Promise<SessionCompactResult>'
        required: true
        passing: positional
        description: 下のプラグインとエンジンの処理
    returns:
      type: Promise<SessionCompactResult>
      description: '`next(e)` の結果そのまま'
    process: |-
      1. `r = await next(e)`
      2. `e.trigger` が `precompute` でなく、`r` に `skip` が無ければ、記録の ID（sessionId は `$.session.id()`、agentId は `e.agentId`）の記録の消去をする
      3. `r` を返却する
    callees:
      - MOD-14#functions[recordIdOf]
      - MOD-14#functions[clearRecorded]
    unit_tests:
      - name: test_handle_session_compact
        case: 正常
        summary: 圧縮されたら記録を消去する
        condition: 記録に term-a を入れ、`trigger` が `manual`・`auto`・`plugin` で、`next` が `messages` を返却する
        mock: テストの `on` で `session.compact` の結果を返却する
        expected: どれも記録が空になり、結果が `next` の結果のまま
      - name: test_handle_session_compact_when_not_compacted
        case: 正常
        summary: 圧縮されなかったときは記録を残す
        condition: '`trigger` が `precompute`、`next` が `{ skip }` を返却する、の 2 通り'
        mock: 同上
        expected: どちらも記録に term-a が残る
      - name: test_handle_session_compact_when_subagent
        case: 正常
        summary: サブエージェントの圧縮はそのサブエージェントの記録だけを消去する
        condition: '`$.session.id()` が s1。s1 と、s1 と `agent-1` の記録に term-a を入れ、`agentId` が `agent-1`、`trigger` が `auto`'
        mock: 同上
        expected: s1 と `agent-1` の記録が空で、s1 の記録に term-a が残る
        notes: 'PR #52 で追加'
  - name: handleSessionEnd
    title: クリアの後の記録の消去
    kind: フック
    container: hooks/handlers.ts
    usecase: クリアの後の記録の消去
    summary: '`/clear` でセッションが終わったとき、そのセッションの記録を消去する'
    scope: public
    is_async: true
    side_effects: '`$.state` の終わったセッションの記録を空にする'
    inherits: IF-1#
    args:
      - name: $
        type: EngineInterface
        required: true
        passing: injected
        description: エンジンから受け取る
      - name: e
        type: SessionEndInput
        required: true
        passing: positional
        description: セッションの終了の入力
      - name: next
        type: '(e: SessionEndInput) => Promise<SessionEndResult>'
        required: true
        passing: positional
        description: 下のプラグインとエンジンの処理
    returns:
      type: Promise<SessionEndResult>
      description: '`next(e)` の結果そのまま'
    process: |-
      1. `e.reason` が `clear` なら `e.sessionId` の記録の消去をする
      2. `next(e)` を返却する
    callees:
      - MOD-14#functions[clearRecorded]
    unit_tests:
      - name: test_handle_session_end_when_clear
        case: 正常
        summary: '`clear` のときだけ記録を消去する'
        condition: '`$.session.id()` が s1。s1 と s2 の記録に term-a を入れ、`sessionId` が s2 で `reason` が `prompt_input_exit` と `clear`'
        mock: なし（`claude-code/testing` の `test` の `$.state`）
        expected: '`prompt_input_exit` では s2 に term-a が残り、`clear` では s2 だけが空になって s1 に term-a が残る'
  - name: handleToolCall
    title: ツールの結果への引用の文脈の追加
    container: hooks/handlers.ts
    usecase: ツールの結果への引用の文脈の追加
    summary: ツールの結果の本文を照合してその会話で初めて出た単語の文脈を、本文の `!{名前}` には同じ名前の環境変数の値を、`context` の末尾に追加して返却する
    kind: フック
    inherits: IF-2#
    scope: public
    is_async: true
    side_effects: 追加した単語を `$.state` の会話の記録に入れる。変数参照があるときだけ `env -0` の子プロセスを 1 回起こす。読み込めない設定・YAML、引用の文脈・値を追加できない理由を debug log に出す
    args:
      - name: $
        type: EngineInterface
        required: true
        passing: injected
        description: エンジンから受け取る
      - name: e
        type: ToolCallInput
        required: true
        passing: positional
        description: ツールの呼び出しの入力
      - name: next
        type: '(e: ToolCallInput) => Promise<ToolCallResult>'
        required: true
        passing: positional
        description: 下のプラグインとエンジンの処理（ツールの実行）
    returns:
      type: Promise<ToolCallResult>
      description: '`next(e)` の結果。引用の文脈か値の行を追加したときは `context` だけを替えたもの'
    process: |-
      1. `r = await next(e)`
      2. `r.deny` があるか、`r.isError` が true か、`r.text` が文字列でなければ `r` を返却する
      3. 設定の読み込みをする（handlePromptSubmit の 2〜6 と同じ）。設定ファイルのパスが null・読み込めない設定のときは引用の文脈を追加しない（7 へ進む）
      4. enabled が false か、`e.tool` が実効の設定の excludeTools のどれかと完全に一致するときは引用の文脈を追加しない（7 へ進む）。origins では絞らない
      5. 単語の読み込みをし（handlePromptSubmit の 8・9 と同じ）、`r.text` と照合して、`r.text` での照合条件での絞り込み・出た回数の順の並べ替え・参照している文書の除外（home は `$.env.get('HOME')`）を適用する
      6. 記録への追加を、recordId を記録の ID（sessionId は `$.session.id()`、agentId は `e.agentId`）、select を記録済みのキーでの単語の選択にして呼び、結果の text を引用の文脈にする
      7. 3〜6 で想定しない例外（RecordConflictError を含む）が起きたら、理由を debug log に出し、引用の文脈を追加せずに続ける
      8. 変数参照の名前の検出が空でなければ、`$.process.run(['env', '-0'], { timeoutMs: VARIABLE_REFERENCE_TIMEOUT_MS })` を呼ぶ。`exitCode` が 0 なら env の出力の分割と値の行の組み立てをする。`exitCode` が 0 以外なら終了コードを、例外（起動できない・待ちの上限の超過を含む）なら理由を debug log に出し、値の行を追加しない
      9. 引用の文脈も値の行も無ければ `r` を返却する。あれば `{ ...r, context: [...(r.context ?? []), 引用の文脈, 値の行] }` を返却する（無い方は並べない）
    refs:
      - IF-5#
    callees:
      - MOD-10#functions[findHits]
      - MOD-11#functions[filterByCondition]
      - MOD-10#functions[sortByCount]
      - MOD-5#functions[excludeReadingDocuments]
      - MOD-14#functions[recordIdOf]
      - MOD-14#functions[addRecorded]
      - MOD-9#functions[selectEntries]
      - MOD-8#functions[findReferenceNames]
      - MOD-8#functions[parseEnvOutput]
      - MOD-8#functions[formatReferenceLines]
      - MOD-8#constants[VARIABLE_REFERENCE_TIMEOUT_MS]
    unit_tests:
      - name: test_handle_tool_call_when_context_given
        case: 正常
        summary: 他のフックが追加した文脈を残し、本文と ref を変えずに末尾に追加する
        condition: 設定ファイルのパスが無い。`next` が `text` に `!{VALUE_A}` を含み `context` が `['other']` の結果を返却する
        mock: テストの `on` で `process.run` に `VALUE_A=value-a` を含む出力と終了コード 0 を返却する
        expected: "返る `context` が `['other', '変数参照の値: !{VALUE_A} = value-a']` で、`text`・`ref` が `next` の結果のまま。`process.run` に `timeoutMs` 20 が渡る"
      - name: test_handle_tool_call_when_skipped
        case: 正常
        summary: deny・エラーの結果・本文が無い結果・単語も変数参照も無い結果はそのまま返却する
        condition: '設定ファイルと term-a の YAML がある。`next` が `deny` あり、`isError: true`、`text` が無い、`text` に単語も変数参照も無いの 4 通りを返却する。前の 3 通りの `text` は term-a を含む'
        mock: テストの `on` で `settings.read`・`fs.stat`・`fs.list`・`fs.read` をメモリのファイル表から応答し、`mock.env` で `HOME` を指定する。`process.run` の呼ばれた回数を記録する
        expected: どれも返る結果が `next` の結果のままで、`process.run` が呼ばれていない。記録が空
      - name: test_handle_tool_call_when_quote_added
        case: 正常
        summary: 引用の文脈を先に、値の行を後に追加し、メインの会話の記録に入れる
        condition: 設定ファイルと term-a の YAML がある。`e.tool` が `Read`、`next` が `text` が「term-a と !{VALUE_A}」で `context` が `['other']` の結果を返却する
        mock: test_handle_tool_call_when_skipped と同じファイル表。`process.run` は test_handle_tool_call_when_context_given と同じ
        expected: '返る `context` が 3 要素で、`other`・term-a の文脈・`変数参照の値: !{VALUE_A} = value-a` の順。`$.session.id()` の記録に term-a のキーが入る'
        notes: 'PR #52 で追加'
      - name: test_handle_tool_call_when_tool_excluded
        case: 正常
        summary: exclude_tools のツールは単語を読み込まずにそのまま返却する
        condition: 設定ファイルの `global.exclude_tools` が `[Bash]`、`e.tool` が `Bash`、`next` の `text` が「term-a を表示」
        mock: test_handle_tool_call_when_skipped と同じ
        expected: 返る結果が `next` の結果のままで、YAML の `fs.read` が呼ばれていない
        notes: 'PR #52 で追加'
      - name: test_handle_tool_call_when_inject_condition
        case: 正常
        summary: ツールの結果の本文で照合条件を評価する
        condition: 'term-c の YAML に `inject_when: {field: text, op: contains, values: [tsx]}`。`next` の `text` が「term-c の説明」と「term-c を tsx で使用する」の 2 回'
        mock: test_handle_tool_call_when_skipped と同じ
        expected: 1 回目は返る結果が `next` の結果のままで、2 回目の `context` の末尾が term-c の文脈
        notes: 'PR #58 で追加'
      - name: test_handle_tool_call_when_in_subagent
        case: 正常
        summary: agentId のある呼び出しはセッションと agentId の組の記録で照合する
        condition: test_handle_tool_call_when_quote_added の設定で、`$.session.id()` が s1 で s1 の記録に term-a が入っている。`e.agentId` が `agent-1`、`text` が「term-a」
        mock: test_handle_tool_call_when_skipped と同じ
        expected: 返る `context` に term-a の文脈があり、s1 と `agent-1` の記録に term-a のキーが入る
        notes: 'PR #52 で追加'
      - name: test_handle_tool_call_when_process_failed
        case: 異常
        summary: 終了コードが 0 以外・例外のときは debug log に出してそのまま返却する
        condition: 設定ファイルのパスが無い。`process.run` が終了コード 3 を返却するか、例外を投げるの 2 通り
        mock: テストの `on` で `process.run` を応答する。`ui.log` は届いた行を記録する
