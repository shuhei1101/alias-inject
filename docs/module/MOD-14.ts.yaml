id: MOD-14
visibility: internal
title: プラグイン / 記録 / record.ts
lead: 会話ごとに文脈を追加した単語のキーを `$.state` に持ち、参照・追加・消去をする。会話はメインの会話がセッション、サブエージェントがセッションと `agentId` の組。
test_files:
  - tests/unit/hooks/lib/record.test.ts
directory: |-
  ```text
  hooks/
    lib/
      record.ts          会話の記録の参照・追加・消去
  tests/
    unit/
      hooks/
        lib/
          record.test.ts record.ts の単体テスト
  ```
constants:
  - name: RECORD_WRITE_ATTEMPTS
    title: 記録の書き込みの回数の上限
    container: hooks/lib/record.ts
    usecase: 共通
    summary: '`ifVersion` を付けた記録の書き込みを試す回数'
    value: '3'
    refs:
      - IF-2#constraints[記録の書き込みの再試行]
    status: planned
    introduced:
      pr: 52
functions:
  - name: recordIdOf
    title: 記録の ID
    kind: 関数
    container: hooks/lib/record.ts
    usecase: 共通
    summary: 会話の記録を参照する `$.state` の `id` を返却する
    scope: public
    is_async: false
    args:
      - name: sessionId
        type: string
        required: true
        passing: keyword
        description: セッション ID
      - name: agentId
        type: string | undefined
        required: true
        passing: keyword
        description: '`tool.call`・`session.compact` の `e.agentId`。メインの会話は undefined'
    returns:
      type: string
      description: メインの会話は `sessionId`、サブエージェントは `{sessionId}/{agentId}`
    process: 1. agentId が undefined なら sessionId、それ以外は sessionId と agentId を `/` でつないで返却する
    unit_tests:
      - name: test_record_id_of
        case: 正常
        summary: メインの会話はセッション ID、サブエージェントはセッションと agentId の組
        condition: s1 と agentId なし、s1 と `agent-1`、s1 と `agent-2`
        mock: なし
        expected: 1 つ目が `s1`、3 つとも異なる
    status: planned
    introduced:
      pr: 52
  - name: readRecorded
    title: 記録の読み込み
    kind: 関数
    container: hooks/lib/record.ts
    usecase: 共通
    summary: 会話の記録済みのキーと、記録の version を返却する
    scope: public
    is_async: true
    args:
      - name: $
        type: EngineInterface
        required: true
        passing: injected
        description: '`$.state.get` を使用する'
      - name: recordId
        type: string
        required: true
        passing: positional
        description: 記録の ID の結果
    returns:
      type: 'Promise<{ keys: Set<string>; version: number }>'
      description: 記録済みのキーと version。書き込んでいないときは空と 0
    process: |-
      1. `$.state.get({ plugin: 'alias-inject', key: 'recorded', id: recordId })` の `value` と `version` を取る
      2. `value` が並びでなければ空、並びなら文字列の要素の Set を、`version` とあわせて返却する
    unit_tests:
      - name: test_read_recorded_when_never_written
        case: 正常
        summary: 書き込んでいない記録は空
        condition: 何も書き込んでいない記録の ID
        mock: なし（`claude-code/testing` の `test` の `$.state`）
        expected: keys が空の Set、version が 0
  - name: addRecorded
    title: 記録への追加
    kind: 関数
    container: hooks/lib/record.ts
    usecase: 共通
    summary: 記録済みのキーから単語を選ばせ、選んだ単語のキーを `ifVersion` で記録に追加する。一致しなかったら再読み込みして再選択する
    scope: public
    is_async: true
    side_effects: '`$.state` のその会話の記録を書き換える'
    args:
      - name: $
        type: EngineInterface
        required: true
        passing: injected
        description: '`$.state.get` と `$.state.set` を使用する'
      - name: recordId
        type: string
        required: true
        passing: keyword
        description: 記録の ID の結果
      - name: select
        type: '(recorded: ReadonlySet<string>) => Selection | null'
        required: true
        passing: keyword
        description: 記録済みのキーを受けて単語を選ぶ。再読み込みするたびに呼ぶ
    returns:
      type: Promise<Selection | null>
      description: 記録に書き込めた選択。select が null を返却したときは null
    process: |-
      1. RECORD_WRITE_ATTEMPTS 回まで次を繰り返す
         1. 記録の読み込みをし、select に keys を指定する。null なら null を返却する（書き込まない）
         2. keys の後ろに選択の keys を並べ、`$.state.set` に `{ ifVersion: version }` を付けて書き込む
         3. `isSet` が true なら選択を返却する
      2. 全て一致しなかったら RecordConflictError を投げる
    exceptions:
      - name: RecordConflictError
        condition: '`ifVersion` を付けた書き込みが RECORD_WRITE_ATTEMPTS 回続けて一致しなかった'
    callees:
      - MOD-14#functions[readRecorded]
    unit_tests:
      - name: test_add_recorded
        case: 正常
        summary: 選んだ単語のキーがその会話の記録だけに残り、次の select に記録済みのキーが渡る
        condition: 記録 s1 に a を選ぶ select で追加し、続けて受け取った keys に無い b を選ぶ select で追加する
        mock: なし（`claude-code/testing` の `test` の `$.state`）
        expected: 2 回目の select が a を受け取り、s1 の記録が a・b、s2 の記録が空
      - name: test_add_recorded_when_nothing_selected
        case: 正常
        summary: select が null なら書き込まずに null を返却する
        condition: select が null を返却する
        mock: テストの `on` で `state.set` の呼ばれた回数を記録する
        expected: null が返り、`state.set` が呼ばれていない
      - name: test_add_recorded_when_conflicted
        case: 正常
        summary: '`ifVersion` が一致しなかったら再読み込みして再選択する'
        condition: select は受け取った keys に無い a・b を選ぶ
        mock: テストの `on` の `state.set` は 1 回目の書き込みの前に、同じ記録へ a を書き込んで version を進める
        expected: 2 回目の select が a を受け取り、返る選択の keys が b だけで、記録が a・b
      - name: test_add_recorded_when_conflicts_exhausted
        case: 異常
        summary: 上限まで一致しなかったら例外
        condition: select が a を選ぶ
        mock: 'テストの `on` の `state.set` は `ifVersion` を付けた書き込みに常に `isSet: false` を返却する'
        expected: RecordConflictError が投げられ、`state.set` が 3 回呼ばれている
        exception: '`ifVersion` を付けた書き込みが RECORD_WRITE_ATTEMPTS 回続けて一致しなかった'
  - name: clearRecorded
    title: 記録の消去
    kind: 関数
    container: hooks/lib/record.ts
    usecase: 共通
    summary: 会話の記録を空にする
    scope: public
    is_async: true
    side_effects: '`$.state` のその会話の記録を空の並びにする'
    args:
      - name: $
        type: EngineInterface
        required: true
        passing: injected
        description: '`$.state.set` を使用する'
      - name: recordId
        type: string
        required: true
        passing: positional
        description: 記録の ID の結果
    returns:
      type: Promise<void>
      description: 何も返却しない
    process: 1. `$.state.set` でその記録に `[]` を書き込む（`undefined` は書き込めないため）
    unit_tests:
      - name: test_clear_recorded
        case: 正常
        summary: 消去した記録だけが空になる
        condition: s1・s2 に a を追加し、s1 を消去する
        mock: なし（`claude-code/testing` の `test` の `$.state`）
        expected: s1 が空、s2 が a
