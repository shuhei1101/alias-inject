id: MOD-2
visibility: internal
title: プラグイン / エイリアス / alias.ts
lead: 設定ファイルの `aliases` の行と `project-index.yaml` の `documents` の行をスキーマで検証して取り出し、`id` の重なった行を除外する。文書ごとに `metadata` の値を解決し、種類ごとの必須のキーを確認する。
test_files:
  - tests/unit/hooks/lib/alias.test.ts
directory: |-
  ```text
  hooks/
    lib/
      alias.ts           エイリアスの元の行の取り出し・id の重なりの確認・metadata の値の解決
  tests/
    unit/
      hooks/
        lib/
          alias.test.ts  alias.ts の単体テスト
  ```
data_models:
  - name: AliasConfig
    title: エイリアスの元の行
    container: hooks/lib/alias.ts
    usecase: 共通
    role: DTO
    summary: スキーマの検証を通った有効なエイリアスの元の行
    properties:
      - name: id
        type: string
        description: 行の ID
      - name: paths
        type: string[]
        description: 参照する YAML のパスか glob。記載したまま（解決は参照する側が行う）
      - name: alias_type
        type: AliasType
        description: 行の引用の種類
      - name: records
        type: string | undefined
        description: 文書の並びを持つ配列のキー。記載しないときは各ファイルが 1 件の文書
      - name: body_file
        type: string | undefined
        description: '`records` の要素の本文のファイルのパスを持つ列の名前。`name` が空の要素の名前に使用する'
      - name: metadata
        type: AliasMetadata
        description: エイリアスのキーごとの、値を取る列の名前
      - name: scope
        type: "'{ cwd: string[] } | undefined'"
        description: 行を照合に使用する作業場所の glob。記載したまま（解決は読み込む側が行う）。記載しないときは undefined
  - name: ResolvedAlias
    title: 参照する行
    container: hooks/lib/alias.ts
    usecase: 共通
    role: DTO
    summary: 出所を持ち、`paths` を絶対パスにしたエイリアスの元の行
    description: '`AliasConfig & { origin: string; patterns: string[]; cwdPatterns: string[] | undefined }`。'
    properties:
      - name: origin
        type: string
        description: 行を記載した `project-index.yaml` か設定ファイルの絶対パス
      - name: patterns
        type: string[]
        description: '`paths` を解決した絶対パスの glob'
      - name: cwdPatterns
        type: string[] | undefined
        description: '`scope.cwd` を `paths` と同じ基準で解決した絶対パスの glob。`scope` を記載しない行は undefined'
  - name: AliasMetadata
    title: エイリアスのキー
    container: hooks/lib/alias.ts
    usecase: 共通
    role: DTO
    summary: 行の `metadata` のうち、エイリアスのキー（ALIAS_KEYS）だけを持つもの
    description: '`Partial<Record<AliasKey, string>>`。他のキー（`tags`・`status` 等）は持たない。'
    properties:
      - name: '{ALIAS_KEYS のキー}'
        type: string | undefined
        description: 値を取る文書の列の名前。入れ子の列は `.` でつなぐ。記載しないキーは同じ名前の列から取る
enums:
  - name: AliasType
    title: 引用の種類
    container: hooks/lib/alias.ts
    usecase: 共通
    summary: '行の `alias_type` の値。文脈に並べるキーとセクションが種類ごとに決まる'
    values:
      - value: term
        title: 用語
        description: '`description`・`related` を追加する'
      - value: doc
        title: 文書
        description: '`description` を追加する'
      - value: command
        title: コマンド
        description: '`command`・`cwd`・`description` を追加する'
      - value: url
        title: URL
        description: '`url`・`description` を追加する'
      - value: skill
        title: スキル
        description: '`skill`・`description` を追加する'
      - value: tool
        title: ツール
        description: '`tool`・`description` を追加する'
      - value: path
        title: パス
        description: '`path`・`description` を追加する'
      - value: env
        title: 環境
        description: '`url`・`port`・`description` を追加する'
      - value: avoid
        title: 使用しない単語
        description: '`replacement` を追加する'
constants:
  - name: ALIAS_KEYS
    title: エイリアスのキー
    container: hooks/lib/alias.ts
    usecase: 共通
    summary: '`metadata` に記載できるエイリアスのキー。型 `AliasKey` はこの要素の union'
    value: '`id`・`name`・`aliases`・`description`・`related`・`command`・`cwd`・`url`・`avoid`・`skill`・`tool`・`path`・`port`・`replacement`・`inject_when`'
  - name: REQUIRED_KEYS
    title: 種類ごとの必須のキー
    container: hooks/lib/alias.ts
    usecase: 共通
    summary: '`AliasType` ごとに、文書で値が空であってはならないキー（`Record<AliasType, readonly AliasKey[]>`）。env の `url`・`port` の 1 つ以上は含めず、必須のキーの確認が別に確認する'
    value: 'term: `id`・`name`・`description` / doc: `id`・`name`・`description` / command: `id`・`name`・`command` / url: `id`・`name`・`url` / skill: `id`・`name`・`skill` / tool: `id`・`name`・`tool` / path: `id`・`name`・`path` / env: `id`・`name` / avoid: `id`・`name`・`replacement`'
functions:
  - name: parseAliases
    title: 行の取り出し
    kind: 関数
    container: hooks/lib/alias.ts
    usecase: 共通
    summary: '行の並びの各行をスキーマで検証し、有効な行を取り出す。合わない行は除外して理由を残す'
    scope: public
    is_async: false
    args:
      - name: items
        type: readonly unknown[]
        required: true
        passing: keyword
        description: 設定ファイルの `aliases` か `project-index.yaml` の `documents` の並び
      - name: schema
        type: Record<string, unknown>
        required: true
        passing: keyword
        description: スキーマのルート
      - name: path
        type: string
        required: true
        passing: keyword
        description: 並びのパス（`documents`・`global.aliases`・`projects[0].aliases`）。理由に使用する
      - name: aliasTypeOnly
        type: boolean
        required: false
        default: 'false'
        passing: keyword
        description: true のとき、`alias_type` も `metadata.alias_type` も持たない行を検証せずに飛ばし、`alias_type` を持たず `metadata.alias_type` を持つ行を旧構造として除外する（`documents` で使用する）
    returns:
      type: '{ aliases: AliasConfig[]; warnings: string[] }'
      description: 取り出した行（並びの順）と、除外した行の理由
    process: |-
      1. `aliasTypeOnly` が true で、行が `alias_type` のキーを持つマッピングでない場合、`metadata` に `alias_type` のキーを持つマッピングなら除外して `{path}[{位置}]（id: {id}）: 旧い構造の行です。metadata.alias_type を行の alias_type へ移してください` を warnings に入れ、それ以外は検証せずに飛ばす
      2. マッピングで `enabled` が false の行は、検証せずに飛ばす
      3. 他の行を、スキーマのルートの `items` で `{path}[{位置}]` をパスにして検証する（値の検証）。位置は飛ばした行を含む元の並びでの位置
      4. 理由があれば行を除外し、`{path}[{位置}]（id: {id}）: {理由を「、」でつなぐ}` を warnings に入れる。`（id: {id}）` は `id` が空でない文字列のときだけ付ける
      5. 理由の無い行は `id`・`paths`・`alias_type`・`records`・`body_file`・`scope` と、`metadata` のうち ALIAS_KEYS のキーだけを AliasConfig にする
    callees:
      - MOD-3#functions[validateSchema]
    unit_tests:
      - name: test_parse_aliases
        case: 正常
        summary: スキーマに合う行を並びの順に取り出し、metadata はエイリアスのキーだけを持つ
        condition: 'リポジトリのスキーマで、`alias_type: term` だけを記載した行（`enabled: true`・`schema` と `metadata.tags` を持つ）と、`alias_type: doc`・`records: files`・`body_file: path` で `metadata.name: title` を記載した行'
        mock: なし
        expected: 'aliases が 2 件で、term の行の metadata が空、doc の行の records が `files`・body_file が `path`・metadata が `name: title` だけ。warnings が空'
      - name: test_parse_aliases_when_disabled
        case: 正常
        summary: '`enabled: false` の行は検証せずに飛ばす'
        condition: '`enabled: false` で `metadata` の無い行'
        mock: なし
        expected: aliases も warnings も空
      - name: test_parse_aliases_when_alias_type_only
        case: 正常
        summary: aliasTypeOnly のとき alias_type を持たない行は飛ばし、metadata.alias_type を持つ行は旧構造として除外する。位置は元の並びで数える
        condition: '`path` が `documents`。`metadata` の無い行・`metadata.tags` だけの行・行の `alias_type` を持たず `metadata.alias_type` を持つ `id: old` の行・`alias_type: term` で `metadata.name` が空文字の `id: bad` の行'
        mock: なし
        expected: 'aliases が空で、warnings が `documents[2]（id: old）` で始まり `metadata.alias_type` を含む 1 件と、`documents[3]（id: bad）` で始まる 1 件'
      - name: test_parse_aliases_when_invalid
        case: 正常
        summary: スキーマに合わない行は除外し、位置と id つきの理由を残す
        condition: '`path` が `global.aliases`。旧構造（`type: url`・`fields`）の `id: urls` の行と、`metadata.alias_type` が `{type: custom, value: term}` で行の `alias_type` を持たない行と、`alias_type: memo` の行と、`metadata.name` が `{type: ref, field: title}` の行と、文字列 `x`'
        mock: なし
        expected: 'aliases が空。warnings が 5 件で、`global.aliases[0]（id: urls）`・`global.aliases[1]`・`global.aliases[2]`・`global.aliases[3]`・`global.aliases[4]` で始まり、1〜3 件目に `alias_type`、4 件目に `metadata.name` を含む'
      - name: test_parse_aliases_when_scope
        case: 正常
        summary: '`scope` を記載した行は scope を持ち、記載しない行は undefined'
        condition: '`alias_type: url` で `scope: {cwd: [/repo/a/**]}` の行と、`scope` を記載しない行'
        mock: なし
        expected: "1 件目の scope が `{cwd: ['/repo/a/**']}`、2 件目の scope が undefined。warnings が空"
  - name: dedupeAliases
    title: id の重なりの確認
    kind: 関数
    container: hooks/lib/alias.ts
    usecase: 共通
    summary: 同じ出所の行のうち、先の行と `id` が重なる行を除外する
    scope: public
    is_async: false
    args:
      - name: aliases
        type: 'readonly T[]（T extends { id: string }）'
        required: true
        passing: positional
        description: 1 つの出所の要素（並びの順）
    returns:
      type: '{ aliases: T[]; warnings: string[] }'
      description: 残した要素（並びの順）と、除外した要素の理由
    process: |-
      1. 並びの順に確認して、既に残した要素と同じ `id` の要素を除外し、`{id}: id が先の要素と重なります` を warnings に入れる
      2. 残した要素と warnings を返却する
    unit_tests:
      - name: test_dedupe_aliases
        case: 正常
        summary: 後の重なった要素だけを除外する
        condition: '`id` が terms・urls・terms の 3 要素'
        mock: なし
        expected: aliases が先の terms と urls の 2 件で、warnings に `terms` を含む 1 件
  - name: resolveMetadata
    title: metadata の値の解決
    container: hooks/lib/alias.ts
    usecase: 共通
    summary: 1 件の文書について、エイリアスのキーごとの値を行の `metadata` が指す列から取る
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: metadata
        type: AliasMetadata
        required: true
        passing: positional
        description: 行の `metadata`（キーごとの列の名前）
      - name: document
        type: Record<string, unknown>
        required: true
        passing: positional
        description: 文書（ファイルの最上位か `records` の要素）
    returns:
      type: Record<AliasKey, unknown>
      description: ALIAS_KEYS の各キーの値。無い列は undefined
    process: |-
      1. ALIAS_KEYS の各キーについて、`metadata` に記載したキーはその列の名前、記載しないキーは同じ名前を列の名前にする
      2. 列の名前を `.` で区切り、文書の最上位から順にマッピングのキーをたどった値を、そのキーの値にする。途中でマッピングでない値に該当すれば undefined にする
    unit_tests:
      - name: test_resolve_metadata
        case: 正常
        summary: 記載したキーは指した列、記載しないキーは同じ名前の列から取る
        condition: 'metadata が `name: title`。文書が `id: term-a`・`title: Term-A`・`name: x`・`description: d`'
        mock: なし
        expected: name が `Term-A`、id が `term-a`、description が `d`、command が undefined
      - name: test_resolve_metadata_when_nested
        case: 正常
        summary: '`.` でつないだ列の名前は入れ子の列をたどる'
        condition: 'metadata が `description: meta.summary`・`url: meta.link.href`。文書が `meta: {summary: s, link: x}`'
        mock: なし
        expected: description が `s`、url が undefined
  - name: missingKeys
    title: 必須のキーの確認
    container: hooks/lib/alias.ts
    usecase: 共通
    summary: 解決した値のうち、種類の必須のキーで値が空のものを返却する
    kind: 関数
    scope: public
    is_async: false
    args:
      - name: type
        type: AliasType
        required: true
        passing: positional
        description: 文書の引用の種類
      - name: values
        type: Record<AliasKey, unknown>
        required: true
        passing: positional
        description: 解決した値（`name` は補った後）
    returns:
      type: string[]
      description: 値が空のキー。env で `url`・`port` がどちらも空のときは `url`・`port` を含む。全てに値があれば空
    process: |-
      1. REQUIRED_KEYS の type のキーごとに、値が空でない文字列・数値・真偽値のどれでもなければ返却する並びに入れる
      2. type が env で `url`・`port` の値がどちらも 1 と同じ規則で空なら、`url` と `port` を入れる
    unit_tests:
      - name: test_missing_keys
        case: 正常
        summary: 種類の必須のキーで値が空のものを返却する
        condition: term で `description` が空文字、command で全てのキーに値がある（`id` が数値）
        mock: なし
        expected: term は `['description']`、command は空
      - name: test_missing_keys_when_env
        case: 正常
        summary: env は url・port の 1 つ以上を求める
        condition: env で `port` だけを持つ値と、`url`・`port` をどちらも持たない値
        mock: なし
        expected: 前者は空、後者は `['url', 'port']`
  - name: filterByScope
    title: 作業場所での絞り込み
    kind: 関数
    container: hooks/lib/alias.ts
    usecase: 共通
    summary: 読み込む行のうち、作業場所が `scope.cwd` のどの glob にも該当しない行を除外する
    scope: public
    is_async: false
    args:
      - name: aliases
        type: readonly ResolvedAlias[]
        required: true
        passing: keyword
        description: 参照するリポジトリの行と設定ファイルの aliases の行を並べたもの
      - name: cwd
        type: string
        required: true
        passing: keyword
        description: セッションを起動したプロジェクトの直下（`$.session.root()`）
    returns:
      type: ResolvedAlias[]
      description: '`cwdPatterns` が undefined の行と、`cwd` が `cwdPatterns` のどれかに該当する行。aliases の順のまま'
    process: |-
      1. `cwdPatterns` が undefined の行は残す
      2. それ以外の行は、`cwdPatterns` のどれかでパスと glob の照合（path は `cwd`）が true のときだけ残す
    callees:
      - MOD-16#functions[matchPathGlob]
    refs:
      - IF-3#constraints[作業場所の絞り]
    unit_tests:
      - name: test_filter_by_scope
        case: 正常
        summary: 絞りを持たない行は残し、作業場所が該当しない行を除外する
        condition: "`cwd` が `/repo/sample/wt`。`cwdPatterns` が undefined の行、`['/repo/sample/**']` の行、`['/repo/other/**', '/repo/sample']` の行"
        mock: なし
        expected: 1 件目と 2 件目の行だけが、この順に残る
