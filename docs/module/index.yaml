summary: クラス / 関数 / 関数型 インデックス（単体テストの元）
items:
  - page: MOD-1.ts.yaml
    summary: 入口が `prompt.submit`・`session.compact`・`session.end`・`tool.call` に登録するイベントの処理
  - page: MOD-2.ts.yaml
    summary: 設定ファイルの `aliases` の行と `project-index.yaml` の `documents` の行をスキーマで検証して取り出し、`id` の重なった行を除外する。文書ごとに `metadata` の値を解決し、種類ごとの必須のキーを確認する
  - page: MOD-3.ts.yaml
    summary: '`schemas/aliases.schema.yaml` から生成して同梱するスキーマのオブジェクトで、エイリアスの元の行（設定ファイルの `aliases` と `project-index.yaml` の `documents` の行）を検証する。検証はスキーマが使用するキーワードだけを解釈し、外部のライブラリを使用しない'
  - page: MOD-4.mjs.yaml
    summary: '`schemas/aliases.schema.yaml` から `hooks/lib/aliases-schema.ts` を生成し、一致を確認するスクリプト'
  - page: MOD-5.ts.yaml
    summary: ツールの呼び出しの引数から、参照している文書そのものの単語を照合の結果から除外する
  - page: MOD-6.ts.yaml
    summary: 参照するリポジトリの `project-index.yaml` を更新時刻が変わったときだけ参照し、`documents` のうち `alias_type` を持つ行だけを取り出して `paths` をそのフォルダから解決する
  - page: MOD-7.tsx.yaml
    summary: Claude Code が `hooks/hooks.json` の `modules` から参照する hooks モジュールの入口と、プラグイン・マーケットプレイス・型の確認の定義ファイル
  - page: MOD-8.ts.yaml
    summary: ツールの結果の本文から `!{名前}` の名前を検出し、`env -0` の出力から値を取得して、文脈に追加する値の行を組み立てる
  - page: MOD-9.ts.yaml
    summary: 該当した単語から記録済みの単語を除き、`max_items`・`max_chars` に収まる単語を選んで、追加する文脈の文字列を組み立てる
  - page: MOD-10.ts.yaml
    summary: 入力と単語を同じ正規化でそろえ、部分文字列として含まれる単語を返却し、出た位置か出た回数の順に並べる。正規表現は使用しない
  - page: MOD-11.ts.yaml
    summary: 文書の `inject_when` の値を照合条件として検査し、照合した本文で評価して、照合条件に該当しない単語を該当した単語から除外する
  - page: MOD-12.ts.yaml
    summary: '`$.state` に配置する値の型の契約。`.claude-plugin/plugin.json` の `types` が指す'
  - page: MOD-13.ts.yaml
    summary: '`schemas/aliases.schema.yaml` から生成して同梱するスキーマのオブジェクト。手で書き換えない'
  - page: MOD-14.ts.yaml
    summary: 会話ごとに文脈を追加した単語のキーを `$.state` に持ち、参照・追加・消去をする。会話はメインの会話がセッション、サブエージェントがセッションと `agentId` の組
  - page: MOD-15.ts.yaml
    summary: 設定ファイルのパスの取得、設定ファイルの検証と既定値の適用、起動したプロジェクトに該当する `projects` を重ねた実効の設定の組み立て、入力の出所の判定
  - page: MOD-16.ts.yaml
    summary: パスの展開・glob の展開・更新時刻で変わったファイルだけの読み込みと、YAML のパース。設定ファイル・スキーマ・`project-index.yaml`・`aliases` の要素が指す YAML が使用する
  - page: MOD-17.ts.yaml
    summary: エイリアスの元の行の `paths` に該当する YAML を参照し、文書ごとに `metadata` の値を解決して、照合する単語と文脈に並べる列を持つ単語の一覧を作る
