# GitHub Pages 用 Jekyll 設定

title: alias-inject

# ビルドから除外するもの（visibility が internal の文書だけを持つ種類のフォルダと、PR ドキュメント・モック・生成物）
exclude:
  - README.md
  - architecture/
  - config/
  - dev-command/
  - interface/
  - library/
  - module/
  - nonfunctional/
  - scenario/
  - test-procedure/
  - pr/
  - mock/
  - generated/
