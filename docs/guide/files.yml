    visibility: public
    category: 使い方
  - path: 設定の移し替え.md
    name: 設定の移し替え
    description: 端末の設定と project-index.yaml を旧構造から行の `alias_type` と列名の `metadata` の構造へ移し替える手順と対応を説明し、設定を今の構造へ移すときに参照する。
    tags: [topic:設定の移し替え, topic:設定ファイル, topic:エイリアス, topic:メタデータ, tool:project-index]
