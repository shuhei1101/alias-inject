summary: alias-inject の使用方法（はじめに・使い方・リファレンス）
items:
  - page: コアコンセプト-引用の文脈.md
    summary: 入力の単語を YAML と照合し、モデルにだけ文脈を追加する仕組み
  - page: コアコンセプト-変数参照の値.md
    summary: 参照した本文の `!{名前}` に、同じ名前の環境変数の値を文脈として追加する仕組み
  - page: 変更履歴.md
    summary: バージョンごとに入った PR の一覧
  - page: セットアップ.md
    summary: 前提条件と、マーケットプレイスからユーザースコープで入れて、設定ファイルを用意する手順
  - page: 設定の移し替え.md
    summary: 端末の設定と project-index.yaml を、`metadata.alias_type` の構造と旧い `aliases[]` の構造（`type`・`fields`）から、行の `alias_type` と列名の `metadata` の構造へ移し替える手順
  - page: エイリアスを登録するかを決める.md
    summary: 文書を指す名前を、エイリアスとして登録するかを決める判定フローチャート
  - page: 設定ファイル.md
    summary: 設定ファイルの項目・既定値・`alias_type` ごとの `metadata` のキーの一覧
  - page: エイリアスのスキーマ.md
    summary: エイリアスの元の行のキー・`metadata` の値・`alias_type` ごとのキー・タグを指定した取り込み方
