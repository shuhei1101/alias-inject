  - name: 正常系（用語のやめた言い方）
    summary: 用語の `avoid` のやめた言い方がヒットしたら、使用しない単語のセクションにやめた言い方と用語の単語を追加し、exclude の単語は照合しない
    setup:
      - name: Mock
        description: 正常系と同じ
        notes: '-'
      - name: 用語の YAML
        description: '正常系の term-a に `avoid: [旧エー, OldA]`、term-b に `avoid: 旧ビー`（文字列）を加える'
        notes: 用語の行は `metadata` を記載せず、`avoid` も同じ名前の列から取る
      - name: 設定ファイル
        description: '正常系に加え `exclude: [旧ビー]`'
        notes: 一般的な単語のやめた言い方を照合から除外する手段
      - name: 入力
        description: 1 回目「旧エーと oldA と旧ビーと旧シーと term-b」、2 回目「旧エーとは」
        notes: oldA は正規化で OldA に該当する
      - name: 照合条件を持つ用語
        description: '正常系（照合条件を持つ文書）の term-c に `avoid: 旧シー` を加えて持つ'
