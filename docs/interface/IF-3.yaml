id: IF-3
visibility: internal
title: "入力への引用の文脈の追加"
entry:
  kind: trigger
  value: '`prompt.submit`（入力の送信ごと）'
flows:
  - name: 正常系
    summary: 初めて出た単語の文脈を追加し、記録に入れる
    setup:
      - name: Mock
        description: テストの `on` で `settings.read`・`fs.stat`・`fs.list`・`fs.read` をメモリのファイル表から応答し、`mock.env` で `HOME` を指定する。`prompt.submit` は届いた `text`・`context` をそのまま返却する。`ui.log` は届いた行を記録する
        notes: '-'
      - name: ユーザースコープの settings
        description: '`env.ALIAS_INJECT_CONFIG` が `~/.config/alias-inject/settings.yaml`'
        notes: '-'
      - name: 設定ファイル
        description: '`global.repositories` に `config: /repo/knowledge/project-index.yaml` の要素を 1 つ持つ'
        notes: '-'
      - name: project-index.yaml
        description: '`documents` に、`id: terms`・`paths: [terms/*.yaml]`・`alias_type: term` の行と、`alias_type` を持たず `paths: [docs/*.yaml]` の行を持つ'
        notes: 用語の行は `records` と `metadata` を記載せず、`id`・`name`・`aliases`・`description` を同じ名前の列から取る。`paths` は `/repo/knowledge/` を起点に解決される
      - name: 用語の YAML
        description: '`/repo/knowledge/terms/term-a.yaml`（`id: term-a`・`name: Term-A`・`aliases: [用語エー]`・`description`）と `term-b.yaml`（`id: term-b`・`description`。`name` を持たない）'
        notes: term-b の単語はファイル名の `term-b` になる
      - name: 文書の YAML
        description: '`/repo/knowledge/docs/doc-z.yaml`（`name: doc-z`）'
        notes: '`alias_type` を持たない行の YAML は参照しない'
      - name: 入力
        description: '`text` が「用語エーと doc-z を説明して」、`origin.kind` が `composer`'
        notes: エイリアスでヒットさせる。2 回目の入力「term-a とは」で、大文字を含む単語 `Term-A` が正規化で該当し、記録済みで追加されないことを確認する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant IF as prompt.submit
        participant FS as ファイル・settings
        participant ST as $.state

        CC->>IF: text・origin
        IF->>FS: ユーザースコープの settings を参照する
        FS-->>IF: ALIAS_INJECT_CONFIG
        IF->>FS: 設定ファイルと project-index.yaml を参照する
        FS-->>IF: repositories と documents
        IF->>IF: alias_type を持つ行だけを取り出し、スキーマで検証する
        IF->>FS: 用語の行の paths に該当する YAML を参照する
        FS-->>IF: ファイルごとの文書
        IF->>IF: metadata の値を文書ごとに解決する
        IF->>ST: セッションの記録を参照する
        ST-->>IF: 記録なし
        IF->>IF: 正規化して照合し term-a がヒットする
        IF->>ST: term-a を記録に入れる
        IF-->>CC: text はそのまま、context に term-a の文脈
      ```
    expected:
      - 返る `text` が入力の `text` と同じ
      - 返る `context` が 1 要素で、`# この発言に出る用語`・`## 用語`・term-a の単語 `Term-A`・`id`・`description` を含む
      - 返る `context` に term-b と doc-z が含まれない
      - '`/repo/knowledge/docs/` の YAML に `fs.read` が呼ばれていない'
      - 同じセッションで続けて「term-a とは」を送信すると、返る `context` が空
    test: test_normal
  - name: 正常系（上限を超える）
    summary: 入力に先に出た単語から max_items 単語だけを追加し、除外された単語は記録しない
    setup:
      - name: Mock
        description: 正常系と同じ
      - name: 設定ファイル
        description: 正常系に加え `max_items` が 1
      - name: 入力
        description: 1 回目は「term-a と term-b の違い」、2 回目は「term-b について」
        notes: term-a が先に出る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant IF as prompt.submit
        participant ST as $.state

        CC->>IF: term-a と term-b の違い
        IF->>IF: 2 つの単語がヒットし、先に出た term-a だけを選ぶ
        IF->>ST: term-a だけを記録に入れる
        IF-->>CC: context に term-a の文脈
        CC->>IF: term-b について
        IF->>ST: term-b を記録に入れる
        IF-->>CC: context に term-b の文脈
      ```
    expected:
      - 1 回目の返る `context` に term-a が含まれ、term-b が含まれない
      - 2 回目の返る `context` に term-b が含まれる
    test: test_normal_when_over_item_limit
  - name: 正常系（文字数の上限を超える）
    summary: 追加すると max_chars を超える単語を飛ばし、後ろの収まる単語を追加する
    setup:
      - name: Mock
        description: 正常系と同じ
      - name: 用語の YAML
        description: term-long（`description` が 500 文字）と、term-a・term-b（`description` が短い）
      - name: 設定ファイル
        description: 正常系に加え `max_chars` が 300
        notes: term-a だけ、term-a と term-b のどちらの文脈も 300 文字に収まる
      - name: 入力
        description: 「term-a・term-long・term-b を比べて」
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant IF as prompt.submit
        participant ST as $.state

        CC->>IF: term-a・term-long・term-b を比べて
        IF->>IF: term-a を追加する
        IF->>IF: term-long は追加すると上限を超えるので飛ばす
        IF->>IF: term-b を追加する
        IF->>ST: term-a と term-b を記録に入れる
        IF-->>CC: context に term-a と term-b の文脈
      ```
    expected:
      - 返る `context` に term-a と term-b が含まれ、term-long が含まれない
      - 返る `context` の追加した要素が 300 文字以下
      - 同じセッションで `max_chars` を 4000 に戻して「term-long とは」を送信すると、term-long の文脈が追加される
    test: test_normal_when_over_char_limit
  - name: 正常系（出所が対象外）
    summary: origins に対応づかない出所の入力はそのまま返却する
    setup:
      - name: Mock
        description: 正常系と同じ
      - name: 設定ファイル
        description: 正常系に加え `origins` が `[plugin]`
      - name: 入力
        description: '`text` が「term-a とは」、`origin.kind` が `composer`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant IF as prompt.submit

        CC->>IF: term-a とは（origin は composer）
        IF->>IF: composer は user で origins に無い
        IF-->>CC: 受け取ったまま
      ```
    expected:
      - 返る `text`・`context` が受け取ったまま
      - 同じセッションで `origin.kind` が `plugin` の「term-a とは」を送信すると、term-a の文脈が追加される（前の入力で記録されていない）
    test: test_normal_when_origin_excluded
  - name: 正常系（スラッシュコマンド）
    summary: スラッシュコマンドの行は照合せずにそのまま返却する
    setup:
      - name: Mock
        description: 正常系と同じ
      - name: 入力
        description: '`text` が「/review term-a」で `command` が入っている'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant IF as prompt.submit

        CC->>IF: /review term-a（command あり）
        IF-->>CC: 受け取ったまま
      ```
    expected:
      - 返る `text`・`context` が受け取ったまま
      - term-a が記録に入っていない（続けて送信する「term-a とは」で文脈が追加される）
    test: test_normal_when_slash_command
  - name: 正常系（設定ファイルのパスが無い）
    summary: ALIAS_INJECT_CONFIG が無く、既定のパスにも設定ファイルが無いときはそのまま返却する
    setup:
      - name: Mock
        description: 正常系と同じ。`mock.env` に `ALIAS_INJECT_CONFIG`・`XDG_CONFIG_HOME` を指定しない
      - name: ユーザースコープの settings
        description: '`env` に `ALIAS_INJECT_CONFIG` が無い'
      - name: 設定ファイル
        description: 既定のパス `~/.config/alias-inject/settings.yaml` がメモリのファイル表に無い
      - name: 入力
        description: 「term-a とは」
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant IF as prompt.submit
        participant FS as ファイル・settings

        CC->>IF: term-a とは
        IF->>FS: ユーザースコープの settings と環境変数を参照する
        FS-->>IF: ALIAS_INJECT_CONFIG が無い
        IF->>FS: 既定のパスを調べる
        FS-->>IF: ファイルが無い
        IF-->>CC: 受け取ったまま
      ```
    expected:
      - 返る `text`・`context` が受け取ったまま
      - '`fs.read` が呼ばれていない'
      - テストの `on` の `ui.log` に行が届いていない
    test: test_normal_when_config_path_missing
  - name: 正常系（プロジェクトの設定を重ねる）
    summary: 該当した projects の aliases の行を global に重ね、同じ単語を alias_type ごとの両方のセクションに追加する
    setup:
      - name: Mock
        description: 正常系に加え、起動したプロジェクトの直下を `/repo/sample` にする
        notes: '-'
      - name: 設定ファイル
        description: '正常系の `global` に加え、`projects` に `match: sample`（`aliases` に `id: commands`・`paths: [docs/command.yaml]`・`records: commands`・`alias_type: command` の行）と、`match: other`（同じ構成で `paths: [docs/other.yaml]`）の要素を持つ'
        notes: '`paths` は相対パスで `/repo/sample/docs/` に解決される'
      - name: コマンドの YAML
        description: '`/repo/sample/docs/command.yaml` の配列 `commands` に要素 term-a（`id: term-a`・`command: make term-a`。`name` を持たない）'
        notes: 単語は要素の `id` の `term-a` になる
      - name: 入力
        description: 「term-a とは」
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant IF as prompt.submit
        participant FS as ファイル・settings

        CC->>IF: term-a とは
        IF->>FS: 設定ファイルと project-index.yaml を参照する
        FS-->>IF: global・projects の aliases と project-index.yaml の documents
        IF->>IF: match: sample だけを global に重ねる
        IF->>FS: 両方の行の YAML を参照する
        FS-->>IF: 文書
        IF-->>CC: context に「用語」と「コマンド」の両方のセクションで term-a
      ```
    expected:
      - 返る `context` に `## 用語` と `## コマンド` の両方のセクションがあり、それぞれに term-a が並ぶ
      - '`## コマンド` の term-a に `command: make term-a` が並ぶ'
      - '`match: other` の行の YAML は参照されていない'
    test: test_normal_when_project_matched
  - name: 正常系（ファイルの書き換え）
    summary: 更新時刻が変わった設定ファイルと YAML だけを再読み込みし、増えたファイルも参照する
    setup:
      - name: Mock
        description: 正常系と同じ。`fs.read` の呼ばれたパスを記録する
      - name: 用語の YAML
        description: 1 回目の入力の後に、term-a の YAML の `mtimeMs` を進めて `description` を書き換え、同じフォルダに term-c の YAML を追加する
      - name: 入力
        description: 1 回目「term-b とは」、2 回目「term-a と term-c」
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant IF as prompt.submit
        participant FS as ファイル・settings

        CC->>IF: term-b とは
        IF->>FS: 設定ファイルと YAML を参照する
        IF-->>CC: context に term-b
        CC->>IF: term-a と term-c
        IF->>FS: mtimeMs とフォルダの一覧を確認する
        FS-->>IF: term-a が更新、term-c が増えた
        IF->>FS: term-a と term-c の YAML だけを参照する
        IF-->>CC: context に書き換え後の term-a と term-c
      ```
    expected:
      - 2 回目の返る `context` に、書き換え後の term-a の `description` と term-c が含まれる
      - 2 回目の入力で `fs.read` が呼ばれたのは term-a と term-c の YAML だけ（設定ファイルと term-b の YAML は再読み込みしていない）
    test: test_normal_when_files_changed
  - name: 正常系（別のリポジトリの同じ ID）
    summary: 別のリポジトリが同じ行の id と文書の id を使用しても、両方を追加して記録する
    setup:
      - name: Mock
        description: 正常系と同じ
        notes: '-'
      - name: 設定ファイル
        description: '`global.repositories` に `config: /repo/knowledge/project-index.yaml` と `config: /repo/other/project-index.yaml` の要素を持つ'
        notes: '-'
      - name: project-index.yaml
        description: '両方の `project-index.yaml` が、`documents` に正常系と同じ `id: terms` の行を持つ'
        notes: '-'
      - name: 用語の YAML
        description: '`/repo/knowledge/terms/` と `/repo/other/terms/` に、それぞれ `description` の違う文書 term-a を持つ'
        notes: '-'
      - name: 入力
        description: 1 回目も 2 回目も「term-a とは」
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant IF as prompt.submit
        participant ST as $.state

        CC->>IF: term-a とは
        IF->>IF: 両方のリポジトリの term-a がヒットする
        IF->>ST: 出所の違う 2 つの term-a を記録に入れる
        IF-->>CC: context の「用語」に 2 つの term-a
        CC->>IF: term-a とは
        IF->>ST: 記録を参照する
        IF-->>CC: 受け取ったまま
      ```
    expected:
      - 1 回目の返る `context` の `## 用語` に、両方のリポジトリの term-a の `description` が並ぶ
      - 2 回目の返る `context` が受け取ったまま
    test: test_normal_when_same_id_across_repositories
  - name: 正常系（無効にした行）
    summary: 'enabled: false の repositories の要素と行を参照せずに照合する'
    setup:
      - name: Mock
        description: 正常系と同じ。`fs.read` の呼ばれたパスを記録する
        notes: '-'
      - name: 設定ファイル
        description: '正常系の `global.repositories` に加え、`enabled: false` で `config: /repo/other/project-index.yaml` の要素を持つ'
        notes: '-'
      - name: project-index.yaml
        description: '`/repo/knowledge/project-index.yaml` は正常系の行に加え、`enabled: false` で `id: drafts`・`paths: [drafts/*.yaml]` の term の行を持つ。`/repo/other/project-index.yaml` は term-y を持つ YAML を指す term の行を持つ'
        notes: '-'
      - name: 用語の YAML
        description: '`/repo/knowledge/drafts/` に文書 term-x、`/repo/other/terms/` に文書 term-y を持つ'
        notes: '-'
      - name: 入力
        description: 「term-a・term-x・term-y」
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant IF as prompt.submit
        participant FS as ファイル・settings

        CC->>IF: term-a・term-x・term-y
        IF->>FS: 設定ファイルと有効な project-index.yaml だけを参照する
        IF->>FS: 有効な行の YAML だけを参照する
        FS-->>IF: 文書
        IF-->>CC: context に term-a だけ
      ```
    expected:
      - 返る `context` に term-a があり、term-x と term-y が無い
      - '`/repo/other/project-index.yaml` と `/repo/knowledge/drafts/` の YAML に `fs.read` が呼ばれていない'
    test: test_normal_when_disabled
  - name: 正常系（project-index.yaml の書き換え）
    summary: 更新時刻が変わった project-index.yaml を再読み込みし、追加した documents の行で照合する
    setup:
      - name: Mock
        description: 正常系と同じ。`fs.read` の呼ばれたパスを記録する
        notes: '-'
      - name: project-index.yaml
        description: '1 回目の入力の後に `mtimeMs` を進め、`documents` に `id: commands`・`paths: [commands/*.yaml]`・`alias_type: command` の行を追加する'
        notes: '-'
      - name: コマンドの YAML
        description: '`/repo/knowledge/commands/cmd-a.yaml`（`id: cmd-a`・`name: cmd-a`・`command: make cmd-a`）'
        notes: '-'
      - name: 入力
        description: 1 回目「term-a とは」、2 回目「term-a と cmd-a」
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant IF as prompt.submit
        participant FS as ファイル・settings

        CC->>IF: term-a とは
        IF-->>CC: context に term-a
        CC->>IF: term-a と cmd-a
        IF->>FS: mtimeMs を確認する
        FS-->>IF: project-index.yaml が更新
        IF->>FS: project-index.yaml とコマンドの YAML を参照する
        IF-->>CC: context に cmd-a だけ
      ```
    expected:
      - '2 回目の返る `context` に `## コマンド` の cmd-a と `command: make cmd-a` があり、term-a が無い（記録が残っている）'
      - 2 回目の入力で `fs.read` が呼ばれたのは `project-index.yaml` とコマンドの YAML だけ
    test: test_normal_when_repository_config_changed
  - name: 異常系（設定ファイルを読み込めない）
    summary: 設定ファイルを読み込めないときは何も追加せずに返却する
    setup:
      - name: Mock
        description: 正常系と同じ。`ALIAS_INJECT_CONFIG` が指す設定ファイルの `fs.read` と `fs.stat` はファイルが無い例外を返却する
        notes: 既定のパス `~/.config/alias-inject/settings.yaml` に term-a を照合できる設定ファイルを配置し、既定のパスへ切り替えないことを固定する
      - name: 入力
        description: 「term-a とは」
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant IF as prompt.submit
        participant FS as ファイル・settings

        CC->>IF: term-a とは
        IF->>FS: 設定ファイルを参照する
        FS-->>IF: ファイルが無い
        IF-->>CC: 受け取ったまま
      ```
    expected:
      - 返る `text`・`context` が受け取ったまま
      - フックが例外で終わらない（入力が止まらない）
      - テストの `on` の `ui.log` に、`to` が `debug` で設定ファイルのパスと理由を含む行が届いている
    test: test_error_when_config_unreadable
  - name: 異常系（project-index.yaml を読み込めない）
    summary: 読み込めない project-index.yaml のリポジトリだけを除外し、他のリポジトリの文脈は追加する
    setup:
      - name: Mock
        description: 正常系と同じ。`/repo/missing/project-index.yaml` の `fs.stat` と `fs.read` はファイルが無い例外を返却する
      - name: 設定ファイル
        description: '`global.repositories` に `config: /repo/missing/project-index.yaml` と `config: /repo/knowledge/project-index.yaml` の要素を持つ'
      - name: 入力
        description: 「term-a とは」
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant IF as prompt.submit
        participant FS as ファイル・settings

        CC->>IF: term-a とは
        IF->>FS: 両方の project-index.yaml を参照する
        FS-->>IF: /repo/missing はファイルが無い
        IF->>IF: /repo/missing のリポジトリを照合から除外する
        IF-->>CC: context に「用語」の term-a
      ```
    expected:
      - 返る `context` に `## 用語` の term-a がある
      - フックが例外で終わらない
      - テストの `on` の `ui.log` に、`to` が `debug` で `/repo/missing/project-index.yaml` と理由を含む行が届いている
    test: test_error_when_repository_unreadable
  - name: 異常系（スキーマに合わない行）
    summary: スキーマに合わない行・id の重なった後の行だけを除外し、他の行の文脈は追加する
    setup:
      - name: Mock
        description: 正常系と同じ
        notes: '-'
      - name: project-index.yaml
