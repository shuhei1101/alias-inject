    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant IF as prompt.submit
        participant FS as ファイル・settings
        participant ST as $.state

        CC->>IF: 旧エーと oldA と旧ビーと旧シーと term-b
        IF->>FS: 設定ファイル・project-index.yaml・用語の YAML を参照する
        FS-->>IF: 文書（avoid を含む）
        IF->>IF: 用語の avoid のやめた言い方ごとに、使用しない単語のセクションの項目を作る
        IF->>IF: exclude の旧ビーを除いて照合し、旧エー・OldA・旧シー・term-b がヒットする
        IF->>IF: 旧シーを term-c の照合条件で評価して除外する
        IF->>ST: 旧エー・OldA・term-b を記録に入れる
        IF-->>CC: context に用語と使用しない単語のセクション
        CC->>IF: 旧エーとは
        IF->>IF: 旧エーがヒットするが記録済み
        IF-->>CC: 受け取ったまま
      ```
    expected:
      - 1 回目の返る `context` の `## 用語` に term-b が並び、`Term-A` が並ばない
      - '1 回目の返る `context` の `## 使用しない単語` に、行「- 旧エー（id: term-a）」と行「- OldA（id: term-a）」がこの順に並び、それぞれの子に `replacement: Term-A` が並ぶ'
      - 1 回目の返る `context` に 旧ビー が含まれない
      - 2 回目の返る `context` が空
      - テストの `on` の `ui.log` に行が届いていない
      - 1 回目の返る `context` に 旧シー が含まれない（やめた言い方も用語の照合条件で評価する）
    test: test_normal_when_term_avoid
lead: 入力の文を、参照するリポジトリの `project-index.yaml` の documents の行と設定ファイルの `aliases` の行が指す YAML の単語と照合し、そのセッションで初めて出た単語の引用の文脈を `context` に追加して返却する。
idempotent: false
side_effects: 追加した単語を `$.state` のセッションの記録に入れる。読み込んだ設定と単語の一覧をモジュールの中に持つ。ファイルへの書き込みと外への送信はしない
callers:
  - LIB-1#
exclusivity: Claude Code が 1 セッションの `prompt.submit` を順に呼ぶ。メインの会話の記録を `tool.call` と共有するため、記録は [ツールの結果への引用の文脈の追加](id:IF-2) と同じく `$.state.set` の `ifVersion` で書き込み、一致しなかったら再読み込みして記録済みの単語を再除外する（3 回まで）。上限まで一致しなかったら、debug log に出して文脈を追加せずに返却する
request:
  - name: text
    type: string
    required: true
    location: argument
    description: 入力の文（貼り付けは展開済み）
  - name: command
    type: PromptSubmitCommand
    required: false
    default: なし（スラッシュコマンドではない）
    location: argument
    description: スラッシュコマンドの行のときに入る。入っているときは照合しない
  - name: context
    type: readonly string[]
    required: false
    default: なし（他のフックが追加していない）
    location: argument
    description: 他のフックが追加した文脈。そのまま残し、末尾に追加する
  - name: origin.kind
    type: PromptOrigin['kind']
    required: true
    location: argument
    description: 入力の出所。設定の `origins` の `user`（`composer`・`bridge`・`sdk`）と `plugin`（`plugin`）に対応づける
response:
  - name: text
    type: string
    description: 受け取った `text` のまま
  - name: context
    type: readonly string[]
    description: 受け取った `context` の末尾に、今回追加する文脈を 1 要素で追加したもの。追加する単語が無いときは受け取ったまま
    constraints: 追加する要素は `max_chars` 文字まで
response_example: |
  ```markdown
  # この発言に出る用語

  ## 用語

  - 単一ユースケース（id: term-single-usecase）
    - description: 1 つの操作を始めから終わりまで記載するシナリオの単位
    - related: tpl-scenario（シナリオのテンプレート）

  ## コマンド

  - セットアップ（id: cmd-setup）
    - command: `uv sync`
    - cwd: /mnt/c/Users/shuhe/repo/ai-monitor
    - description: 依存を入れる
  ```
response_notes: '文脈は `# {heading}` の下に、`alias_type` ごとの `## {見出し}`（term: 用語 / doc: 文書 / command: コマンド / url: URL / skill: スキル / tool: ツール / path: パス / env: 環境 / avoid: 使用しない単語 の順）と単語ごとの箇条書きで並べる。どのリポジトリ・どの行の単語も、同じ `alias_type` なら 1 つのセクションに並べる。単語は文書の `name` の値にする。箇条書きの子には `alias_type` ごとのキー（term: `description`・`related` / doc: `description` / command: `command`・`cwd`・`description` / url: `url`・`description` / skill: `skill`・`description` / tool: `tool`・`description` / path: `path`・`description` / env: `url`・`port`・`description` / avoid: `replacement`）のうち値のあるものだけを並べる。`alias_type` が term の文書の `avoid` のやめた言い方は、やめた言い方ごとに `## 使用しない単語` のセクションの項目にし、単語はやめた言い方の値、`id` は用語の `id`、子は `replacement` に用語の単語（`name` の値）を並べる。command の `command` と、skill の `skill`・tool の `tool`・path の `path` の値はインラインコード（バッククォート）で囲む。'
exceptions:
  - name: なし（正常終了）
    condition: 照合して文脈を追加したか、追加する単語が無く受け取ったまま返却した
  - name: なし（設定ファイルを読み込めない）
    condition: '`ALIAS_INJECT_CONFIG` が指す設定ファイルが無いか、設定ファイルを読み込めない・書式が誤っている'
    notes: '例外を外へ出さず、`$.ui.log(text, { to: "debug" })` で設定ファイルのパスと理由を debug log に出し、何も追加せずに `next(e)` へ引き渡す。`ALIAS_INJECT_CONFIG` が無く、既定のパスにも設定ファイルが無いときはログを出さない'
  - name: なし（YAML の書式の誤り）
    condition: '行の `paths` に該当する YAML を読み込めない・書式が誤っているか、`records` を記載した行でその配列が無い'
    notes: '例外を外へ出さず、`$.ui.log(text, { to: "debug" })` で YAML のパスと理由を debug log に出し、その YAML の文書だけを照合から除外する'
  - name: なし（project-index.yaml を読み込めない）
    condition: '`repositories` の要素の `config` が指す `project-index.yaml` が無い・読み込めない・書式が誤っているか、`documents` が並びでない'
    notes: '例外を外へ出さず、`$.ui.log(text, { to: "debug" })` で `project-index.yaml` のパスと理由を debug log に出し、そのリポジトリの行だけを照合から除外する'
  - name: なし（スキーマに合わない行）
    condition: '設定ファイルの `aliases` の行か、`project-index.yaml` の `documents` のうち `alias_type` を持つ行が `schemas/aliases.schema.yaml` に合わない（旧構造の要素・9 つに無い `alias_type`・列名の文字列でない `metadata` の値・1 つ以上の文字列の並びでない `scope.cwd` を含む）か、`project-index.yaml` の `documents` の行が行の `alias_type` を持たず `metadata.alias_type` を持つか、同じ出所の中で先の行と `id` が重なる'
    notes: '例外を外へ出さず、`$.ui.log(text, { to: "debug" })` で出所（`project-index.yaml` か設定ファイルのパス）・行の `id`（無ければ並びの位置）・理由を debug log に出し、その行だけを照合から除外する'
  - name: なし（必須の値が空の文書）
    condition: 文書ごとに解決した `metadata` の値で、`alias_type` の必須のキーの値が空（env は `url`・`port` の両方が空）
    notes: '例外を外へ出さず、`$.ui.log(text, { to: "debug" })` で YAML のパス・文書の `id`（空なら `records` の並びの位置）・空のキーを debug log に出し、その文書だけを照合から除外する'
  - name: なし（照合条件が誤っている文書）
    condition: '文書の `inject_when` の値が制約『照合条件』に合わない（例: 知らないキー・空の束・4 レイヤー以上の入れ子・`text` 以外の `field`・`contains`・`not_contains` 以外の `op`・空の `values`・文字列でない `values` の要素・`any`・`all` 以外の `match`・真偽値でない `case_sensitive`）'
    notes: '例外を外へ出さず、`$.ui.log(text, { to: "debug" })` で YAML のパス・文書の `id`・誤りの箇所（`inject_when` からのパス）と理由を debug log に出し、その文書だけを照合から除外する'
constraints:
  - item: 処理時間
    constraint: 入力の送信で増える待ち時間は 200ms まで
    decided_by: NFR-1#requirements[入力の送信で増える待ち時間]
    notes: ファイルは更新時刻が変わったときだけ参照し、単語の一覧はモジュールの中に持つ
  - item: 単語の数の上限
    constraint: '`max_items` 単語まで（既定 20）。入力に最初に出た位置の早い単語から順に選び、同じ位置なら長い単語を先にする'
    decided_by: CFG-1#settings[global.max_items]
  - item: 文字数の上限
    constraint: 見出しを含む文脈全体で `max_chars` 文字まで（既定 4,000）。単語を選ぶ順に追加していき、追加すると上限を超える単語は飛ばして、後ろの単語で収まるものを続けて追加する
    decided_by: CFG-1#settings[global.max_chars]
    notes: 上限で除外された単語は記録に入れず、次に出た入力で追加の対象になる
  - item: 照合
    constraint: 入力と文書の `name`・`aliases` の単語と、`alias_type` が term の文書の `avoid` のやめた言い方を NFKC・英字の小文字・前後の空白の除去でそろえ、単語が入力の部分文字列に含まれるかで判定する。正規表現は使用しない。`exclude` の単語は照合しない
    notes: 1 つの文書の複数の単語（`name` と `aliases`）がヒットしても、その文書は 1 回だけ追加する
  - item: 記録の単位
    constraint: セッション ID（`$.session.id()`）ごとに、出所（`project-index.yaml` の絶対パスか設定ファイルの絶対パス）と行の `id` と文書の `id` の組で記録する。用語のやめた言い方は、その組にやめた言い方の値を加えた組で、用語とは別に記録する
    notes: 同じ文書をエイリアスで入力しても二度目は追加しない。別のリポジトリが同じ行の `id` と文書の `id` を使用しても、それぞれを追加する
  - item: 再読み込み
    constraint: 入力の送信ごとに、照合の前に設定ファイル・`project-index.yaml`・`paths` に該当する YAML の `mtimeMs` とフォルダの一覧を確認し、変わったものだけ再読み込みする。同じ `project-index.yaml` を `global` と `projects` の両方が指すときは 1 回だけ参照する
  - item: 出所
    constraint: '`origins` を記載しないときはすべての出所の入力に追加する。記載したときは、`origins` に対応づかない出所の入力には追加しない'
    decided_by: CFG-1#settings[global.origins]
  - item: 検証
    constraint: '設定ファイルの `aliases` の行と、参照した `project-index.yaml` の `documents` のうち `alias_type` を持つ行を、行ごとに `schemas/aliases.schema.yaml` で検証する。行と `metadata` の他のキーは弾かない。`enabled: false` の `repositories` の要素と行は参照しない。`id` の重なりは出所ごとに確認し、設定ファイルは `global` と該当した `projects` を重ねた並びで確認する。種類ごとの必須のキーは、文書ごとに解決した値で確認する'
    notes: '`project-index.yaml` は `documents` だけを参照し、トップレベルの `aliases` は参照しない。`documents` を持たない `project-index.yaml` は行 0 件として扱い、`alias_type` も `metadata.alias_type` も持たない行は検証せずに飛ばす。どちらもログを出さない'
  - item: 文書の取り出し
    constraint: '`records` を記載しない行は `paths` に該当した各ファイルを 1 件の文書にし、記載した行はファイルのその配列の各要素を 1 件の文書にする。`metadata` の値は文書の列名で、入れ子の列は `.` でつなぐ（`meta.summary`）。記載しないキーは同じ名前の列から取る。`name` が空なら、ファイルの文書はファイル名、`records` の要素は行の `body_file` が指す列の値のファイル名、それも空なら `id` を使用する（ファイル名は拡張子を除く）'
    notes: '-'
  - item: 照合条件
    constraint: '文書の `inject_when` の値（`metadata.inject_when` で列を指せる）を照合条件にし、名前・エイリアス・やめた言い方がヒットした文書のうち照合条件に該当する文書だけを残す。用語のやめた言い方は、その用語の照合条件で評価する。`inject_when` が無い・`null` の文書は照合条件を持たない。照合条件は、条件（`field`・`op`・`values`・`match`・`case_sensitive` を持つマッピング）か、束（`and`・`or` は条件か束の 1 つ以上の並び、`not` は条件か束の 1 つ。1 つの束はこの 3 つのキーのどれか 1 つだけを持つ）。`field` は照合した本文を指す `text` だけ。`op` は `contains`（`values` のどれか（`match: any`。既定）か全て（`match: all`）を本文が含む）と、その否定の `not_contains`。`case_sensitive` が `false`（既定）なら、本文と `values` を照合の正規化を適用して比べる。束の入れ子は最上位の束を 1 レイヤーとして 3 レイヤーまで'
    notes: 照合条件の評価は、照合で該当した文書だけに行う。照合条件で除外された単語は記録に入れず、次に出た入力で追加の対象になる
  - item: 作業場所の絞り
    constraint: エイリアスの元の行（設定ファイルの `aliases` の行と `project-index.yaml` の `documents` の行）が `scope.cwd` に glob を 1 つ以上並べたとき、セッションを起動したプロジェクトの直下（`$.session.root()`）がどれかの glob に該当する場合だけ、その行を照合に使用する。`scope` を記載しない行は全ての作業場所で使用する。glob は先頭の `~` をホームに展開し、相対パスは `paths` と同じ基準で解決する。`/**` で終わる glob はそのフォルダと配下のフォルダに該当し、`/**` を付けないパスはそのフォルダだけに該当する。`*` はフォルダの区切りを除く任意の文字列に該当する
    decided_by: CFG-1#settings[global.aliases[].scope.cwd]
    notes: 書式は dev-docs の `sources[].scope` と同じ。worktree のセッションは worktree のパスで判定する。該当しない行の YAML は読み込まない
  - item: 設定ファイルのパス
    constraint: ユーザースコープの settings の `env.ALIAS_INJECT_CONFIG`、環境変数 `ALIAS_INJECT_CONFIG`、`${XDG_CONFIG_HOME:-~/.config}/alias-inject/settings.yaml` の順に、最初に値があるものを使用する。`XDG_CONFIG_HOME` が空のときは `~/.config`
    notes: '`ALIAS_INJECT_CONFIG` が指すファイルを読み込めないときも既定のパスへ切り替えない。入力の送信ごとに再決定するので、settings と既定のパスの変更は次の入力から有効になる'
