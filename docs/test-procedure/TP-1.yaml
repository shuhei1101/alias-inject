id: TP-1
visibility: internal
title: "テスト実行方法"
layers:
  - id: TL-1
    name: 単体テスト（バック）
    description: '`claude plugin test` で実行する。`claude-code/testing` の `test` が hooks モジュールを読み込んだ環境で実行する。'
    prerequisites:
      - Claude Code 2.1.310 以上（`claude` が PATH にある）
      - '`hooks/hooks.json` が `modules` で入口を指している（無いと `no hooks module to load` で失敗する）'
      - ランナーの全件実行は、`gh` 2.87.0 以上（`gh workflow run` が作った実行の URL を出す）がログイン済みで、今のブランチを push 済みで、`.github/workflows/test.yml` が develop にある（無ければ `run_all` で回す）
    run_all: |-
      ```bash
      claude plugin test .
      ```
    location: runner
    run_runner: |-
      ```bash
      run_url=$(gh workflow run test.yml --ref "$(git branch --show-current)" | grep -o 'https://[^ ]*/actions/runs/[0-9]*') && run_id=${run_url##*/} && (rc=0; gh run watch "$run_id" --exit-status > /dev/null || rc=1; gh run view "$run_id" --log; exit $rc)
      ```
  - id: TL-2
    name: 結合テスト（バック）
    run_all: |-
      ```bash
      claude plugin test .
      ```
    description: '`tests/integration/` の下のテストを、単体テストと同じ `claude plugin test` で実行する。`claude-code/testing` の `test` が hooks モジュールを読み込んだ環境で、`on` に応答を登録して `$.prompt.submit`・`$.session.compact`・`$.session.end` を実行する。ファイルの指定はできないため、`tests/unit/` の単体テストも同時に流れる。'
    prerequisites:
      - Claude Code 2.1.310 以上（`claude` が PATH にある）
      - '`hooks/hooks.json` が `modules` で入口を指している'
      - ランナーの全件実行は、`gh` 2.87.0 以上（`gh workflow run` が作った実行の URL を出す）がログイン済みで、今のブランチを push 済みで、`.github/workflows/test.yml` が develop にある（無ければ `run_all` で回す）
    location: runner
    run_runner: |-
      ```bash
      run_url=$(gh workflow run test.yml --ref "$(git branch --show-current)" | grep -o 'https://[^ ]*/actions/runs/[0-9]*') && run_id=${run_url##*/} && (rc=0; gh run watch "$run_id" --exit-status > /dev/null || rc=1; gh run view "$run_id" --log; exit $rc)
      ```
  - id: TL-3
    name: E2E テスト
    run_all: |-
      ```bash
      node --test 'tests/e2e/workflow/*.e2e.ts'
      ```
    description: Node の組み込みのテストランナー（`node --test`）で `tests/e2e/workflow/` の `*.e2e.ts` を実行する。テストごとに検証用のブランチを本物のリポジトリへ push し、`gh` で `.github/workflows/test.yml` を起動して、実行の結論・step ごとの結論・成果物を確認し、ブランチを削除する。ファイル名を `*.test.ts` にしないため、`claude plugin test` の対象にならない。
    prerequisites:
      - Node 24 以上（`.ts` の型を除去して実行する）
      - '`gh` 2.87.0 以上が、リポジトリへ push と workflow の起動ができるアカウントでログイン済み'
      - '`.github/workflows/test.yml` が develop にある'
      - 検証用のブランチの push と削除、ランナーでの workflow の実行が、テストの関数ごとに発生する
      - Claude Code 2.1.310 以上（`claude` が PATH にある。正常系で、同じ commit を手元の `claude plugin test .` で回した skip の件数と比べる）
    run_one:
      label: テスト
      command: |-
        ```bash
        node --test --test-name-pattern '^{テストの関数名}$' tests/e2e/workflow/test-yml.e2e.ts
        ```
    location: local
  - id: TL-4
    name: 非機能要件テスト
    run_all: 未確定
  - id: TL-5
    name: 外部疎通テスト
    run_all: 未確定
  - id: TL-6
    name: lint
    description: TypeScript の型検査（`npm run typecheck`）と、プラグイン・ hooks モジュールの定義の検証（`claude plugin validate .`）と、同梱のスキーマが `schemas/aliases.schema.yaml` と一致するかの確認（`node scripts/gen-aliases-schema.mjs --check`）と、GitHub Actions の workflow の検査（`actionlint`）を回す。linter・formatter の設定はプロジェクトに無い。
    prerequisites:
      - '`npm ci` 済みで、`package.json` の script `typecheck` と `tsconfig.json` がある'
      - '`.claude-plugin/types/` が書き出されている（信頼済みのフォルダから `claude --plugin-dir {worktree}` の対話のセッションを 1 度起動すると書き出される）'
      - '`claude plugin validate .` の警告は終了コードを変えない（エラーだけが失敗になる）'
      - '`actionlint` が PATH にある（入れ方は開発コマンドの「環境構築（クローン直後）」）'
    location: local
    run_all: |-
      ```bash
      rc=0
      npm run typecheck || rc=1
      claude plugin validate . || rc=1
      node scripts/gen-aliases-schema.mjs --check || rc=1
      actionlint || rc=1
      exit $rc
      ```
lead: テストの層ごとの実行の前提・全件実行のコマンド・実行場所を定め、テストや lint を実行するときに参照する。
