id: SC-1
visibility: internal
title: "セッション全体での引用の文脈の追加"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 差し替えない。tmux で `claude --plugin-dir {プラグインのフォルダ}` を起動し、`send-keys` で入力する
        notes: '`CLAUDE_CONFIG_DIR` を一時のフォルダにし、その settings.json の `env` に `ALIAS_INJECT_CONFIG` を配置する'
      - name: 設定ファイル
        description: '`global.repositories` に、一時のリポジトリの `project-index.yaml` を指す要素を 1 つ持つ'
      - name: project-index.yaml
        description: '`documents` に、`alias_type` が `term` で `records: terms` の行を 1 つ持ち、`paths` が用語の YAML に該当する'
      - name: 用語の YAML
        description: 配列 `terms` に単語 `term-a`・`term-b`・`term-d` を持つ
        notes: 後の手順で単語 `term-c` を追加する
      - name: 参照させるファイル
        description: 本文に `!{ALIAS_INJECT_E2E_VALUE}` と term-b を含むテキストファイル
        notes: '`claude` の起動時に環境変数 `ALIAS_INJECT_E2E_VALUE` を `value-a` で設定する'
      - name: 書き込ませる・回答させる入力
        description: 入力の文に term-c・term-d を含めず、`term-` の後に 1 文字を続けてモデルに単語を組み立てさせる。Write は途中の文を出さずに呼ばせる
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        U0([利用者]) -->|term-a を含む入力| UC1([入力への引用の文脈の追加:正常シナリオ])
        UC1 -->|term-a を記録| UC2([入力への引用の文脈の追加:正常シナリオ（記録済みの単語だけ）])
        UC2 -->|用語の YAML に term-c を追加| UC3([設定とYAMLの再読み込み:正常シナリオ])
        UC3 -->|/compact| UC4([圧縮とクリアの後の記録の消去:正常シナリオ（圧縮）])
        UC4 -->|/clear| UC5([圧縮とクリアの後の記録の消去:正常シナリオ（クリア）])
        UC5 -->|term-b と変数参照を含むファイルを参照させる| UC6([参照した本文への変数参照の値の追加:正常シナリオ（引用の文脈と合わせる）])
        UC6 -->|term-b を含む入力| UC7([入力への引用の文脈の追加:正常シナリオ（記録済みの単語だけ）])
        UC7 -->|term- の後に d を続けた単語を組み立てさせ、Write で書き込ませる| UC8([ツールの結果への引用の文脈の追加:正常シナリオ（書き込む内容）])
        UC8 -->|term- の後に c を続けた単語を組み立てさせ、その単語を含む文を回答させる| UC9([応答の文への引用の文脈の追加:正常シナリオ])
        UC9 -->|term-d と term-c を含む入力| UC10([入力への引用の文脈の追加:正常シナリオ（記録済みの単語だけ）])
        UC10 --> DONE([単語ごとに 1 回だけ文脈が追加され、参照した本文の変数参照の値が届いた状態])

        click UC1 "id:SC-3#scenarios[正常シナリオ]"
        click UC2 "id:SC-3#scenarios[正常シナリオ（記録済みの単語だけ）]"
        click UC3 "id:SC-6#scenarios[正常シナリオ]"
        click UC4 "id:SC-4#scenarios[正常シナリオ（圧縮）]"
        click UC5 "id:SC-4#scenarios[正常シナリオ（クリア）]"
        click UC6 "id:SC-7#scenarios[正常シナリオ（引用の文脈と合わせる）]"
        click UC7 "id:SC-3#scenarios[正常シナリオ（記録済みの単語だけ）]"
        click UC8 "id:SC-2#scenarios[正常シナリオ（書き込む内容）]"
        click UC9 "id:SC-8#scenarios[正常シナリオ]"
        click UC10 "id:SC-3#scenarios[正常シナリオ（記録済みの単語だけ）]"
      ```

      <!-- /map -->
    expected:
      - 1 回目の入力にだけ term-a の文脈が追加されている
      - 2 回目の term-a を含む入力には文脈が追加されていない
      - YAML に追加した term-c は、書き換えた直後の入力で文脈が追加されている
      - '`/compact` の後と `/clear` の後の term-a を含む入力に、term-a の文脈がもう一度追加されている'
      - どの入力も文はそのままモデルに届いている
      - '`/clear` の後にファイルを参照させると、ツールの結果の後ろの文脈に term-b の引用の文脈と `変数参照の値: !{ALIAS_INJECT_E2E_VALUE} = value-a` の行がある'
      - その後の term-b を含む入力には文脈が追加されていない
      - 'term-d を含む内容を Write で書き込ませると、Write の結果の後ろの文脈に term-d の引用の文脈がある'
      - term-c を含む文を回答させると、次のモデルへの要求に term-c の引用の文脈が届いている
      - その後の term-d と term-c を含む入力には文脈が追加されていない
      - UC8・UC9 の入力には文脈が追加されていない
    test: test_normal
lead: 設定ファイルの書き換え・圧縮・`/clear` を挟んでも単語ごとに 1 回だけ引用の文脈が追加される複合ユースケースの流れを定め、セッション全体の振る舞いを変えるときに参照する。
primary_actor: 利用者
trigger: 利用者が alias-inject を入れた Claude Code の対話のセッションで入力する
preconditions:
  - ユーザースコープの settings.json の `env` の `ALIAS_INJECT_CONFIG` が設定ファイルを指している
  - 設定ファイルの `global.repositories` が `project-index.yaml` を指し、その `documents` の `alias_type` を持つ行が照合する用語の YAML を指している
success_guarantee: 入力の文は変わらず、初めて出た単語の引用の文脈だけがモデルに追加される。ツールで参照した本文も変わらず、本文に初めて出た単語の引用の文脈と本文の変数参照の値がツールの結果の後ろの文脈としてモデルに届く。書き込ませた内容と応答の文に初めて出た単語の引用の文脈も、入力・ツールの結果と同じ記録で 1 回だけモデルに届く。
minimal_guarantee: 設定ファイルや YAML を読み込めないときも、入力はそのままモデルに届く。
test_file: tests/e2e/複合ユースケース/test_session_flow.py
tags:
  - name: topic:引用の文脈
    main: true
  - name: topic:複合ユースケース
  - name: topic:セッション
  - name: topic:記録
  - name: topic:圧縮
  - name: topic:クリア
  - name: topic:設定ファイル
  - name: action:追加
