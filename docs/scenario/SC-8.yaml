id: SC-8
visibility: internal
title: 応答の文への引用の文脈の追加
lead: モデルの応答の文に初めて出た単語の引用の文脈を、応答の文を変えずに次のモデルへの要求に追加する流れを定め、応答の文への引用の文脈の追加を変えるときに参照する。
primary_actor: モデル
stakeholders:
  - name: 利用者
    interest: モデルが自分で出した用語・文書の名前についても、その説明がモデルに届き、次の作業で正しく扱われる
trigger: モデルが、単語を含む応答の文を出す
preconditions:
  - alias-inject が有効なセッションで動いている
success_guarantee: 応答の文は変わらずに表示・記録され、応答の文に初めて出た単語の引用の文脈が、その会話の次のモデルへの要求に届く。追加した単語は入力・ツールの結果と同じ記録に入り、どれかで一度追加した単語は再び追加されない。
minimal_guarantee: 設定ファイルや YAML を読み込めないときも、応答の文はそのまま表示・記録され、ターンは止まらない。
test_file: tests/e2e/単一ユースケース/test_response_text.py
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 差し替えない。tmux で `claude --plugin-dir {プラグインのフォルダ}` を起動し、`send-keys` で入力する
        notes: '`CLAUDE_CONFIG_DIR` を一時のフォルダにし、その settings.json の `env` に `ALIAS_INJECT_CONFIG` を配置する'
      - name: 設定ファイル
        description: 『入力への引用の文脈の追加』の正常シナリオと同じ（単語 `term-a`・`term-b` を持つ用語の YAML を、一時のリポジトリの `project-index.yaml` の `documents` の行で参照する）
      - name: 回答させる入力
        description: 入力の文に term-a を含めず、`term-` の後に `a` を続けた単語を組み立てさせ、ツールを使用せずにその単語を含む一文だけを回答させる
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant M as モデル
        participant CC as Claude Code
        participant P as alias-inject
        U->>CC: 単語を組み立てて回答させる入力を送信
        CC->>M: 入力を送信
        M-->>CC: term-a を含む応答の文
        CC->>P: turn.step の結果
        P->>P: 応答の文と単語を正規化して照合し term-a がヒットする
        P->>P: term-a をセッションの記録に入れる
        P->>CC: term-a の文脈を会話に追加する
        P->>CC: 追加した term-a の単語と id を表示する行を出す
        CC-->>U: 応答の文と表示の行を表示する
        U->>CC: 次の入力を送信
        CC->>M: 入力と、追加した term-a の文脈を送信
      ```

      <!-- /map -->
    expected:
      - 次のターンのモデルへの要求に、見出し「この発言に出る用語」の下で term-a の単語・`id`・`description` が並んだ文脈が届いている
      - term-b の文脈は追加されていない
      - 応答の文は変わらずに表示されている
      - 回答させた入力には文脈が追加されていない
      - 利用者の画面に、応答の文の後ろに追加した term-a の単語と `id` を示す行が 1 行表示されている（term-b は表示されていない）
      - 表示した行は、次のターンのモデルへの要求に入っていない
    test: test_normal
  - name: 正常シナリオ（途中の文）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: 回答させる入力
        description: 入力の文に term-a を含めず、`term-` の後に `a` を続けた単語を含む一文を出してから Bash で `echo ok` を実行し、最後に一文で回答させる
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant M as モデル
        participant CC as Claude Code
        participant P as alias-inject
        U->>CC: 途中の文を出してから Bash を呼ばせる入力を送信
        CC->>M: 入力を送信
        M-->>CC: term-a を含む途中の文と Bash の呼び出し
        CC->>P: turn.step の結果
        P->>P: 途中の文の照合で term-a がヒットし、記録に入れる
        P->>CC: term-a の文脈を会話に追加する
        CC->>CC: Bash を実行する
        CC->>M: Bash の結果と、追加した term-a の文脈を送信
        M-->>CC: 最後の文
      ```

      <!-- /map -->
    expected:
      - 同じターンの Bash の結果の後ろに term-a の文脈が届いている
      - 途中の文と最後の文は変わらずに表示されている
      - 途中の文で追加した term-a の単語と `id` の行が利用者の画面に 1 行表示されている
    test: test_normal_when_intermediate_text
  - name: 正常シナリオ（記録済みの単語だけ）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: セッションの記録
        description: 同じセッションで term-a を含む入力を 1 回送信済み
      - name: 回答させる入力
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant M as モデル
        participant CC as Claude Code
        participant P as alias-inject
        U->>CC: 単語を組み立てて回答させる入力を送信
        CC->>M: 入力を送信
        M-->>CC: term-a を含む応答の文
        CC->>P: turn.step の結果
        P->>P: 照合で term-a がヒットするが、入力で記録済み
        P->>CC: 会話に追加しない
        U->>CC: 次の入力を送信
        CC->>M: 入力だけを送信
      ```

      <!-- /map -->
    expected:
      - 次のターンのモデルへの要求に引用の文脈が追加されていない
      - 利用者の画面に表示の行が出ていない
    test: test_normal_when_only_recorded_terms
  - name: 正常シナリオ（サブエージェント）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: 設定ファイル
        description: 正常シナリオの設定に、照合から除外するツールとして `Agent` を指定する
      - name: 回答させる入力
        description: Agent でサブエージェントを起動し、サブエージェントに、入力の文に term-a を含めず `term-` の後に `a` を続けた単語を含む一文を出してから Bash で `echo ok` を実行させる
      - name: メインの会話の応答
        description: メインの会話のモデルには途中の文を出さずに Agent を呼ばせ、Agent の結果を受けた後は単語を含まない「完了」だけを回答させる
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant M as モデル
        participant S as サブエージェント
        participant CC as Claude Code
        participant P as alias-inject
        U->>CC: サブエージェントに回答させる入力を送信
        CC->>M: 入力を送信
        M->>CC: Agent を呼ぶ
        CC->>S: サブエージェントを起動
        S-->>CC: term-a を含む途中の文と Bash の呼び出し
        CC->>P: turn.step の結果（agentId あり）
        P->>P: サブエージェントの記録で照合し term-a を記録に入れる
        P->>CC: term-a の文脈をサブエージェントの会話に追加する
        CC->>S: Bash の結果と、追加した term-a の文脈を送信
      ```

      <!-- /map -->
    expected:
      - サブエージェントの Bash の結果の後ろに term-a の文脈が届いている
      - メインの会話の記録に term-a は入っていない（その後のメインの会話の term-a を含む入力に文脈が追加されている）
      - サブエージェントの途中の文で追加した term-a を示す行が、メインの会話の画面に表示されている
    test: test_normal_when_in_subagent
  - name: 異常シナリオ（設定ファイルを読み込めない）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: 設定ファイル
        description: YAML の書式が崩れた設定ファイル
        notes: '`ALIAS_INJECT_CONFIG` でこの設定ファイルを指す。`claude` の起動時に環境変数 `XDG_CONFIG_HOME` を一時のフォルダにし、その下の `alias-inject/settings.yaml` に term-a を照合できる設定ファイルを配置する（`ALIAS_INJECT_CONFIG` を読み込めないときに既定のパスを参照しない）'
      - name: 回答させる入力
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant M as モデル
        participant CC as Claude Code
        participant P as alias-inject
        U->>CC: 単語を組み立てて回答させる入力を送信
        CC->>M: 入力を送信
        M-->>CC: term-a を含む応答の文
        CC->>P: turn.step の結果
        P->>P: 設定ファイルを読み込めない
        P->>CC: 会話に追加しない
        CC-->>U: 応答の文をそのまま表示する
      ```

      <!-- /map -->
    expected:
      - 応答の文は変わらずに表示されている
      - 次のターンのモデルへの要求に引用の文脈が追加されていない
      - 利用者の画面に表示の行が出ていない
    test: test_error_when_config_unreadable
  - name: 正常シナリオ（表示をオフにした設定）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: 設定ファイル
        description: '正常シナリオの設定に `show_added: false` を記載する'
      - name: 回答させる入力
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant M as モデル
        participant CC as Claude Code
        participant P as alias-inject
        U->>CC: 単語を組み立てて回答させる入力を送信
        CC->>M: 入力を送信
        M-->>CC: term-a を含む応答の文
        CC->>P: turn.step の結果
        P->>P: 照合で term-a がヒットし、記録に入れる
        P->>CC: term-a の文脈を会話に追加し、表示の行は出さない
        CC-->>U: 応答の文をそのまま表示する
        U->>CC: 次の入力を送信
        CC->>M: 入力と、追加した term-a の文脈を送信
      ```

      <!-- /map -->
    expected:
      - 次のターンのモデルへの要求に term-a の文脈が届いている
      - 利用者の画面に表示の行が出ていない
    test: test_normal_when_display_off
  - name: 異常シナリオ（表示に失敗する）
    setup:
      - name: Mock
        description: Claude Code の `$.ui.log` が例外を投げるように差し替える
        notes: E2E では `$.ui.log` を差し替えられないため、結合テストで確認する
      - name: 回答させる入力
        description: 正常シナリオと同じ
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant M as モデル
        participant CC as Claude Code
        participant P as alias-inject
        U->>CC: 単語を組み立てて回答させる入力を送信
        CC->>M: 入力を送信
        M-->>CC: term-a を含む応答の文
        CC->>P: turn.step の結果
        P->>P: 照合で term-a がヒットし、記録に入れる
        P->>CC: term-a の文脈を会話に追加する
        P->>CC: 表示の行を出そうとして失敗する
        CC->>CC: 失敗を debug log に出し、alias-inject へ例外を返さない
        CC-->>U: 応答の文をそのまま表示する
      ```

      <!-- /map -->
    expected:
      - 応答の文は変わらずに表示されている
      - term-a の文脈の行が会話に追加され、term-a がセッションの記録に入っている
    test: test_error_when_display_fails
tags:
  - name: topic:引用の文脈
    main: true
  - name: topic:応答
  - name: topic:照合
  - name: action:追加
  - name: action:照合
