summary: 単一 / 複合ユースケースの業務フロー設計（E2E テストの元）
items:
  - page: SC-1.yaml
    summary: 設定の書き換え・圧縮・/clear を挟んでも、単語ごとに 1 回だけ引用の文脈が追加される
  - page: SC-2.yaml
    summary: ツールで参照した本文に初めて出た単語の引用の文脈を、本文を変えずにモデルに追加する
  - page: SC-3.yaml
    summary: 入力に初めて出た単語の引用の文脈を、入力の文を変えずにモデルに追加する
  - page: SC-4.yaml
    summary: 圧縮か /clear の後に同じ単語を入力すると、文脈がもう一度追加される
  - page: SC-5.yaml
    summary: スキル `global-setup` で端末の設定を作るか今の構造へ移し、引用の文脈が追加されることを確認する
  - page: SC-6.yaml
    summary: 設定ファイル・`project-index.yaml`・照合の YAML のどれかを書き換えると、次の入力から反映される
  - page: SC-7.yaml
    summary: ツールで参照した本文の `!{名前}` に、同じ名前の環境変数の値を文脈として追加する
