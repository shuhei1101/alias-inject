scope_out:
  - item: AI slop の単語の置き換え
    reason: 起点 Issue の本文で別の Issue へ移し、その Issue で置き換え済み（closed）
    plan: '#88'
  - item: docs/_theme/ の公開サイトのテーマ（同梱の mermaid.min.js を含む）
    reason: AI Monitor から写した配布物で、文書でない
    plan: none
  - item: ER 図の移行
    reason: 配信元 alias-inject の文書に ER 図が無い
    plan: none
  - item: rules.yaml の古い規約の除外
    reason: rules が空で、規約『markdown マーメイド』『判定フローチャート』を指していない
    plan: none
  - item: 設計書の description（各種類の lead）を「何を定め、どんなときに参照するか」の 1 文に書き換える
    reason: 設計書の description は各種類のスキーマの lead に当たり、スキーマが「初回に記載した内容のまま保ち、対象そのものが変わったときだけ書き換える」と定めるため変えない。スコープに含めるかは判断が分かれるため、レビューで確定する
    plan: none
  - item: 設計書・公開ドキュメントへのエイリアスと用語の新規登録
    reason: knowledge の判定フローチャート『エイリアスの登録』の最初の分岐（会話・Issue・本文で実際にその名前で呼ばれたか）に当たる実例がこの作業では見つからず、登録しないと判定した。スコープに含めるかは判断が分かれるため、レビューで確定する
    plan: none
  - item: 各フォルダの目次（index.yaml）へのタグ
    reason: 目次はフォルダの文書の一覧で、設計書の主題は各設計書のタグが持つため付けない。スコープに含めるかは判断が分かれるため、レビューで確定する
    plan: none
  - item: 公開ドキュメント『設定ファイル』と『エイリアスのスキーマ』に並ぶ metadata の値の取り方の箇条書きの重複
    reason: 設定ファイルを書く利用者と、スキーマを取り込む利用側のそれぞれが参照するページで、片方を削除するとそのページだけで読めなくなるため両方に残す。スコープに含めるかは判断が分かれるため、レビューで確定する
    plan: none
