scope_out:
  - item: 配信設定・ルール索引（`docs/_config.yml`・配布元のルール索引）
    reason: v0.5.0 で配布元の `docs/_config.yml` とルール索引は変わっていない
    plan: none
  - item: プラグイン（MCP `update_plugins` での取り直し）
    reason: alias-inject のリポジトリの変更ではなく、稼働しているブランチへ入ったプラグインの変更はモニターが自動で有効にする（テンプレート『PRドキュメント/反映作業』の `時期`）
    plan: none
  - item: MCP ツール（`settings.yaml` の `agents[].mcp_tools` の見直し）
    reason: alias-inject は AI Monitor の `settings.yaml` を持たない（`settings.sample.yaml` はプラグインの設定ファイルの見本）
    plan: none
  - item: テンプレート・フェーズ手順・判定・観点の読み直し
    reason: alias-inject はこれらのコピーを持たず、エージェントは AI Monitor の develop のページを実行時に読む。設計書の書式は knowledge のスキーマの参照（`project-index.yaml` の `schema.ref`）が決め、配布物に含まれない
    plan: none
