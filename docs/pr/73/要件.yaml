scope_out:
  - item: '`alias_type` が `avoid` の行の廃止・用語の `avoid` への統合'
    reason: 用語集に無いやめた言い方と正しい語の組を記載する手段として残す（#21 で別に残すと決めた）。Issue の要望に含まれない
    plan: none
  - item: mdmark・dev-docs が取り込むスキーマの変更
    reason: '`metadata.avoid` のキーと型は変えず、説明だけを合わせるため、取り込む側の定義はそのまま通る'
    plan: none
