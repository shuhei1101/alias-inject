use_cases:
  - kind: single
    scenario: docs/scenario/SC-3.yaml
    impact: changed
    detail: 用語のやめた言い方が入力に出たら、避ける語のセクションに、やめた言い方と、代わりに使う用語の名前を追加する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-2.yaml
    impact: following
    detail: ツールで読んだ本文に用語のやめた言い方が出たときも、入力と同じく避ける語として用語の名前を追加する
    depends_on:
      - docs/scenario/SC-3.yaml
  - kind: composite
    scenario: docs/scenario/SC-1.yaml
    impact: run_only
    detail: やめた言い方も、語ごとに 1 回だけ文脈を追加する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-6.yaml
    impact: run_only
    detail: 用語集のやめた言い方を書き換えても、次の入力から書き換え後の内容で照合する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-4.yaml
    impact: none
    detail: 記録の消去は照合に関わらない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-5.yaml
    impact: none
    detail: 端末のセットアップの手順は変わらない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-7.yaml
    impact: none
    detail: 変数参照の値は照合する語に関わらない
    depends_on: []
