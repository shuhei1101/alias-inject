dev-docs の端末の設定の配信元の設定のパスの書き換え:
  説明: 端末の設定 ~/.config/dev-docs/settings.yaml の配信元 alias-inject の config を /mnt/c/Users/shuhe/repo/alias-inject/dev-docs.yaml から /mnt/c/Users/shuhe/repo/alias-inject/project-index.yaml へ書き換える。dev-docs は配信元の設定をクローンの develop から読むため、マージの直後に実行する。dev-docs のサーバーの読み直しは行わない（稼働中のサーバーは shuhei1101/dev-docs#163 で消えたスキーマのファイルを読みに行って読み直しに失敗するため、サーバーの起動し直しと端末の設定の project-index への移し替えを行う shuhei1101/dev-docs#164 の反映作業に任せる）。切り戻しは、作業 PR を develop から revert した後にだけ使う
  タグ: [設定の書き換え]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  可逆: true
  疎通確認: dev-docs の端末の設定の配信元の設定のパスの書き換え/疎通確認.py
  実行: dev-docs の端末の設定の配信元の設定のパスの書き換え/実行.py
  確認: dev-docs の端末の設定の配信元の設定のパスの書き換え/確認.py
  切り戻し: dev-docs の端末の設定の配信元の設定のパスの書き換え/切り戻し.py
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: ~/.config/dev-docs/settings.yaml の sources に config が /mnt/c/Users/shuhe/repo/alias-inject/project-index.yaml の行が 1 つあり、/mnt/c/Users/shuhe/repo/alias-inject/dev-docs.yaml の行が無く、クローンの develop に project-index.yaml がある
  状態: "-"
alias-inject の端末の設定の配信元の設定のパスの書き換え:
  説明: 端末の設定 ~/.config/alias-inject/settings.yaml の global.repositories の alias-inject の行の config を /mnt/c/Users/shuhe/repo/alias-inject/.claude/worktrees/develop/dev-docs.yaml から /mnt/c/Users/shuhe/repo/alias-inject/.claude/worktrees/develop/project-index.yaml へ書き換える。develop の worktree が作業 PR のマージを取り込むと dev-docs.yaml が無くなり、alias-inject が alias-inject の配信元の設定を照合から外すため、マージの直後に実行する。切り戻しは、作業 PR を develop から revert した後にだけ使う
  タグ: [設定の書き換え]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  可逆: true
  疎通確認: alias-inject の端末の設定の配信元の設定のパスの書き換え/疎通確認.py
  実行: alias-inject の端末の設定の配信元の設定のパスの書き換え/実行.py
  確認: alias-inject の端末の設定の配信元の設定のパスの書き換え/確認.py
  切り戻し: alias-inject の端末の設定の配信元の設定のパスの書き換え/切り戻し.py
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: ~/.config/alias-inject/settings.yaml の global.repositories に /mnt/c/Users/shuhe/repo/alias-inject/.claude/worktrees/develop/project-index.yaml の行が 1 つあり、dev-docs.yaml の alias-inject の行が無く、そのパスのファイルが develop の worktree にある
  状態: "-"
