dev-docs の端末の設定の配信元の設定のパスの書き換え:
  説明: 端末の設定 ~/.config/dev-docs/settings.yaml の配信元 alias-inject の config を /mnt/c/Users/shuhe/repo/alias-inject/dev-docs.yaml から /mnt/c/Users/shuhe/repo/alias-inject/project-index.yaml へ書き換え、配信している dev-docs に読み直させる。作業 PR が develop へ入ると develop の dev-docs.yaml が無くなり、次の読み直しで alias-inject の配信が止まるため、マージの直後に実行する。切り戻しは、作業 PR を develop から revert した後にだけ使う
