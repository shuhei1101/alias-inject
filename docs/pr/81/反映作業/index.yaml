  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: dev-docs が読んでいる端末の設定の alias-inject の行の config が /mnt/c/Users/shuhe/repo/alias-inject/project-index.yaml で配信中になっており、develop の worktree を作業場所にした search_docs（source が alias-inject・view が count）の件数が書き換える前と同じ
