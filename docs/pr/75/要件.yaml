scope_out:
  - item: docs/guide/変更履歴.md の dev-docs.yaml
    reason: 過去に入った PR のタイトルで、書き換えると履歴と食い違う
    plan: none
  - item: docs/pr/・dev/pr/ の過去の作業 PR の PR ドキュメントとテスト結果のログの dev-docs.yaml
    reason: その作業 PR の時点の記録で、書き換えると記録と食い違う
    plan: none
  - item: リポジトリ直下の alias-inject 自身の配信元の設定 dev-docs.yaml の改名
    reason: 例の名前ではなく dev-docs が読む実体のファイルで、改名は dev-docs の既定のファイル名の変更（shuhei1101/dev-docs#114）が入った後の作業になる。Issue 本文のやりたいことに含まれない
    plan: to_file
  - item: 単体・結合テスト（tests/unit/hooks/・tests/integration/hooks/）のフィクスチャのファイル名 dev-docs.yaml
    reason: alias-inject は repositories[].config に指定したパスを読むだけで、フィクスチャの名前は検証の結果を変えない。Issue 本文の対象（設計書・公開ドキュメント・設定の例・コードのコメント）に含まれない。含めるかはレビューで確定する
    plan: none
