scope_out:
  - item: mdmark check の plain_md_with_marks（マーカーを持つ .md を .mark.md へ改名する提案）
    reason: 終わりの条件は legacy_mark を出さないことで、改名はファイルのパスとリンクを変えるため要望に含まれない
    plan: none
  - item: mdmark.config.yaml へ build.include を記載して mdmark check の対象に docs/ を含める
    reason: 移行は一時の設定で docs/**/*.md を対象にして適用した。常設すると plain_md_with_marks が 32 件出続けるため要望に含めない
    plan: none
