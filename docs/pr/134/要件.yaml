use_cases:
  - kind: composite
    scenario: docs/scenario/SC-1.yaml
    impact: changed
    detail: セッション全体の流れに、書き込む内容と応答の文に初めて出た単語の引用の文脈が追加され、入力・ツールの結果と同じ記録で単語ごとに 1 回だけになる手順を加える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-2.yaml
    impact: changed
    detail: 書き込みのツール（Write・Edit・MCP の書き込みのツール）が書き込む内容に初めて出た単語の引用の文脈を、ツールの結果の後ろに追加する。応答の文も照合するため、サブエージェントのシナリオではメインの会話の応答に単語を出させない
    depends_on:
      - docs/scenario/SC-1.yaml
  - kind: single
    scenario: docs/scenario/SC-8.yaml
    impact: new
    detail: Claude Code の応答の文に初めて出た単語の引用の文脈を、次にモデルへ届く文脈に追加する
    depends_on:
      - docs/scenario/SC-1.yaml
  - kind: single
    scenario: docs/scenario/SC-3.yaml
    impact: run_only
    detail: 入力の照合は変えないが、応答の文と書き込む内容で追加した単語も同じ記録に入るため回帰を確かめる（記録の共有は SC-1 と SC-8 が定める）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-4.yaml
    impact: run_only
    detail: 圧縮とクリアの後の記録の消去が、応答の文と書き込む内容で追加した単語にも効く
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-7.yaml
    impact: run_only
    detail: 参照した本文への変数参照の値の追加は変えないが、同じツールのイベントの処理を変えるため回帰を確かめる
    depends_on: []
