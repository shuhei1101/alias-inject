id: LIB-4
visibility: internal
title: GitHub Actions
kind: サービス
tags:
  - name: tool:github
    main: true
  - name: topic:ci
lead: |-
  GitHub のリポジトリの workflow のファイル（`.github/workflows/`）に従い、ジョブをランナーで実行する CI のサービス。
  公開の Action を step として呼び出せる。
adoption: 採用
dependency_scope: 開発のみ
official_url: https://github.com/features/actions
docs_url: https://docs.github.com/en/actions
supplier: GitHub
used_in:
  - .github/workflows/test.yml
version:
  current: actions/checkout v7・actions/setup-node v7・actions/upload-artifact v7
  latest: actions/checkout v7.0.1・actions/setup-node v7.1.0・actions/upload-artifact v7.0.2
  checked_on: '2026-11-15'
  pinning: Action はメジャーバージョンのタグで固定する
  source: .github/workflows/test.yml
catalogs:
  - name: Action
    version: v7
    entries:
      - name: actions/checkout
        kind: Action
        purpose: workflow を起動したブランチを取得する
        verification_state: verified
        verified_at: '2026-11-15T12:06:26+09:00'
      - name: actions/setup-node
        kind: Action
        purpose: 指定したバージョンの Node.js と npm を入れる
        params:
          - name: node-version
            type: string
            required: false
            description: 入れる Node.js のバージョン
            verification_state: verified
            verified_at: '2026-11-15T12:06:26+09:00'
        verification_state: verified
        verified_at: '2026-11-15T12:06:26+09:00'
      - name: actions/upload-artifact
        kind: Action
        purpose: ファイルを実行の成果物として上げる
        params:
          - name: name
            type: string
            required: false
            default: artifact
            description: 成果物の名前
            verification_state: verified
            verified_at: '2026-11-15T12:06:26+09:00'
          - name: path
            type: string
            required: true
            description: 上げるファイルのパス
            verification_state: verified
            verified_at: '2026-11-15T12:06:26+09:00'
          - name: if-no-files-found
            type: warn / error / ignore
            required: false
            default: warn
            description: '`path` にファイルが無いときの扱い（`warn` は警告を出して成功で終える）'
            verification_state: verified
            verified_at: '2026-11-16T04:52:30+09:00'
        verification_state: verified
        verified_at: '2026-11-15T12:06:26+09:00'
  - name: workflow のキー
    version: '2026-11-15'
    entries:
      - name: on.workflow_dispatch
        kind: 設定
        purpose: workflow を手動（GitHub の画面・`gh workflow run`）でだけ起動する
        description: 起動できるのは既定のブランチ（develop）にある workflow のファイルだけで、`--ref` に指定したブランチのファイルの内容で実行する。
        verification_state: verified
        verified_at: '2026-11-15T12:06:26+09:00'
      - name: concurrency
        kind: 設定
        purpose: 同じ group の実行を 1 つにする
        params:
          - name: group
            type: string
            required: true
            description: 同時に 1 つだけ実行する単位
            verification_state: unverified
          - name: cancel-in-progress
            type: boolean
            required: false
            default: 'false'
            description: '`true` なら先に起動した実行を止める'
            verification_state: unverified
        verification_state: unverified
      - name: permissions
        kind: 設定
        purpose: ジョブの `GITHUB_TOKEN` に与える権限を絞る
        verification_state: verified
        verified_at: '2026-11-15T12:06:26+09:00'
      - name: timeout-minutes
        kind: 設定
        purpose: ジョブ・step の実行時間の上限（分）。超えたら止めて失敗にする
        verification_state: verified
        verified_at: '2026-11-16T04:52:00+09:00'
      - name: 'if: always()'
        kind: 設定
        purpose: 前の step の成否によらず step を実行する
        verification_state: verified
        verified_at: '2026-11-16T04:52:30+09:00'
      - name: shell
        kind: 設定
        purpose: step の `run` を実行する shell を指定する
        description: 'Linux で `shell: bash` を明示すると `bash --noprofile --norc -eo pipefail {0}` で実行する（ランナーのログには `-e -o pipefail` と出る）。省くと `bash -e {0}` で実行し、`pipefail` は付かない。根拠: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstepsshell'
        verification_state: verified
        verified_at: '2026-11-15T12:06:26+09:00'
limitations:
  - item: 1 ジョブの上限
    content: 1 ジョブの実行時間は 6 時間まで
    notes: https://docs.github.com/en/actions/reference/limits
verification:
  state: 済
  detail: 'workflow `.github/workflows/test.yml` を `gh workflow run` で作業ブランチに対して起動し、全ての step が成功して成果物 `test-log` が上がることを確認した（正常系）。異常系のフローのブランチで workflow を起動し、step が失敗した後に `if: always()` の step が実行されること、step の `timeout-minutes: 1` で 73 秒後に `The action ''テストの全件を回す'' has timed out after 1 minutes.` を出して止められること、`if-no-files-found: warn` で `No files were found with the provided path: test.log. No artifacts will be uploaded.` の警告を出して step が成功することを確認した（実行 43754604209・43754667117・43754833070）。`concurrency` の先の実行を止める振る舞いは観測していない'
  date: '2026-11-16'
