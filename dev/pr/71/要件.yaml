    scenario: dev/設計書/シナリオ/単一ユースケース/端末のセットアップ.yaml
    impact: run_only
    detail: セットアップのスキルが読む設定の移し替えの手順のページが移るため、スキルがそのページを読めることを確かめる
    depends_on: []
docs:
