title: "圧縮の後の記録の消去"
entry:
  kind: trigger
  value: '`session.compact`（会話の圧縮ごと）'
flows:
  - name: 正常系
    summary: 圧縮の後に記録を消し、同じ語の文脈がもう一度追加される
    setup:
      - name: Mock
        description: '入力への引用の文脈の追加の正常系と同じ。テストの `on` の `session.compact` は圧縮した結果（`messages: []`）を返す'
      - name: セッションの記録
        description: 「term-a とは」を送り、term-a が記録済み
      - name: 圧縮
        description: '`trigger` が `manual`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant IF as session.compact
        participant ST as $.state

        CC->>IF: trigger: manual
        IF->>CC: next(e)
        CC-->>IF: 圧縮した結果
        IF->>ST: そのセッションの記録を消す
        IF-->>CC: 圧縮した結果
      ```
    expected:
      - 返る結果が `next(e)` の結果と同じ
      - 続けて「term-a とは」を送ると、term-a の文脈がもう一度追加される
    test: test_normal
  - name: 正常系（圧縮しなかった）
    summary: precompute・見送り・サブエージェントの圧縮では記録を残す
    setup:
      - name: Mock
        description: 正常系と同じ。見送りのケースではテストの `on` の `session.compact` が `skip` を返す
      - name: セッションの記録
        description: 正常系と同じ
      - name: 圧縮
        description: '次の 3 つを順に起こす: `trigger` が `precompute` / `trigger` が `manual` で結果が `skip` / `trigger` が `auto` で `agentId` あり'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code
        participant IF as session.compact

        CC->>IF: precompute / 見送り / agentId あり
        IF->>CC: next(e)
        CC-->>IF: 結果
        IF-->>CC: 結果（記録は消さない）
      ```
    expected:
      - 返る結果が `next(e)` の結果と同じ
      - 3 つの圧縮の後に「term-a とは」を送ると、返る `context` が空（term-a が記録に残っている）
    test: test_normal_when_not_compacted
lead: メインの会話の圧縮が終わった後、そのセッションの追加済みの語の記録を消す。
idempotent: true
side_effects: '`$.state` のそのセッション ID の記録を消す'
callers:
  - dev/設計書/外部ライブラリ/claude-code#
exclusivity: 排他しない
request:
  - name: trigger
    type: "'manual' | 'auto' | 'plugin' | 'precompute'"
    required: true
    location: argument
    description: 圧縮のきっかけ。`precompute` は会話を圧縮しないため記録を消さない
  - name: agentId
    type: string
    required: false
    default: なし（メインの会話）
    location: argument
    description: サブエージェント・フォークの会話の圧縮のときに入る。入っているときは記録を消さない
response:
  - name: '-'
    type: SessionCompactResult
    description: '`next(e)` の結果をそのまま返す'
exceptions:
  - name: なし（正常終了）
    condition: 全ての場合
constraints:
  - item: 消す時期
    constraint: '`next(e)` が圧縮した結果（`skip` が無い）を返した後'
  - item: 消す範囲
    constraint: そのセッション ID（`$.session.id()`）の記録だけ
  - item: 処理時間
    constraint: 制限なし
    notes: '`$.state` への書き込み 1 回だけ'
refs:
  - dev/設計書/シナリオ/単一ユースケース/圧縮とクリアの後の記録の消去#
  - dev/設計書/インターフェース定義/入力への引用の文脈の追加#
test_file: tests/integration/hooks/session-compact.test.ts
