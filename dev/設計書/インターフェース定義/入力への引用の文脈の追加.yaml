lead: 入力の文を、読むリポジトリの `dev-docs.yaml` の documents の行と設定ファイルの `aliases` の行が指す YAML の語と照合し、そのセッションで初めて出た語の引用の文脈を `context` に追加して渡す。
idempotent: false
side_effects: 追加した語を `$.state` のセッションの記録に入れる。読み込んだ設定と語の一覧をモジュールの中に持つ。ファイルへの書き込みと外への送信はしない
callers:
  - dev/設計書/外部ライブラリ/claude-code#
exclusivity: Claude Code が 1 セッションの `prompt.submit` を順に呼ぶ。メインの会話の記録を `tool.call` と共有するため、記録は [ツールの結果への引用の文脈の追加](./ツールの結果への引用の文脈の追加.yaml) と同じく `$.state.set` の `ifVersion` で書き、外れたら読み直して記録済みの語を除き直す（3 回まで）。上限まで外れたら、debug log に出して文脈を追加せずに渡す
request:
  - name: text
    type: string
    required: true
    location: argument
    description: 入力の文（貼り付けは展開済み）
  - name: command
    type: PromptSubmitCommand
    required: false
    default: なし（スラッシュコマンドではない）
    location: argument
    description: スラッシュコマンドの行のときに入る。入っているときは照合しない
  - name: context
    type: readonly string[]
    required: false
    default: なし（他のフックが追加していない）
    location: argument
    description: 他のフックが追加した文脈。そのまま残し、末尾に追加する
  - name: origin.kind
    type: PromptOrigin['kind']
    required: true
    location: argument
    description: 入力の出所。設定の `origins` の `user`（`composer`・`bridge`・`sdk`）と `plugin`（`plugin`）に対応づける
response:
  - name: text
    type: string
    description: 受け取った `text` のまま
  - name: context
    type: readonly string[]
    description: 受け取った `context` の末尾に、今回追加する文脈を 1 要素で追加したもの。追加する語が無いときは受け取ったまま
    constraints: 追加する要素は `max_chars` 文字まで
response_example: |
  ```markdown
  # この発言に出る用語

  ## 用語

  - 単一ユースケース（id: term-single-usecase）
    - description: 1 つの操作を始めから終わりまで書くシナリオの単位
    - related: tpl-scenario（シナリオのテンプレート）

  ## コマンド

  - セットアップ（id: cmd-setup）
    - command: `uv sync`
    - cwd: /mnt/c/Users/shuhe/repo/ai-monitor
    - description: 依存を入れる
  ```
response_notes: '文脈は `# {heading}` の下に、`alias_type` ごとの `## {見出し}`（term: 用語 / doc: 文書 / command: コマンド / url: URL / skill: スキル / tool: ツール / path: パス / env: 環境 / avoid: 避ける語 の順）と語ごとの箇条書きで並べる。どのリポジトリ・どの行の語も、同じ `alias_type` なら 1 つのセクションに並べる。語は文書の `name` の値にする。箇条書きの子には `alias_type` ごとのキー（term: `description`・`related` / doc: `description` / command: `command`・`cwd`・`description` / url: `url`・`description` / skill: `skill`・`description` / tool: `tool`・`description` / path: `path`・`description` / env: `url`・`port`・`description` / avoid: `replacement`）のうち値のあるものだけを並べる。command の `command` と、skill の `skill`・tool の `tool`・path の `path` の値はインラインコード（バッククォート）で囲む。'
exceptions:
  - name: なし（正常終了）
    condition: 照合して文脈を追加したか、追加する語が無く受け取ったまま渡した
  - name: なし（設定ファイルが読めない）
    condition: 設定ファイルが無い・読めない・書式が誤っている
    notes: '例外を外へ出さず、`$.ui.log(text, { to: "debug" })` で設定ファイルのパスと理由を debug log に出し、何も追加せずに `next(e)` へ渡す。`ALIAS_INJECT_CONFIG` が無いときはログを出さない'
  - name: なし（YAML の書式の誤り）
    condition: '行の `paths` に当たる YAML が読めない・書式が誤っているか、`records` を書いた行でその配列が無い'
    notes: '例外を外へ出さず、`$.ui.log(text, { to: "debug" })` で YAML のパスと理由を debug log に出し、その YAML の文書だけを照合から外す'
  - name: なし（dev-docs.yaml が読めない）
    condition: '`repositories` の要素の `config` が指す `dev-docs.yaml` が無い・読めない・書式が誤っているか、`documents` が並びでない'
    notes: '例外を外へ出さず、`$.ui.log(text, { to: "debug" })` で `dev-docs.yaml` のパスと理由を debug log に出し、そのリポジトリの行だけを照合から外す'
  - name: なし（スキーマに合わない行）
    condition: '設定ファイルの `aliases` の行か、`dev-docs.yaml` の `documents` のうち `alias_type` を持つ行が `schemas/aliases.schema.yaml` に合わない（旧い構造の要素・9 つに無い `alias_type`・列名の文字列でない `metadata` の値を含む）か、`dev-docs.yaml` の `documents` の行が行の `alias_type` を持たず `metadata.alias_type` を持つか、同じ出所の中で先の行と `id` が重なる'
    notes: '例外を外へ出さず、`$.ui.log(text, { to: "debug" })` で出所（`dev-docs.yaml` か設定ファイルのパス）・行の `id`（無ければ並びの位置）・理由を debug log に出し、その行だけを照合から外す'
  - name: なし（必須の値が空の文書）
    condition: 文書ごとに解決した `metadata` の値で、`alias_type` の必須のキーの値が空（env は `url`・`port` の両方が空）
    notes: '例外を外へ出さず、`$.ui.log(text, { to: "debug" })` で YAML のパス・文書の `id`（空なら `records` の並びの位置）・空のキーを debug log に出し、その文書だけを照合から外す'
constraints:
  - item: 処理時間
    constraint: 入力の送信で増える待ち時間は 200ms まで
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[入力の送信で増える待ち時間]
    notes: ファイルは更新時刻が変わったときだけ読み、語の一覧はモジュールの中に持つ
  - item: 語の数の上限
    constraint: '`max_items` 語まで（既定 20）。入力に最初に出た位置の早い語から順に選び、同じ位置なら長い語を先にする'
    decided_by: dev/設計書/設定/プラグイン#settings[global.max_items]
  - item: 文字数の上限
    constraint: 見出しを含む文脈全体で `max_chars` 文字まで（既定 4,000）。語を選ぶ順に足していき、足すと上限を超える語は飛ばして、後ろの語で収まるものを続けて足す
    decided_by: dev/設計書/設定/プラグイン#settings[global.max_chars]
    notes: 上限で外れた語は記録に入れず、次に出た入力で追加の対象になる
  - item: 照合
    constraint: 入力と文書の `name`・`aliases` の語を NFKC・英字の小文字・前後の空白の除去でそろえ、語が入力の部分文字列に含まれるかで判定する。正規表現は使わない。`exclude` の語は照合しない
    notes: 1 つの文書の複数の語（`name` と `aliases`）が当たっても、その文書は 1 回だけ追加する
  - item: 記録の単位
    constraint: セッション ID（`$.session.id()`）ごとに、出所（`dev-docs.yaml` の絶対パスか設定ファイルの絶対パス）と行の `id` と文書の `id` の組で記録する
    notes: 同じ文書をエイリアスで入力しても二度目は追加しない。別のリポジトリが同じ行の `id` と文書の `id` を使っても、それぞれを追加する
  - item: 読み直し
    constraint: 入力の送信ごとに、照合の前に設定ファイル・`dev-docs.yaml`・`paths` に当たる YAML の `mtimeMs` とフォルダの一覧を確かめ、変わったものだけ読み直す。同じ `dev-docs.yaml` を `global` と `projects` の両方が指すときは 1 回だけ読む
  - item: 出所
    constraint: '`origins` を書かないときはすべての出所の入力に追加する。書いたときは、`origins` に対応づかない出所の入力には追加しない'
    decided_by: dev/設計書/設定/プラグイン#settings[global.origins]
  - item: 検証
    constraint: '設定ファイルの `aliases` の行と、読んだ `dev-docs.yaml` の `documents` のうち `alias_type` を持つ行を、行ごとに `schemas/aliases.schema.yaml` で検証する。行と `metadata` の他のキーは弾かない。`enabled: false` の `repositories` の要素と行は読まない。`id` の重なりは出所ごとに確かめ、設定ファイルは `global` と当たった `projects` を重ねた並びで確かめる。種類ごとの必須のキーは、文書ごとに解決した値で確かめる'
    notes: '`dev-docs.yaml` は `documents` だけを読み、トップレベルの `aliases` は読まない。`documents` を持たない `dev-docs.yaml` は行 0 件として扱い、`alias_type` も `metadata.alias_type` も持たない行は検証せずに飛ばす。どちらもログを出さない'
  - item: 文書の取り出し
    constraint: '`records` を書かない行は `paths` に当たった各ファイルを 1 件の文書にし、書いた行はファイルのその配列の各要素を 1 件の文書にする。`metadata` の値は文書の列名で、入れ子の列は `.` でつなぐ（`meta.summary`）。書かないキーは同じ名前の列から取る。`name` が空なら、ファイルの文書はファイル名、`records` の要素は行の `body_file` が指す列の値のファイル名、それも空なら `id` を使う（ファイル名は拡張子を除く）'
    notes: '-'
