title: "プラグイン / イベントの処理"
lead: |-
  入口が `prompt.submit`・`session.compact`・`session.end`・`tool.call` に登録するイベントの処理。
directory: |-
  ```text
  hooks/
    handlers.ts          prompt.submit・session.compact・session.end・tool.call の処理
  tests/
    unit/
      hooks/
        handlers.test.ts handlers.ts の単体テスト
  ```
functions:
  - name: handlePromptSubmit
    title: 入力への引用の文脈の追加
    kind: フック
    container: hooks/handlers.ts
    usecase: 入力への引用の文脈の追加
    summary: 入力を読むリポジトリの `documents` と設定ファイルの `aliases` の行が指す YAML の語と照合し、そのセッションで初めて出た語の文脈を `context` の末尾に追加して渡す
    scope: public
    is_async: true
    side_effects: 追加した語を `$.state` のセッションの記録に入れる。読めない設定ファイル・`dev-docs.yaml`・YAML と、外した設定の値・行・文書を debug log に出す
    inherits: dev/設計書/インターフェース定義/入力への引用の文脈の追加#
    args:
      - name: $
        type: EngineInterface
        required: true
        passing: injected
        description: エンジンが渡す
      - name: e
        type: PromptSubmitInput
        required: true
        passing: positional
        description: 入力の送信の入力
      - name: next
        type: '(e: PromptSubmitInput) => Promise<PromptSubmitResult>'
        required: true
        passing: positional
        description: 下のプラグインとエンジンの処理
    returns:
      type: Promise<PromptSubmitResult>
      description: '`next` の結果'
    process: |-
      1. `e.command` があれば `next(e)` を返す
      2. 設定ファイルのパスの取得が null なら `next(e)` を返す（ログを出さない）
      3. スキーマの読み込みをする
      4. 設定ファイルを `$.fs.stat` で確かめ、変わったファイルの読み込み（種類は `config`）で読む。変換は YAML のパース（`ok` が false なら理由で ConfigError）と設定ファイルの検証（スキーマは 3 のもの）
      5. 4 が例外になったら、設定ファイルのパスと理由を `$.ui.log(text, { to: "debug" })` に出して `next(e)` を返す
      6. 実効の設定の組み立てをする（configPath は設定ファイルのパス、projectRoot は `$.session.root()`、repoRoot は `$.session.repo()?.root ?? $.session.root()`）。設定ファイルの検証と組み立ての warnings を、設定ファイルのパスを添えて debug log に出す
      7. enabled が false、または出所の判定が false なら `next(e)` を返す
      8. 実効の設定の repositories を順に dev-docs.yaml の読み込みで読む。RepositoryError はパスと理由を debug log に出し、そのリポジトリだけを外す。読めたリポジトリの warnings は、`dev-docs.yaml` のパスを添えて debug log に出す
      9. 8 のリポジトリの行を repositories の順に並べ、その後ろに実効の設定の aliases の行を並べる。各行を並びの位置とともに行の文書の読み込みで読み、failures は `照合から外しました（{YAML のパス}）: {理由}` を debug log に出す
      10. 全ての語を照合する
      11. 記録への追加を、recordId を記録の ID（sessionId は `$.session.id()`、agentId は undefined）、select を記録済みのキーでの語の選択にして呼ぶ
      12. 結果が null なら `next(e)`、それ以外は `next({ ...e, context: [...(e.context ?? []), selection.text] })` を返す
      13. 3〜11 で想定しない例外（SchemaError・RecordConflictError を含む）が起きたら、理由を debug log に出して `next(e)` を返す（入力を止めない）

      2〜6 の設定の読み込みと 8・9 の語の読み込みは、handleToolCall と共有する内部の関数に置く

      6・8 の warnings は、同じ読み込みの結果（設定ファイルは検証した設定、リポジトリは取り出した行）について同じ文言を 1 回だけ出す。読み直して結果が変われば、また出す
    callees:
      - dev/設計書/モジュール構成/プラグイン/設定#functions[readConfigPath]
      - dev/設計書/モジュール構成/プラグイン/スキーマ#functions[loadAliasSchema]
      - dev/設計書/モジュール構成/プラグイン/読み込み#functions[readIfChanged]
      - dev/設計書/モジュール構成/プラグイン/読み込み#functions[parseYaml]
      - dev/設計書/モジュール構成/プラグイン/設定#functions[parseConfig]
      - dev/設計書/モジュール構成/プラグイン/設定#functions[resolveSettings]
      - dev/設計書/モジュール構成/プラグイン/設定#functions[isOriginAllowed]
      - dev/設計書/モジュール構成/プラグイン/リポジトリ#functions[loadRepositoryAliases]
      - dev/設計書/モジュール構成/プラグイン/項目#functions[loadAliasEntries]
      - dev/設計書/モジュール構成/プラグイン/照合#functions[findHits]
      - dev/設計書/モジュール構成/プラグイン/記録#functions[recordIdOf]
      - dev/設計書/モジュール構成/プラグイン/記録#functions[addRecorded]
      - dev/設計書/モジュール構成/プラグイン/文脈#functions[selectEntries]
    unit_tests:
      - name: test_handle_prompt_submit_when_disabled
        case: 正常
        summary: enabled が false のときはそのまま渡す
        condition: 設定ファイルの `global.enabled` が false、入力「term-a とは」
        mock: テストの `on` で `settings.read`・`fs.stat`・`fs.list`・`fs.read` をメモリのファイル表から応答し、`mock.env` で `HOME` を渡す
        expected: 返る `context` が受け取ったままで、`dev-docs.yaml` と YAML の `fs.read` が呼ばれていない
      - name: test_handle_prompt_submit_when_context_given
        case: 正常
        summary: 他のフックが追加した文脈を残して末尾に追加する
        condition: "`e.context` が `['other']`、入力「term-a とは」"
        mock: 同上
        expected: 返る `context` が 2 要素で、先頭が `other`、末尾が term-a の文脈
      - name: test_handle_prompt_submit_when_settings_warned
        case: 正常
        summary: 外した設定の値と aliases の要素は、読み込みの結果が変わらないうち 1 回だけ debug log に出す
        condition: '設定ファイルの `global.aliases` に `alias_type: memo` の行、`dev-docs.yaml` の `documents` に `alias_type: term` で `metadata.name` が空文字の行を置いて 2 回入力する'
        mock: 同上。`ui.log` は届いた行を記録する
        expected: '`ui.log` に `to` が `debug` で、設定ファイルのパスと `alias_type` を含む行と、`dev-docs.yaml` のパスと `metadata.name` を含む行が 1 回ずつだけ届く'
      - name: test_handle_prompt_submit_when_alias_paths_match_config
        case: 正常
        summary: aliases の要素の glob が設定ファイルに当たっても、その要素の他の語の文脈を追加する
        condition: "設定ファイルの `global.aliases` に `paths: ['*.yaml']` の term の要素、同じフォルダに term-a.yaml、入力「term-a とは」"
        mock: 同上
        expected: 返る `context` の末尾が term-a の文脈で、`YAML を読めません` の debug log が出ない
  - name: handleSessionCompact
    title: 圧縮の後の記録の消去
    kind: フック
    container: hooks/handlers.ts
    usecase: 圧縮の後の記録の消去
    summary: メインの会話が圧縮された後に、そのセッションの記録を消去する
    scope: public
    is_async: true
    side_effects: '`$.state` のそのセッションの記録を空にする'
    inherits: dev/設計書/インターフェース定義/圧縮の後の記録の消去#
    args:
      - name: $
        type: EngineInterface
        required: true
        passing: injected
        description: エンジンが渡す
      - name: e
        type: SessionCompactInput
        required: true
        passing: positional
        description: 圧縮の入力
      - name: next
        type: '(e: SessionCompactInput) => Promise<SessionCompactResult>'
        required: true
        passing: positional
        description: 下のプラグインとエンジンの処理
    returns:
      type: Promise<SessionCompactResult>
      description: '`next(e)` の結果そのまま'
    process: |-
      1. `r = await next(e)`
      2. `e.trigger` が `precompute` でなく、`r` に `skip` が無ければ、記録の ID（sessionId は `$.session.id()`、agentId は `e.agentId`）の記録の消去をする
      3. `r` を返す
    callees:
      - dev/設計書/モジュール構成/プラグイン/記録#functions[recordIdOf]
      - dev/設計書/モジュール構成/プラグイン/記録#functions[clearRecorded]
    unit_tests:
      - name: test_handle_session_compact
        case: 正常
        summary: 圧縮されたら記録を消去する
        condition: 記録に term-a を入れ、`trigger` が `manual`・`auto`・`plugin` で、`next` が `messages` を返す
        mock: テストの `on` で `session.compact` の結果を返す
        expected: どれも記録が空になり、結果が `next` の結果のまま
      - name: test_handle_session_compact_when_not_compacted
        case: 正常
        summary: 圧縮されなかったときは記録を残す
        condition: '`trigger` が `precompute`、`next` が `{ skip }` を返す、の 2 通り'
        mock: 同上
        expected: どちらも記録に term-a が残る
      - name: test_handle_session_compact_when_subagent
        case: 正常
        summary: サブエージェントの圧縮はそのサブエージェントの記録だけを消去する
        condition: '`$.session.id()` が s1。s1 と、s1 と `agent-1` の記録に term-a を入れ、`agentId` が `agent-1`、`trigger` が `auto`'
        mock: 同上
        expected: s1 と `agent-1` の記録が空で、s1 の記録に term-a が残る
        notes: 'PR #52 で追加'
  - name: handleSessionEnd
    title: クリアの後の記録の消去
    kind: フック
    container: hooks/handlers.ts
    usecase: クリアの後の記録の消去
    summary: '`/clear` でセッションが終わったとき、そのセッションの記録を消去する'
    scope: public
    is_async: true
    side_effects: '`$.state` の終わったセッションの記録を空にする'
    inherits: dev/設計書/インターフェース定義/クリアの後の記録の消去#
    args:
      - name: $
        type: EngineInterface
        required: true
        passing: injected
        description: エンジンが渡す
      - name: e
        type: SessionEndInput
        required: true
        passing: positional
        description: セッションの終了の入力
      - name: next
        type: '(e: SessionEndInput) => Promise<SessionEndResult>'
        required: true
        passing: positional
        description: 下のプラグインとエンジンの処理
    returns:
      type: Promise<SessionEndResult>
      description: '`next(e)` の結果そのまま'
    process: |-
      1. `e.reason` が `clear` なら `e.sessionId` の記録の消去をする
      2. `next(e)` を返す
    callees:
      - dev/設計書/モジュール構成/プラグイン/記録#functions[clearRecorded]
    unit_tests:
      - name: test_handle_session_end_when_clear
        case: 正常
        summary: '`clear` のときだけ記録を消去する'
        condition: '`$.session.id()` が s1。s1 と s2 の記録に term-a を入れ、`sessionId` が s2 で `reason` が `prompt_input_exit` と `clear`'
        mock: なし（`claude-code/testing` の `test` の `$.state`）
        expected: '`prompt_input_exit` では s2 に term-a が残り、`clear` では s2 だけが空になって s1 に term-a が残る'
  - name: handleToolCall
    title: ツールの結果への引用の文脈の追加
    container: hooks/handlers.ts
    usecase: ツールの結果への引用の文脈の追加
    summary: ツールの結果の本文を照合してその会話で初めて出た語の文脈を、本文の `!{名前}` には同じ名前の環境変数の値を、`context` の末尾に追加して返す
    kind: フック
    inherits: dev/設計書/インターフェース定義/ツールの結果への引用の文脈の追加#
    scope: public
    is_async: true
    side_effects: 追加した語を `$.state` の会話の記録に入れる。変数参照があるときだけ `env -0` の子プロセスを 1 回起こす。読めない設定・YAML、引用の文脈・値を追加できない理由を debug log に出す
    args:
      - name: $
        type: EngineInterface
        required: true
        passing: injected
        description: エンジンが渡す
      - name: e
        type: ToolCallInput
        required: true
        passing: positional
        description: ツールの呼び出しの入力
      - name: next
        type: '(e: ToolCallInput) => Promise<ToolCallResult>'
        required: true
        passing: positional
        description: 下のプラグインとエンジンの処理（ツールの実行）
    returns:
      type: Promise<ToolCallResult>
      description: '`next(e)` の結果。引用の文脈か値の行を追加したときは `context` だけを替えたもの'
    process: |-
      1. `r = await next(e)`
      2. `r.deny` があるか、`r.isError` が true か、`r.text` が文字列でなければ `r` を返す
      3. 設定の読み込みをする（handlePromptSubmit の 2〜6 と同じ）。設定ファイルのパスが null・読めない設定のときは引用の文脈を追加しない（7 へ進む）
      4. enabled が false か、`e.tool` が実効の設定の excludeTools のどれかと完全に一致するときは引用の文脈を追加しない（7 へ進む）。origins では絞らない
      5. 語の読み込みをし（handlePromptSubmit の 8・9 と同じ）、`r.text` と照合して、出た回数の順の並べ替えと読んでいる文書の除外（home は `$.env.get('HOME')`）に通す
      6. 記録への追加を、recordId を記録の ID（sessionId は `$.session.id()`、agentId は `e.agentId`）、select を記録済みのキーでの語の選択にして呼び、結果の text を引用の文脈にする
      7. 3〜6 で想定しない例外（RecordConflictError を含む）が起きたら、理由を debug log に出し、引用の文脈を追加せずに続ける
      8. 変数参照の名前の拾い出しが空でなければ、`$.process.run(['env', '-0'], { timeoutMs: VARIABLE_REFERENCE_TIMEOUT_MS })` を呼ぶ。`exitCode` が 0 なら env の出力の分割と値の行の組み立てをする。`exitCode` が 0 以外なら終了コードを、例外（起動できない・待ちの上限の超過を含む）なら理由を debug log に出し、値の行を追加しない
      9. 引用の文脈も値の行も無ければ `r` を返す。あれば `{ ...r, context: [...(r.context ?? []), 引用の文脈, 値の行] }` を返す（無い方は並べない）
    refs:
      - dev/設計書/インターフェース定義/読んだ本文への変数参照の値の追加#
    callees:
      - dev/設計書/モジュール構成/プラグイン/照合#functions[findHits]
      - dev/設計書/モジュール構成/プラグイン/照合#functions[sortByCount]
      - dev/設計書/モジュール構成/プラグイン/ツール#functions[excludeReadingDocuments]
      - dev/設計書/モジュール構成/プラグイン/記録#functions[recordIdOf]
      - dev/設計書/モジュール構成/プラグイン/記録#functions[addRecorded]
      - dev/設計書/モジュール構成/プラグイン/文脈#functions[selectEntries]
      - dev/設計書/モジュール構成/プラグイン/変数参照#functions[findReferenceNames]
      - dev/設計書/モジュール構成/プラグイン/変数参照#functions[parseEnvOutput]
      - dev/設計書/モジュール構成/プラグイン/変数参照#functions[formatReferenceLines]
      - dev/設計書/モジュール構成/プラグイン/変数参照#constants[VARIABLE_REFERENCE_TIMEOUT_MS]
    unit_tests:
      - name: test_handle_tool_call_when_context_given
        case: 正常
        summary: 他のフックが追加した文脈を残し、本文と ref を変えずに末尾に追加する
        condition: 設定ファイルのパスが無い。`next` が `text` に `!{VALUE_A}` を含み `context` が `['other']` の結果を返す
        mock: テストの `on` で `process.run` に `VALUE_A=value-a` を含む出力と終了コード 0 を返す
        expected: "返る `context` が `['other', '変数参照の値: !{VALUE_A} = value-a']` で、`text`・`ref` が `next` の結果のまま。`process.run` に `timeoutMs` 20 が渡る"
      - name: test_handle_tool_call_when_skipped
        case: 正常
        summary: deny・エラーの結果・本文が無い結果・語も変数参照も無い結果はそのまま返す
        condition: '設定ファイルと term-a の YAML がある。`next` が `deny` あり、`isError: true`、`text` が無い、`text` に語も変数参照も無いの 4 通りを返す。前の 3 通りの `text` は term-a を含む'
        mock: テストの `on` で `settings.read`・`fs.stat`・`fs.list`・`fs.read` をメモリのファイル表から応答し、`mock.env` で `HOME` を渡す。`process.run` の呼ばれた回数を記録する
        expected: どれも返る結果が `next` の結果のままで、`process.run` が呼ばれていない。記録が空
      - name: test_handle_tool_call_when_quote_added
        case: 正常
        summary: 引用の文脈を先に、値の行を後に追加し、メインの会話の記録に入れる
        condition: 設定ファイルと term-a の YAML がある。`e.tool` が `Read`、`next` が `text` が「term-a と !{VALUE_A}」で `context` が `['other']` の結果を返す
        mock: test_handle_tool_call_when_skipped と同じファイル表。`process.run` は test_handle_tool_call_when_context_given と同じ
        expected: '返る `context` が 3 要素で、`other`・term-a の文脈・`変数参照の値: !{VALUE_A} = value-a` の順。`$.session.id()` の記録に term-a のキーが入る'
        notes: 'PR #52 で追加'
      - name: test_handle_tool_call_when_tool_excluded
        case: 正常
        summary: exclude_tools のツールは語を読み込まずにそのまま返す
        condition: 設定ファイルの `global.exclude_tools` が `[Bash]`、`e.tool` が `Bash`、`next` の `text` が「term-a を表示」
        mock: test_handle_tool_call_when_skipped と同じ
        expected: 返る結果が `next` の結果のままで、YAML の `fs.read` が呼ばれていない
        notes: 'PR #52 で追加'
      - name: test_handle_tool_call_when_in_subagent
        case: 正常
        summary: agentId のある呼び出しはセッションと agentId の組の記録で照合する
        condition: test_handle_tool_call_when_quote_added の設定で、`$.session.id()` が s1 で s1 の記録に term-a が入っている。`e.agentId` が `agent-1`、`text` が「term-a」
        mock: test_handle_tool_call_when_skipped と同じ
        expected: 返る `context` に term-a の文脈があり、s1 と `agent-1` の記録に term-a のキーが入る
        notes: 'PR #52 で追加'
      - name: test_handle_tool_call_when_process_failed
        case: 異常
        summary: 終了コードが 0 以外・例外のときは debug log に出してそのまま返す
        condition: 設定ファイルのパスが無い。`process.run` が終了コード 3 を返すか、例外を投げるの 2 通り
        mock: テストの `on` で `process.run` を応答する。`ui.log` は届いた行を記録する
        expected: どちらも返る結果が `next` の結果のままで、`ui.log` に `to` が `debug` で終了コードか例外の理由を含む行が届く
      - name: test_handle_tool_call_when_record_conflicts_exhausted
        case: 異常
        summary: 記録の書き込みが上限まで外れたら、引用の文脈を追加せずに値の行だけを追加する
        condition: test_handle_tool_call_when_quote_added と同じ入力
        mock: 'test_handle_tool_call_when_quote_added と同じ。ただしテストの `on` の `state.set` は `ifVersion` を付けた書き込みに常に `isSet: false` を返す。`ui.log` は届いた行を記録する'
        expected: "返る `context` が `['other', '変数参照の値: !{VALUE_A} = value-a']` で、`ui.log` に `to` が `debug` の行が届く"
        notes: 'PR #52 で追加'
    status: planned
    introduced:
