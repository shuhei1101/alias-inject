title: "プラグイン / 項目"
lead: '`aliases` の要素の `paths` に当たる YAML を読み、項目ごとに照合する語と文脈に並べる列を持つ語の一覧を作る。'
directory: |-
  ```text
  hooks/
    lib/
      entry.ts           aliases の要素が指す YAML の読み込みと語の一覧の組み立て
  tests/
    unit/
      hooks/
        lib/
          entry.test.ts  entry.ts の単体テスト
  ```
data_models:
  - name: Entry
    title: 語
    container: hooks/lib/entry.ts
    usecase: 共通
    role: DTO
    summary: '`aliases` の要素が指す YAML の 1 項目。照合する語と、文脈に並べる列'
    properties:
      - name: aliasIndex
        type: number
        description: 読む `aliases` の要素の並び（`repositories` の順の `dev-docs.yaml` の要素、その後に設定ファイルの要素）での位置
      - name: itemIndex
        type: number
        description: 要素の中の項目の並び（ファイルのパスの順、ファイルの中の順）
      - name: origin
        type: string
        description: 要素を書いた `dev-docs.yaml` か設定ファイルの絶対パス
      - name: aliasId
        type: string
        description: '`aliases` の要素の `id`'
      - name: type
        type: AliasType
        description: 引用の種類
      - name: id
        type: string
        description: 項目の ID
      - name: word
        type: string
        description: 文脈に出す語。`fields.title` の列の値。無ければ照合する最初の語
      - name: keys
        type: string[]
        description: 照合する語を正規化したもの。空文字と重複を除く
      - name: fields
        type: '{ name: string; value: string }[]'
        description: 文脈の箇条書きの子に並べる列。type ごとの順で、値のあるものだけ
  - name: LoadedEntries
    title: 読んだ語
    container: hooks/lib/entry.ts
    usecase: 共通
    role: DTO
    summary: 1 つの `aliases` の要素から作った語と、読めなかった YAML
    properties:
      - name: entries
        type: Entry[]
        description: 語の一覧
      - name: failures
        type: '{ path: string; reason: string }[]'
        description: 読めない・書式の誤った YAML の絶対パスと理由。呼び出し元が debug log に出す
functions:
  - name: parseItems
    title: 項目の取り出し
    kind: 関数
    container: hooks/lib/entry.ts
    usecase: 共通
    summary: 1 つの YAML のパースの結果から、ID と照合する語を持つ項目を取り出す
    scope: public
    is_async: false
    args:
      - name: value
        type: unknown
        required: true
        passing: positional
        description: YAML のパースの結果
      - name: fields
        type: AliasFields
        required: true
        passing: positional
        description: '`aliases` の要素の列の対応'
    returns:
      type: Record<string, unknown>[]
      description: ID と照合する語を持つ項目（マッピング）。無ければ空
    process: |-
      1. 最上位がマッピングならそれを 1 項目、並びならマッピングの要素をそれぞれ 1 項目とし、それ以外（null を含む）は空を返す
      2. `fields.id` の列の値が空でない文字列か数値で、`fields.match` の列のどれかに空でない文字列（並びならその要素）がある項目だけを残す
    unit_tests:
      - name: test_parse_items_when_mapping
        case: 正常
        summary: 最上位のマッピングは 1 項目
        condition: '`id: term-a` と `name: Term-A` を持つマッピング、`fields` が `id: id`・`match: [name]`'
        mock: なし
        expected: 1 件
      - name: test_parse_items_when_sequence
        case: 正常
        summary: 最上位の並びはマッピングの要素ごとに 1 項目
        condition: マッピング 2 つと文字列 1 つの並び
        mock: なし
        expected: 2 件
      - name: test_parse_items_when_id_or_match_missing
        case: 正常
        summary: ID か照合する語の無い項目と空の入力は外す
        condition: '`id` が無い項目・`match` の列が空の項目・null'
        mock: なし
        expected: どれも空
  - name: buildEntries
    title: 語の組み立て
    kind: 関数
    container: hooks/lib/entry.ts
    usecase: 共通
    summary: 1 つの `aliases` の要素の全ての項目から、照合する語と文脈に並べる列を持つ語を作る
    scope: public
    is_async: false
    args:
      - name: items
        type: Record<string, unknown>[]
        required: true
        passing: positional
        description: 要素の全ての読めたファイルの項目（ファイルのパスの順）
      - name: alias
        type: ResolvedAlias
        required: true
        passing: positional
        description: 読む `aliases` の要素
      - name: aliasIndex
        type: number
        required: true
        passing: positional
        description: 読む `aliases` の要素の並びでの位置
    returns:
      type: Entry[]
      description: 語の一覧
    process: |-
      1. 各項目の照合する語を `fields.match` の列の順に集め、正規化して `keys` にする（照合の正規化）
      2. `word` は `fields.title` の列の値が空でない文字列ならその値、それ以外は照合する最初の語にする
      3. ID から `word` を引く表をこの要素の項目で作る
      4. type ごとに `fields` を作る。列の名前が `alias.fields` に無い・値が空の列は並べない
         - term: `description`、`related`（各要素の `to` を `{ID}（{名前}）` にして `, ` でつなぐ。名前が引けない ID は ID だけ）
         - doc: `description`
         - command: `command`（値をバッククォートで囲む）、`cwd`、`description`
         - url: `url`、`description`
      5. 列の値が文字列でないとき、数値・真偽値は文字列にし、それ以外は並べない。改行は空白 1 つにする
      6. `origin`・`aliasId`・`type` は alias の値を入れる
    callees:
      - dev/設計書/モジュール構成/プラグイン/照合#functions[normalize]
    unit_tests:
      - name: test_build_entries_when_term
        case: 正常
        summary: term は title を語にし、description と名前を引いた related を並べる
        condition: '`fields` が `id: id`・`match: [name, aliases]`・`title: name`・`description: description`・`related: related`。term-a（`name: Term-A`、`aliases: [用語エー]`、`related: [{to: term-b}, {to: tpl-x}]`）と term-b（`name: Term-B`）'
        mock: なし
        expected: "term-a の word が `Term-A`、keys が `['term-a', '用語エー']`、fields が description と `related: term-b（Term-B）, tpl-x`"
      - name: test_build_entries_when_title_missing
        case: 正常
        summary: title の列が無い・値が空なら照合する最初の語を語にする
        condition: '`fields.title` を書かない要素と、`title: name` で `name` が空の項目。`match: [name, aliases]` の最初の語が `用語エー`'
        mock: なし
        expected: どちらも word が `用語エー`
      - name: test_build_entries_when_command
        case: 正常
        summary: command は command・cwd・description の順で、値のある列だけ
        condition: '`command: uv sync`、`cwd` が無い、`description: 依存を入れる`'
        mock: なし
        expected: 'fields が `command: `uv sync``・`description: 依存を入れる` の 2 つ'
      - name: test_build_entries_when_doc_and_url
        case: 正常
        summary: doc は description だけを、url は url・description を並べる
        condition: type が doc（`description` と `mcp` の列を持つ項目）と url の要素
        mock: なし
        expected: 'doc の fields が description だけで、url の fields に `url: …`'
  - name: loadAliasEntries
    title: aliases の要素の読み込み
    kind: 関数
    container: hooks/lib/entry.ts
    usecase: 共通
    summary: '`aliases` の要素の `patterns` に当たる YAML を更新時刻が変わったものだけ読み直し、語の一覧を返す'
    scope: public
    is_async: true
    args:
      - name: $
        type: EngineInterface
        required: true
        passing: injected
        description: '`$.fs` を使う'
      - name: alias
        type: ResolvedAlias
        required: true
        passing: positional
        description: 読む `aliases` の要素
      - name: aliasIndex
        type: number
        required: true
        passing: positional
        description: 読む `aliases` の要素の並びでの位置
    returns:
      type: Promise<LoadedEntries>
      description: 語の一覧と読めなかった YAML。当たるファイルが無ければどちらも空
    process: |-
      1. `patterns` ごとに glob の展開をし、重複を除いてパスの順に並べる
      2. 各ファイルを変わったファイルの読み込み（種類は `alias`、変換は YAML のパース）で読む
      3. `$.fs.read` の例外か、パースの結果の `ok` が false なら、そのパスと理由を failures に入れ、そのファイルの項目だけを外して続ける
      4. 読めたファイルの項目の取り出しの結果をつなげ、語の組み立てに通して、failures とあわせて返す
    callees:
      - dev/設計書/モジュール構成/プラグイン/読み込み#functions[expandFiles]
      - dev/設計書/モジュール構成/プラグイン/読み込み#functions[readIfChanged]
      - dev/設計書/モジュール構成/プラグイン/読み込み#functions[parseYaml]
      - dev/設計書/モジュール構成/プラグイン/項目#functions[parseItems]
      - dev/設計書/モジュール構成/プラグイン/項目#functions[buildEntries]
    unit_tests:
      - name: test_load_alias_entries
        case: 正常
        summary: glob に当たる全ての YAML の項目を語にする
        condition: '`patterns` が `/d/term/*.yaml`、`/d/term` に term-a.yaml と term-b.yaml'
        mock: テストの `on` で `fs.list`・`fs.stat`・`fs.read` をメモリのファイル表から応答する
        expected: entries が term-a・term-b の順の 2 件で、origin・aliasId・type が要素の値。failures が空
      - name: test_load_alias_entries_when_yaml_malformed
        case: 正常
        summary: 書式の誤った YAML だけを外し、パスと理由を返す
        condition: term-b.yaml が閉じていない括弧を含む
        mock: 同上
        expected: entries が term-a だけで、failures が term-b.yaml のパスと行と列を含む理由の 1 件
test_files:
  - tests/unit/hooks/lib/entry.test.ts
