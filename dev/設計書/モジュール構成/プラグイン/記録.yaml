title: "プラグイン / 記録"
lead: セッションごとに文脈を追加した語のキーを `$.state` に持ち、読み・追加・消去を行う。
directory: |-
  ```text
  hooks/
    lib/
      record.ts          セッションの記録の読み・追加・消去
  types/
    index.d.ts           $.state の型の契約（PluginState）
  tests/
    unit/
      hooks/
        lib/
          record.test.ts record.ts の単体テスト
  ```
data_models:
  - name: PluginState
    title: プラグインの状態の契約
    container: types/index.d.ts
    usecase: 共通
    role: 型の契約
    summary: '`$.state` に置く値の宣言。plugin.json の `types` が指す'
    description: "`interface PluginState { 'alias-inject': { recorded: StateFamily<string[]> } }` を `declare module 'claude-code'` の中で宣言する。"
    properties:
      - name: "'alias-inject'.recorded"
        type: StateFamily<string[]>
        description: セッション ID を `id` にした、文脈を追加した語の記録のキーの並び
functions:
  - name: readRecorded
    title: 記録の読み出し
    kind: 関数
    container: hooks/lib/record.ts
    usecase: 共通
    summary: セッションの記録済みのキーを返す
    scope: public
    is_async: true
    args:
      - name: $
        type: EngineInterface
        required: true
        passing: injected
        description: '`$.state.get` を使う'
      - name: sessionId
        type: string
        required: true
        passing: positional
        description: セッション ID
    returns:
      type: Promise<Set<string>>
      description: 記録済みのキー。書いていないときは空
    process: |-
      1. `$.state.get({ plugin: 'alias-inject', key: 'recorded', id: sessionId })` の `value` を取る
      2. 並びでなければ空、並びなら文字列の要素の Set を返す
    unit_tests:
      - name: test_read_recorded_when_never_written
        case: 正常
        summary: 書いていないセッションは空
        condition: 何も書いていないセッション ID
        mock: なし（`claude-code/testing` の `test` の `$.state`）
        expected: 空の Set
  - name: addRecorded
    title: 記録への追加
    kind: 関数
    container: hooks/lib/record.ts
    usecase: 共通
    summary: セッションの記録にキーを追加する
    scope: public
    is_async: true
    side_effects: '`$.state` のそのセッションの記録を書き換える'
    args:
      - name: $
        type: EngineInterface
        required: true
        passing: injected
        description: '`$.state.get` と `$.state.set` を使う'
      - name: sessionId
        type: string
        required: true
        passing: positional
        description: セッション ID
      - name: keys
        type: string[]
        required: true
        passing: positional
        description: 追加するキー
    returns:
      type: Promise<void>
      description: 何も返さない
    process: 1. 記録の読み出しの結果に keys を加え、並びにして `$.state.set` で書く
    callees:
      - dev/設計書/モジュール構成/プラグイン/記録#functions[readRecorded]
    unit_tests:
      - name: test_add_recorded
        case: 正常
        summary: 追加したキーがそのセッションだけに残る
        condition: セッション s1 に a を、続けて a・b を追加する
        mock: なし（`claude-code/testing` の `test` の `$.state`）
        expected: s1 の記録が a・b、s2 の記録が空
  - name: clearRecorded
    title: 記録の消去
    kind: 関数
    container: hooks/lib/record.ts
    usecase: 共通
    summary: セッションの記録を空にする
    scope: public
    is_async: true
    side_effects: '`$.state` のそのセッションの記録を空の並びにする'
    args:
      - name: $
        type: EngineInterface
        required: true
        passing: injected
        description: '`$.state.set` を使う'
      - name: sessionId
        type: string
        required: true
        passing: positional
        description: セッション ID
    returns:
      type: Promise<void>
      description: 何も返さない
    process: 1. `$.state.set` でそのセッションの記録に `[]` を書く（`undefined` は書けないため）
    unit_tests:
      - name: test_clear_recorded
        case: 正常
        summary: 消去したセッションの記録だけが空になる
        condition: s1・s2 に a を追加し、s1 を消去する
        mock: なし（`claude-code/testing` の `test` の `$.state`）
        expected: s1 が空、s2 が a
test_files:
  - tests/unit/hooks/lib/record.test.ts
