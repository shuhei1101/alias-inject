title: "プラグイン / スキーマ"
lead: '`schemas/aliases.schema.yaml` から生成して同梱するスキーマのオブジェクトで、`aliases` の要素を検証する。検証はスキーマが使うキーワードだけを解釈し、外部のライブラリを使わない。'
directory: |-
  ```text
  hooks/
    lib/
      schema.ts          スキーマのキーワードの確認・値の検証
      aliases-schema.ts  schemas/aliases.schema.yaml から生成したスキーマのオブジェクト（ALIAS_SCHEMA。手で書き換えない）
  scripts/
    gen-aliases-schema.mjs  aliases-schema.ts の生成と、YAML との一致の確認（--check）
  tests/
    unit/
      hooks/
        lib/
          schema.test.ts schema.ts の単体テスト
  ```
classes:
  - name: SchemaError
    title: スキーマの読み込みの失敗
    container: hooks/lib/schema.ts
    usecase: 共通
    summary: 同梱のスキーマが読めない・書式が誤っている・解釈しないキーワードを含むことを、理由つきで伝える例外
    inherits: Error
    properties:
      - name: message
        type: string
        description: スキーマのパスと理由
constants:
  - name: VALIDATION_KEYWORDS
    title: 検証するキーワード
    container: hooks/lib/schema.ts
    usecase: 共通
    summary: 値の検証で解釈するキーワード
    value: '`type`・`enum`・`const`・`required`・`properties`・`additionalProperties`・`items`・`minItems`・`minLength`・`allOf`・`if`・`then`・`$ref`・`$defs`'
  - name: ANNOTATION_KEYWORDS
    title: 読み飛ばすキーワード
    container: hooks/lib/schema.ts
    usecase: 共通
    summary: 検証に効かない注釈のキーワード
    value: '`$schema`・`title`・`description`・`default`・`examples`'
  - name: ALIAS_SCHEMA
    title: 同梱のスキーマ
    container: hooks/lib/aliases-schema.ts
    usecase: 共通
    summary: '`schemas/aliases.schema.yaml` をパースした値。`scripts/gen-aliases-schema.mjs` が生成する'
    value: '`schemas/aliases.schema.yaml` の中身のオブジェクト（型は `Record<string, unknown>`）'
functions:
  - name: loadAliasSchema
    title: スキーマの読み込み
    kind: 関数
    container: hooks/lib/schema.ts
    usecase: 共通
    summary: 同梱のスキーマのキーワードを確かめて返す
    scope: public
    is_async: false
    returns:
      type: Record<string, unknown>
      description: スキーマのルート（ALIAS_SCHEMA）
    exceptions:
      - name: SchemaError
        condition: ALIAS_SCHEMA が解釈しないキーワードか解けない `$ref` を含む
    process: |-
      1. ALIAS_SCHEMA をキーワードの確認にかける
      2. ALIAS_SCHEMA を返す
    callees:
      - dev/設計書/モジュール構成/プラグイン/スキーマ#functions[checkKeywords]
    unit_tests:
      - name: test_load_alias_schema
        case: 正常
        summary: 同梱のスキーマを返す
        condition: 引数なし
        mock: なし
        expected: "`items` が `{ $ref: '#/$defs/alias' }` のマッピングを返す"
  - name: checkKeywords
    title: キーワードの確認
    kind: 関数
    container: hooks/lib/schema.ts
    usecase: 共通
    summary: スキーマが検証するキーワードと読み飛ばすキーワードだけを使い、`$ref` が `$defs` の要素を指すことを確かめる
    scope: internal
    is_async: false
    args:
      - name: root
        type: Record<string, unknown>
        required: true
        passing: positional
        description: スキーマのルート
    returns:
      type: void
      description: 何も返さない
    exceptions:
      - name: SchemaError
        condition: 検証するキーワードにも読み飛ばすキーワードにも無いキーがある、または `$ref` が `#/$defs/{名前}` の形でない・指す要素が無い
    process: |-
      1. ルートからスキーマのマッピングをたどり、各キーが VALIDATION_KEYWORDS か ANNOTATION_KEYWORDS にあるかを確かめる
      2. `properties`・`$defs` の値の各要素、`items`・`if`・`then`・マッピングの `additionalProperties`、`allOf` の各要素をスキーマとしてたどる。`enum`・`const`・`required`・`default`・`examples` の中はたどらない
      3. 無いキーは、そのキーまでのパスとキーの名前で SchemaError を投げる
      4. `$ref` は `#/$defs/{名前}` の形で、ルートの `$defs` にその名前があることを確かめ、無ければ SchemaError を投げる
    unit_tests:
      - name: test_check_keywords
        case: 正常
        summary: リポジトリのスキーマは例外にならない
        condition: ALIAS_SCHEMA
        mock: なし
        expected: 例外にならない
      - name: test_check_keywords_when_unsupported
        case: 異常
        summary: 解釈しないキーワードと解けない `$ref` は例外
        condition: "`$defs.alias.properties.id` に `pattern` を足した値、`$ref: '#/$defs/none'` を持つ値"
        mock: なし
        expected: どちらも SchemaError で、メッセージに `pattern` か `#/$defs/none` を含む
        exception: 解釈しないキーワード・解けない `$ref`
  - name: validateSchema
    title: 値の検証
    kind: 関数
    container: hooks/lib/schema.ts
    usecase: 共通
    summary: 値をスキーマで検証し、合わない箇所をパスと理由の並びで返す
    scope: public
    is_async: false
    args:
      - name: root
        type: Record<string, unknown>
        required: true
        passing: keyword
        description: '`$ref` を解くスキーマのルート'
      - name: schema
        type: unknown
        required: true
        passing: keyword
        description: 検証に使うスキーマ（ルートか、その中のスキーマ）
      - name: value
        type: unknown
        required: true
        passing: keyword
        description: 検証する値
      - name: path
        type: string
        required: true
        passing: keyword
        description: 値のパス。理由の先頭に付ける（例 `aliases[0]`）
    args_example: |-
      ```ts
      validateSchema({ root: schema, schema: schema.items, value: item, path: 'aliases[0]' })
      ```
    returns:
      type: string[]
      description: '`{パス}: {理由}` の並び。合うときは空'
    process: |-
      1. `$ref` があれば、ルートの `$defs` の要素で同じパスを検証した結果を加える
      2. `type` があれば値の型（`null`・`boolean`・`integer`・`number`・`string`・`array`・`object`。整数は `number` にも当たる）と比べ、どれにも当たらなければ理由を加えて、このスキーマの残りのキーワードを見ない
      3. `enum` は値と同じ要素が無いとき、`const` は値と同じでないときに理由を加える（同じかは、配列とマッピングを中まで比べる）
      4. 値がマッピングの場合
         - `required` のキーが無ければ、`{パス}.{キー}` で理由を加える
         - `properties` にあるキーは、`{パス}.{キー}` でそのスキーマを検証する
         - `additionalProperties` が false なら、`properties` に無いキーごとに理由を加える。マッピングなら、そのキーをそのスキーマで検証する
      5. 値が並びの場合、要素の数が `minItems` より少なければ理由を加え、`items` があれば各要素を `{パス}[{位置}]` で検証する
      6. 値が文字列の場合、コードポイントの数が `minLength` より少なければ理由を加える
      7. `allOf` の各要素で同じパスを検証した結果を加える。`if` で検証した結果が空なら、`then` で検証した結果を加える
      8. 読み飛ばすキーワードは見ない
    unit_tests:
      - name: test_validate_schema
        case: 正常
        summary: スキーマに合う要素は空を返す
        condition: ALIAS_SCHEMAで、`type` が term・doc・command・url の要素をそれぞれ書いた値
        mock: なし
        expected: どれも空
      - name: test_validate_schema_when_required_missing
        case: 正常
        summary: 無い必須のキーをパスつきで返す
        condition: '`fields` が無い要素、`type: command` で `fields.command` が無い要素'
        mock: なし
        expected: '`aliases[0].fields` と `aliases[0].fields.command` を含む理由'
      - name: test_validate_schema_when_type_mismatch
        case: 正常
        summary: 型・列挙・最小の数と長さに合わない値を返す
        condition: '`id` が数値、`type` が `memo`、`paths` が `[]`、`id` が空文字'
        mock: なし
        expected: それぞれ `aliases[0].id`・`aliases[0].type`・`aliases[0].paths`・`aliases[0].id` の理由
      - name: test_validate_schema_when_additional_property
        case: 正常
        summary: 書けないキーを返す
        condition: '`type: term` の `fields` に `mcp`、要素の最上位に `label`'
        mock: なし
        expected: '`aliases[0].fields.mcp` と `aliases[0].label` の理由'
      - name: test_validate_schema_when_if_not_matched
        case: 正常
        summary: '`if` に合わないときは `then` を使わない'
        condition: '`allOf` の `if` が `type: { const: url }`、`then` が `required: [url]` のスキーマで、`type: term` の値'
        mock: なし
        expected: 空
  - name: generateAliasSchema
    title: 同梱のスキーマの生成
    kind: 関数
    container: scripts/gen-aliases-schema.mjs
    usecase: 共通
    summary: '`schemas/aliases.schema.yaml` から `hooks/lib/aliases-schema.ts` を書き出す。`--check` では書き出さずに一致を確かめる'
    scope: public
    is_async: false
    side_effects: '`--check` が無いとき `hooks/lib/aliases-schema.ts` を書き換える'
    args:
      - name: check
        type: boolean
        required: true
        passing: positional
        description: コマンドラインに `--check` があるか
    args_example: |-
      ```bash
      node scripts/gen-aliases-schema.mjs          # 書き出す
      node scripts/gen-aliases-schema.mjs --check  # 一致を確かめる
      ```
    returns:
      type: void
      description: 終了コードで結果を返す（一致・書き出し済みは 0、`--check` で一致しなければ 1）
    process: |-
      1. `node:fs` でリポジトリの直下からの `schemas/aliases.schema.yaml` を読み、`hooks/vendor/js-yaml.mjs` の `load` でパースする
      2. 先頭の行 `// schemas/aliases.schema.yaml から scripts/gen-aliases-schema.mjs が生成する。直接編集しない` と、`export const ALIAS_SCHEMA: Record<string, unknown> = {値の JSON.stringify（字下げ 2）}` を並べた本文を組む
      3. `check` が false なら本文を `hooks/lib/aliases-schema.ts` に書く
      4. `check` が true なら `hooks/lib/aliases-schema.ts` と本文を比べ、違うか無ければ `hooks/lib/aliases-schema.ts が schemas/aliases.schema.yaml と一致しません。node scripts/gen-aliases-schema.mjs を実行してください` を標準エラーに出して終了コード 1 で終える
    notes:
      テスト: '`claude plugin test` の環境は `node:fs` を import できないため単体テストを持たない。lint の `--check` が一致を確かめる'
test_files:
  - tests/unit/hooks/lib/schema.test.ts
