title: "プラグイン / 入口"
lead: |-
  Claude Code が `hooks/hooks.json` の `modules` から読む hooks モジュールの入口と、プラグイン・マーケットプレイス・型の確認の定義ファイル。
  入口は `prompt.submit`・`session.compact`・`session.end`・`tool.call` に処理を登録する。
directory: |-
  ```text
  .claude-plugin/
    plugin.json          プラグインの定義（名前 alias-inject・説明・types は ./types/index.d.ts。version は置かない）
    marketplace.json     マーケットプレイスの定義（plugins[0].source が ./ でリポジトリ自身を載せる）
    types/               エンジンが書き出す mod の型の宣言（git に入れない）
  hooks/
    hooks.json           { "modules": ["./register.tsx"] }
    register.tsx         hooks モジュールの入口（register）
    handlers.ts          prompt.submit・session.compact・session.end・tool.call の処理（イベントの処理の設計書）
    lib/                 読み込み・スキーマ・設定・エイリアス・リポジトリ・項目・照合・文脈・記録・変数参照・ツール・生成したスキーマ（各分類の設計書）
    vendor/              同梱する外部ライブラリ（js-yaml）
  schemas/
    aliases.schema.yaml  aliases の共通のスキーマ（hooks/lib/aliases-schema.ts の生成元）
  scripts/
    gen-aliases-schema.mjs  hooks/lib/aliases-schema.ts の生成・一致の確認（スキーマの生成の設計書）
  types/
    index.d.ts           $.state の型の契約（PluginState。状態の型の設計書）
  tests/
    unit/
      hooks/
        register.test.ts register の単体テスト（claude plugin test で流す）
        handlers.test.ts handlers.ts の単体テスト
  package.json           private・type module・script typecheck（tsc -p tsconfig.json --noEmit）・devDependencies typescript 5.9.3
  tsconfig.json          { "extends": "./.claude-plugin/types/tsconfig.json" }（エンジンが書き出し、git に入れる）
  ```
functions:
  - name: register
    title: 入口
    kind: 関数
    container: hooks/register.tsx
    usecase: 共通
    role: 入口
    summary: hooks モジュールの入口として、4 つのイベントに処理を登録する
    inherits: dev/設計書/外部ライブラリ/claude-code#catalogs[API].entries[Register]
    scope: public
    is_async: false
    args:
      - name: on
        title: 処理の登録
        type: On（claude-code の Register の引数）
        required: true
        passing: injected
        description: イベントへ処理を登録する関数。エンジンが渡す
        notes: 4 回呼ぶ
    args_example: |-
      ```ts
      import type { Register } from 'claude-code'

      export const register: Register = (on) => {
        on('prompt.submit', handlePromptSubmit)
        on('session.compact', handleSessionCompact)
        on('session.end', handleSessionEnd)
        on('tool.call', handleToolCall)
      }
      ```
    returns:
      type: void
      description: 何も返さない
    process: 1. `on('prompt.submit', handlePromptSubmit)`・`on('session.compact', handleSessionCompact)`・`on('session.end', handleSessionEnd)`・`on('tool.call', handleToolCall)` を呼ぶ
    unit_tests:
      - name: test_register
        case: 正常
        summary: 設定ファイルのパスが無いとき、入力の送信が変わらずに届く
        condition: "テストの中で `prompt.submit` に届いた text と context をそのまま返す処理を登録し、`$.prompt.submit({ text: 'hello', wait: false, origin: { kind: 'composer' } })` を流す"
        mock: なし（`claude-code/testing` の `test` が mod を読み込んだ環境で流す）
        expected: 結果の `text` が `hello` で、`context` に何も追加されていない（`undefined` か空の配列）
    implementation: hooks/register.tsx#register
    status: implemented
    introduced:
      pr: 5
notes:
  テストと型の確認: |-
    - テストは `claude plugin test` で流す。`dir` の下の `*.test.ts` を全て流すので、`tests/` の下に置いても読まれる
    - 型の確認は `npm run typecheck`。対象のファイルは `.claude-plugin/types/tsconfig.json` の `include` に従う。`tests/` が対象に入らないときは planner へ差し戻す
    - `.claude-plugin/types/` は、信頼済みのフォルダから `claude --plugin-dir {worktree}` の対話のセッションを 1 度起動すると書き出される（[PoC 結果](../../../pr/5/プラグイン.md)）
test_files:
  - tests/unit/hooks/register.test.ts
