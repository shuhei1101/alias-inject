summary: 1 機能の正常・異常シナリオ
items:
  - page: 入力への引用の文脈の追加.yaml
    summary: 入力に初めて出た語の引用の文脈を、入力の文を変えずにモデルに追加する
  - page: 設定とYAMLの読み直し.yaml
    summary: 設定ファイル・`dev-docs.yaml`・照合の YAML のどれかを書き換えると、次の入力から反映される
  - page: 圧縮とクリアの後の記録の消去.yaml
    summary: 圧縮か /clear の後に同じ語を入力すると、文脈がもう一度追加される
  - page: 読んだ本文への変数参照の値の追加.yaml
    summary: ツールで読んだ本文の `!{名前}` に、同じ名前の環境変数の値を文脈として追加する
