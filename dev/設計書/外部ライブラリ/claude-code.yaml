title: "claude-code"
kind: "フレームワーク"
version:
  current: 2.1.310
  checked_on: '2026-10-25'
  source: 利用者の手元の Claude Code のバージョン（`claude --version`）
catalogs:
  - name: API
    version: 2.1.310
    entries:
      - name: Register
        kind: 型
        purpose: hooks モジュールが export する入口 `register` の型。引数の `on` でイベントへ処理を登録する
      - name: test
        kind: 関数
        purpose: '`claude-code/testing` のテストの定義。コールバックは mod を読み込んだ環境の `$` と `on` を受ける'
      - name: expect
        kind: 関数
        purpose: '`claude-code/testing` の期待値の確認'
      - name: $.settings.read
        kind: 関数
        purpose: Claude Code の設定を、スコープ（`source`）とキー（`key`）を指定して読む
        params:
          - name: source
            type: "'user' | 'project' | 'local' | 'flag' | 'policy'"
            default: 全スコープを重ねた値
            description: 読むスコープ
            notes: ユーザースコープだけを読むときは `user`
          - name: key
            type: string
            description: 読むキー。ドットで階層を指す
            notes: 省くと設定のオブジェクト全体を返す
        returns:
          - name: '-'
            type: Promise<unknown>
            description: '`key` を指定したときはそのキーの値。省いたときは設定のオブジェクト'
        params_example: |-
          ```ts
          const env = await $.settings.read({ source: 'user', key: 'env' })
          ```
      - name: $.env.get
        kind: 関数
        purpose: 環境変数の値を読む
        params:
          - name: name
            type: string
            required: true
            description: 環境変数の名前
        returns:
          - name: '-'
            type: Promise<string | undefined>
            description: 環境変数の値。無いときは undefined
      - name: $.fs.read
        kind: 関数
        purpose: ファイルをテキストで読む
        params:
          - name: path
            type: string
            required: true
            description: 読むファイルの絶対パス
        returns:
          - name: '-'
            type: Promise<string>
            description: ファイルの中身
      - name: $.fs.stat
        kind: 関数
        purpose: ファイル・フォルダの種類と更新時刻を調べる
        params:
          - name: path
            type: string
            required: true
            description: 調べるパスの絶対パス
          - name: options.resolve
            type: boolean
            description: リンクの指す先を調べるか
            notes: '`true` のとき、返り値の `realPath` に解決したパスが入る'
        returns:
          - name: kind
            type: "'file' | 'dir' | 'other'"
            description: 種類
          - name: size
            type: number
            description: バイト数
          - name: mtimeMs
            type: number
            description: 更新時刻（ミリ秒）
          - name: isLink
            type: boolean
            description: シンボリックリンクか
          - name: realPath?
            type: string
            description: 解決したパス
            notes: '`options.resolve` が `true` のときだけ入る'
      - name: $.fs.list
        kind: 関数
        purpose: フォルダの直下の項目を一覧する
        params:
          - name: path
            type: string
            description: 一覧するフォルダの絶対パス
        returns:
          - name: '[].name'
            type: string
            description: 項目の名前
          - name: '[].kind'
            type: "'file' | 'dir' | 'other'"
            description: 種類
          - name: '[].size'
            type: number
            description: バイト数
          - name: '[].mtimeMs'
            type: number
            description: 更新時刻（ミリ秒）
          - name: '[].isLink'
            type: boolean
            description: シンボリックリンクか
      - name: $.state
        kind: オブジェクト
        purpose: プラグインの状態を名前（`plugin`・`key`）で読み書きする
        description: '`get(ref)` が `{ value, version }` を返し、`set(ref, value, options?)` が値を書く。名前に使える `plugin` と `key` は `PluginState` の宣言に挙げたものに限る。`options.ifVersion` を渡すと、読んだバージョンと一致したときだけ書く。'
      - name: $.session.id
        kind: 関数
        purpose: 今のセッションの ID を返す
        returns:
          - name: '-'
            type: Promise<string>
            description: セッション ID
      - name: $.session.root
        kind: 関数
        purpose: セッションを起動したプロジェクトの直下のパスを返す
        returns:
          - name: '-'
            type: Promise<string>
            description: プロジェクトの直下の絶対パス
      - name: $.session.repo
        kind: 関数
        purpose: セッションのリポジトリの情報を返す
        returns:
          - name: root
            type: string
            description: リポジトリの直下の絶対パス
          - name: remote
            type: string | null
            description: リモートの URL
          - name: internal
            type: boolean
            description: 社内のリポジトリか
          - name: name
            type: string | null
            description: リポジトリの名前
        notes:
          リポジトリが無いとき: 返り値は null
      - name: $.ui.log
        kind: 関数
        purpose: テキストを会話の記録かデバッグログに出す
        params:
          - name: text
            type: string
            required: true
            description: 出すテキスト
          - name: options.to
            type: "'transcript' | 'debug'"
            default: transcript
            description: 出す先
            notes: '`debug` はデバッグログに出す'
      - name: $.process.run
        kind: 関数
        purpose: 子プロセスを起こして終了を待ち、終了コードと標準出力を返す
        params:
          - name: argv
            type: string[]
            required: true
            description: コマンドと引数の並び
          - name: options.timeoutMs
            type: number
            description: 待ちの上限（ミリ秒）
            notes: 超えると例外になる
        params_example: |-
          ```ts
          const run = await $.process.run(['env', '-0'], { timeoutMs: 20 })
          ```
        returns:
          - name: exitCode
            type: number
            description: 子プロセスの終了コード
            notes: 0 以外でも例外にはならない
          - name: stdout
            type: string
            description: 標準出力
        returns_example: 起動できないとき（`ENOENT`）と、`options.timeoutMs` を超えたときは例外になる。子プロセスは Claude Code の環境変数を継ぐ。
  - name: コマンド
    version: 2.1.310
    entries:
      - name: claude plugin test
        kind: コマンド
        purpose: 指定のフォルダの下の `*.test.ts` / `*.test.tsx` を全て流す。失敗があれば終了コード 1
      - name: claude plugin validate
        kind: コマンド
        purpose: プラグインと hooks モジュールの定義を検証する
  - name: イベント
    version: 2.1.310
    entries:
      - name: prompt.submit
        kind: イベント
        purpose: 入力の送信ごとに呼ばれ、入力の文と追加の文脈を受けて次の処理へ渡す
        params:
          - name: e.text
            type: string
            required: true
            description: 入力の文（貼り付けは展開済み）
          - name: e.command
            type: PromptSubmitCommand
            description: スラッシュコマンドの行のときに入る
          - name: e.context
            type: readonly string[]
            description: 他のフックが追加した文脈
          - name: e.origin.kind
            type: "'composer' | 'bridge' | 'sdk' | 'task-notification' | 'scheduled-trigger' | 'peer' | 'peer-send-message' など"
            required: true
            description: 入力の出所
        returns:
          - name: text
            type: string
            description: モデルへ渡す入力の文
          - name: context
            type: readonly string[]
            description: モデルにだけ追加する文脈
      - name: session.compact
        kind: イベント
        purpose: 会話の圧縮ごとに呼ばれ、`next(e)` が圧縮した結果か見送りを返す
        params:
          - name: e.trigger
            type: "'manual' | 'auto' | 'plugin' | 'precompute'"
            required: true
            description: 圧縮のきっかけ
          - name: e.agentId
            type: string
            description: サブエージェント・フォークの会話の圧縮のときに入る
        returns:
          - name: '-'
            type: SessionCompactResult
            description: 圧縮した結果か、見送りを表す `skip`
      - name: session.end
        kind: イベント
        purpose: セッションの終了ごとに呼ばれ、終わる理由とセッション ID を受ける
        params:
          - name: e.reason
            type: SessionEndReason
            required: true
            description: 終わる理由。`/clear` で終わるときは `clear`
          - name: e.sessionId
            type: string
            required: true
            description: 終わるセッションの ID
        returns:
          - name: sessionId
            type: string
            description: 終わったセッションの ID
      - name: tool.call
        kind: イベント
        purpose: ツールの呼び出しごとに呼ばれ、`next(e)` がツールを実行して結果を返す
        params:
          - name: e
            type: ToolCallInput
            required: true
            description: ツールの呼び出し。そのまま `next(e)` に渡す
          - name: e.tool
            type: string
            required: true
            description: ツールの名前（`Read`・`Bash`・`mcp__{サーバー}__{ツール}` など）
          - name: e.tool_use_id
            type: string
            required: true
            description: ツールの呼び出しの ID
          - name: e.{引数}
            type: unknown
            required: false
            description: ツールの引数。`e` の直下に展開されて入る
            notes: Read は `e.file_path`（読んだファイルの絶対パス）、Bash は `e.command`、MCP のツールは呼び出しの引数（dev-docs の `search_docs` なら `e.source`・`e.filter`・`e.view`・`e.limit`）
          - name: e.agentId
            type: string
            required: false
            description: サブエージェント・フォークの中の呼び出しのときに入る
            notes: メインの会話の Agent の呼び出し自体には入らない
        returns:
          - name: text?
            type: string
            description: ツールの結果の本文
            notes: 組み込みのツールと MCP のツールのどちらでも読める。本文が無い結果では入らない
          - name: isError?
            type: boolean
            description: エラーの結果のとき true
          - name: deny?
            type: string
            description: 他のフックが実行を拒んだときに入る
          - name: context?
            type: readonly string[]
            description: モデルにだけ追加する文脈
            notes: '末尾に追加した文字列が、ツールの結果の後ろの文脈としてモデルに届く'
lead: Claude Code が mod に渡す hooks モジュールの型（`claude-code`）と、mod のテストの道具（`claude-code/testing`）。パッケージとして入れず、エンジンが型の宣言を書き出し、実行時に解決する。
used_in:
  - hooks/register.tsx
  - tests/unit/hooks/register.test.ts
  - hooks/handlers.ts
  - hooks/lib/config.ts
  - hooks/lib/loader.ts
  - hooks/lib/record.ts
verification:
  state: 済
  date: '2026-10-31'
  detail: 'PoC PR #6（commit d79fd2a）で、2.1.310 の `Register` の入口の読み込み、`claude-code/testing` の `test` / `expect` のテスト 1 件の pass、`claude plugin test` / `claude plugin validate` の終了コード 0 を確かめた。PoC PR #16（commit 0a72f27）で、`tool.call` の `next(e)` の結果の `text` が Read・Bash・MCP のツールで読め、返り値の `context` に追加した文字列がモデルに届くことと、`$.process.run` の終了コード・起動できない例外・`timeoutMs` の超過の例外を確かめた。PoC PR #53（Claude Code 2.1.316）で、`tool.call` の `e` にツールの名前（`tool`）・呼び出しの ID（`tool_use_id`）・直下に展開したツールの引数（Read の `file_path`・Bash の `command`・MCP の引数）が入り、`agentId` がサブエージェントの中の呼び出しにだけ入ることと、`context` に並べた 2 つの文字列がどちらもモデルに届くことを確かめた'
