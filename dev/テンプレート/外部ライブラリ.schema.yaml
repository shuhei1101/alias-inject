$schema: https://json-schema.org/draft/2020-12/schema
title: 外部ライブラリ
description: |-
  採用した外部ライブラリ 1 つにつき 1 ファイル。そのプロジェクトで使う部分だけを公式ドキュメントから抜き出す。
  参照はモジュール構成 → 外部ライブラリの一方向。自プロジェクトのファイル・モジュールには言及しない（使用箇所を除く）。
x-kind: library
x-folder: dev/設計書/外部ライブラリ
type: object
additionalProperties: false
required:
- title
- kind
- version
- catalogs
properties:
  title:
    type: string
    title: タイトル
    description: ライブラリ名（パッケージ名）。ファイル名に合わせる。
  lead:
    $ref: 共通.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: |-
      ライブラリが何をするものかを 1〜3 行で要約する。自プロジェクトでの用途は書かない。
      初回に書いた内容のまま保ち、後から情報を足さない。
  kind:
    type: string
    title: 種類
    enum:
    - ライブラリ
    - フレームワーク
    - CLI
    - サービス
    - コンテナ
    - CDN の JS
    - 標準ライブラリ
  purl:
    type: string
    title: 識別子
    description: パッケージの識別子（purl。例 `pkg:pypi/ruamel.yaml`）。
  supplier:
    type: string
    title: 提供元
  dependency_scope:
    type: string
    title: 依存の範囲
    enum:
    - 必須
    - 任意
    - 開発のみ
  adoption:
    type: string
    title: 採用状態
    enum:
    - 採用
    - 未採用
  used_in:
    type: array
    title: 使用箇所
    description: 呼び出す境界層のパス（リポジトリの直下から）。エージェントの手順から呼ぶ CLI は手順を持つドキュメントのパス。
    items:
      type: string
  upstream:
    type: string
    title: 上流リポジトリ
    description: GitHub の `owner/repo`。GitHub に無い製品は持たない。規約『不具合の報告』の上流 Issue の検索がここから引く。
    pattern: ^[^/\s]+/[^/\s]+$
  verification:
    type: object
    title: 動作確認
    description: 動かして確かめたか。
    x-shape: attributes
    additionalProperties: false
    required:
    - state
    properties:
      state:
        type: string
        title: 状態
        enum:
        - 済
        - 未確認
      date:
        type: string
        title: 確認日
        description: '`YYYY-MM-DD`。'
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      detail:
        type: string
        title: 確認内容
        description: 確かめた内容か、確かめられない理由。
  version:
    type: object
    title: 現在のバージョン情報
    x-heading: 現在のバージョン情報
    x-shape: attributes
    additionalProperties: false
    required:
    - current
    - checked_on
    properties:
      current:
        type: string
        title: 版
        description: 採用している版。
      latest:
        type: string
        title: 最新版
      checked_on:
        type: string
        title: 確認日
        description: 最新版を確かめた日（`YYYY-MM-DD`）。
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      source:
        type: string
        title: 版の出所
        description: 突き合わせる依存の定義（`uv.lock` / `pyproject.toml` / CDN の URL）。
      pinning:
        type: string
        title: 版の固定の仕方
      support_until:
        type: string
        title: サポート期限
      security_until:
        type: string
        title: セキュリティ対応の期限
      lts:
        type: boolean
        title: LTS
  license:
    type: string
    title: ライセンス
    description: 商用利用の可否を確かめて書く。
  official_url:
    type: string
    title: 公式 URL
  docs_url:
    type: string
    title: 公式ドキュメント
    description: API リファレンスの URL。
  selection:
    type: object
    title: 選定の記録
    x-heading: 選定の記録
    additionalProperties: false
    properties:
      candidates:
        $ref: 共通.schema.yaml#/$defs/markdown
        title: 比べた候補
      decision:
        $ref: 共通.schema.yaml#/$defs/markdown
        title: 決めた理由
      consequences:
        $ref: 共通.schema.yaml#/$defs/markdown
        title: 結果
  install:
    $ref: 共通.schema.yaml#/$defs/markdown
    title: インストール手順
    description: 版を固定したコマンドと、追加の設定（コードブロック）。
    x-heading: インストール手順
  catalogs:
    type: array
    title: 一覧
    x-shape: sections
    x-key: name
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - version
      - entries
      properties:
        name:
          type: string
          title: 単位
          description: 列挙する対象の単位（`API` / `コマンド` / `設定` / `ファイル` / `環境変数` / `同梱プラグイン` 等）。見出しは `{単位} 一覧`。
        version:
          type: string
          title: 版
          description: 一覧を作った版。
        entries:
          type: array
          title: 対象
          description: このプロジェクトで使う対象だけ。一覧の表は各対象の種別・名前・用途から生成する。
          x-shape: sections
          x-key: name
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - kind
            - purpose
            properties:
              name:
                type: string
                title: 名前
                description: 対象の名前（関数・コンポーネント・コマンド 等）。
              kind:
                type: string
                title: 種別
                description: '`コンポーネント` / `関数` / `フック` / `クラス` / `定数` / `コマンド` 等。'
              purpose:
                $ref: 共通.schema.yaml#/$defs/summary
                title: 用途
                description: 1 行の用途。
              description:
                $ref: 共通.schema.yaml#/$defs/markdown
                title: 説明
              params:
                type: array
                title: パラメータ
                description: 使うものだけでなく主要なパラメータも全部載せる。
                x-heading: パラメータ
                x-shape: table
                x-key: name
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - name
                  - type
                  - description
                  properties:
                    name:
                      type: string
                      title: パラメータ
                      description: オブジェクトの子は `parent.child`、配列の要素の子は `parent[].child`。
                    type:
                      type: string
                      title: 型
                      description: 取りうる値が限られるときは列挙し、各値の意味は補足に書く。
                    required:
                      type: boolean
                      title: 必須
                    default:
                      type: string
                      title: 既定
                      description: 任意のパラメータの省略時の値。
                    description:
                      type: string
                      title: 説明
                    constraints:
                      type: string
                      title: 制限
                    notes:
                      type: string
                      title: 補足
              params_example:
                $ref: 共通.schema.yaml#/$defs/markdown
                title: パラメータ例
                description: import 込みの最小の動く例（コードブロック）。
              returns:
                type: array
                title: 戻り値
                description: 単純な値は `name` を `-` にした 1 要素。
                x-heading: 戻り値
                x-shape: table
                x-key: name
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - name
                  - type
                  - description
                  properties:
                    name:
                      type: string
                      title: フィールド
                      description: 返らないことがあるフィールドは `field?` と書き、条件を補足に書く。
                    type:
                      type: string
                      title: 型
                    description:
                      type: string
                      title: 説明
                    constraints:
                      type: string
                      title: 制限
                    notes:
                      type: string
                      title: 補足
              returns_example:
                $ref: 共通.schema.yaml#/$defs/markdown
                title: 戻り値例
              refs:
                type: array
                title: 関連
                items:
                  $ref: 共通.schema.yaml#/$defs/ref
              reason:
                $ref: 共通.schema.yaml#/$defs/reason
              status:
                $ref: 共通.schema.yaml#/$defs/status
              visibility:
                $ref: 共通.schema.yaml#/$defs/visibility
              implementation:
                $ref: 共通.schema.yaml#/$defs/implementation
              introduced:
                $ref: 共通.schema.yaml#/$defs/introduced
              aliases:
                $ref: 共通.schema.yaml#/$defs/aliases
              notes:
                $ref: 共通.schema.yaml#/$defs/notes
  limitations:
    type: array
    title: 制限事項
    description: 仕様として常に成り立つ制約。
    x-heading: 制限事項
    x-shape: table
    x-key: item
    items:
      type: object
      additionalProperties: false
      required:
      - item
      - content
      properties:
        item:
          type: string
          title: 事項
        content:
          type: string
          title: 内容
        notes:
          type: string
          title: 補足
  usage_limits:
    type: array
    title: 利用上限
    x-heading: 利用上限
    x-shape: table
    x-key: item
    items:
      type: object
      additionalProperties: false
      required:
      - item
      - content
      properties:
        item:
          type: string
          title: 項目
          description: '`利用枠` / `到達時の挙動` / `解除時刻` 等。'
        content:
          type: string
          title: 内容
        notes:
          type: string
          title: 補足
  issues:
    type: array
    title: 不具合一覧
    description: 仕様どおりに使っても期待どおり動かない事象。こちらの使い方の誤りだったものは書かない。解消を確かめたら消す。
    x-heading: 不具合一覧
    x-shape: sections
    x-key: title
    items:
      type: object
      additionalProperties: false
      required:
      - title
      - summary
      - occurred_on
      - description
      - workarounds
      properties:
        title:
          type: string
          title: タイトル
        summary:
          $ref: 共通.schema.yaml#/$defs/summary
          title: 概要
          description: 1 行で事象を要約する。
        occurred_on:
          type: string
          title: 発生日
          description: 事象を確認した日（`YYYY-MM-DD`）。再確認して続いていたら更新する。
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        state:
          type: string
          title: 状態
          enum:
          - 未解決
          - 回避策あり
          - 解消済み
        description:
          $ref: 共通.schema.yaml#/$defs/markdown
          title: 概要
          description: 何が起きるかを事実だけで書く。
        conditions:
          type: array
          title: 条件
          description: 再現する状況。
          x-shape: list
          items:
            type: string
        workarounds:
          type: array
          title: 対処法
          x-heading: 対処法
          x-shape: table
          x-key: method
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - method
            - result
            properties:
              method:
                type: string
                title: 方法
                description: 回避策が無いときは `回避策なし`。
              result:
                type: string
                title: 結果
                description: 得られるものと、本来やりたかったことからのずれ。
              recommended:
                type: boolean
                title: 推奨
                description: 最初に試す 1 案だけ。
        upstream_issue:
          type: string
          title: 上流の Issue
          description: 上流の Issue の URL。
        fixed_in:
          type: string
          title: 解消版
          description: 解消した版。達したら回避策を外す候補になる。
        refs:
          type: array
          title: 関連
          items:
            $ref: 共通.schema.yaml#/$defs/ref
        notes:
          $ref: 共通.schema.yaml#/$defs/notes
  refs:
    type: array
    title: 関連
    items:
      $ref: 共通.schema.yaml#/$defs/ref
  notes:
    $ref: 共通.schema.yaml#/$defs/notes
    x-heading: 補足
    x-shape: sections
    description: 対象固有の解説節（節の名前 → 本文）。一覧・制限事項・不具合に属さないもの。
examples:
- title: react-image-crop
  lead: |-
    React 用の画像トリミング（クロップ）UI ライブラリ。
    選択範囲のプレビューを提供し、トリミング後の画像を Blob / dataURL で出す。
  kind: ライブラリ
  purl: pkg:npm/react-image-crop
  dependency_scope: 必須
  adoption: 採用
  used_in:
  - components/AvatarCropModal.tsx
  upstream: DominicTobias/react-image-crop
  verification:
    state: 済
    date: '2026-07-24'
    detail: 円形の選択とプレビューを最小のコードで動かした
  version:
    current: 11.0.5
    latest: 11.0.5
    checked_on: '2026-07-24'
    source: package.json
    pinning: 完全一致で固定
  license: ISC
  official_url: https://github.com/DominicTobias/react-image-crop
  docs_url: https://github.com/DominicTobias/react-image-crop#readme
  install: |-
    ```bash
    npm install react-image-crop@11.0.5
    ```

    CSS の読み込みも要る。

    ```ts
    import "react-image-crop/dist/ReactCrop.css";
    ```
  catalogs:
  - name: API
    version: 11.0.5
    entries:
    - name: centerCrop
      kind: 関数
      purpose: クロップ範囲を画像の中央に置く
      params:
      - name: crop
        type: Crop
        required: true
        description: 中央に置きたいクロップ範囲
      - name: mediaWidth
        type: number
        required: true
        description: 画像の幅（px）
      - name: mediaHeight
        type: number
        required: true
        description: 画像の高さ（px）
      params_example: |-
        ```ts
        const initial = centerCrop({ unit: "%", x: 0, y: 0, width: 50, height: 50 }, 1280, 720);
        ```
      returns:
      - name: '-'
        type: Crop
        description: 中央に置いたクロップ範囲
  issues:
  - title: onCrop が初回マウント時に発火しない
    summary: 初期値を渡しても最初の 1 回だけコールバックが呼ばれない
    occurred_on: '2026-08-02'
    state: 回避策あり
    description: '`crop` に初期値を渡してマウントしても、`onCrop` が最初の 1 回だけ呼ばれない。'
    conditions:
    - v11.0.0 以降
    - '`crop` を制御コンポーネントとして親から渡している'
    workarounds:
    - method: マウント直後に親側で初期値を 1 度流す
      result: 初回から値が揃う
      recommended: true
    - method: v10 系に固定する
      result: 発火するが、v11 の性能改善を受け取れない
