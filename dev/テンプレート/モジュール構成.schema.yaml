              title: 対象 API
            summary:
              type: string
              title: 概要
            checks:
              type: string
              title: 確認内容
              description: 認証・エンドポイント・使うパラメータの値・応答の形など。
            cost:
              type: string
              title: 料金・副作用
              description: 1 回あたりの料金と副作用。無いときも `なし` と書く。
            notes:
              type: string
              title: 補足
      callers:
        type: array
        title: 呼び出し元
        items:
          $ref: 共通.schema.yaml#/$defs/ref
      callees:
        type: array
        title: 呼び出し先
        items:
          $ref: 共通.schema.yaml#/$defs/ref
      refs:
        type: array
        title: 関連
        items:
          $ref: 共通.schema.yaml#/$defs/ref
      reason:
        $ref: 共通.schema.yaml#/$defs/reason
      status:
        $ref: 共通.schema.yaml#/$defs/status
      visibility:
        $ref: 共通.schema.yaml#/$defs/visibility
