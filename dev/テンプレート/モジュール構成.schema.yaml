      title: *id002
      container: *id003
      usecase: *id004
      role: *id005
      summary: *id006
      description: *id007
      kind:
        type: string
        title: 種別
        enum:
        - 関数
        - メソッド
        - フック
      inherits:
        type: string
        title: 継承元
        description: 実装する関数型・インタフェースの論理名（別の設計書なら参照）。
      scope:
        type: string
        title: 公開範囲
        description: '`public`（外から呼ぶ）/ `internal`（先頭 `_` などの内部の関数）。'
        enum:
        - public
        - internal
      is_async:
        type: boolean
        title: 非同期
        description: 非同期関数か。
      thread_safe:
        type: boolean
        title: 並行で呼べる
        description: 並行で呼んでよいか。
      side_effects:
        $ref: 共通.schema.yaml#/$defs/markdown
        title: 副作用
        description: 引数の書き換え・外への書き込み。
      args:
        type: array
        title: 引数
        description: 引数の表。引数の無い関数は持たない。
        x-heading: 引数
        x-shape: table
        x-key: name
        items: *id010
      args_example:
        $ref: 共通.schema.yaml#/$defs/markdown
        title: 引数例
        description: 呼び出しのコード 1〜数行（コードブロック）。
      returns:
        type: object
        title: 戻り値
        x-heading: 戻り値
        x-shape: attributes
        additionalProperties: false
        required:
        - type
        - description
        properties:
          type:
            type: string
            title: 型
            description: void / None も書く。
          description:
            type: string
            title: 説明
          notes:
            type: string
            title: 補足
      returns_example:
        $ref: 共通.schema.yaml#/$defs/markdown
        title: 戻り値例
        description: 返り値の実形（コードブロック）。void / None は持たない。
      process:
        $ref: 共通.schema.yaml#/$defs/markdown
        title: 処理
        description: |-
          番号付きのステップ。1 ステップ = 意味のある処理の単位。
          呼び出す関数は文末の括弧内に論理名で添える。
          択一の分岐は 1 つの番号の下に `- {条件}の場合、{内容}` で並べる。
          ログは配下に `- `[{レベル}]` {出力する事実}（{値}）` で書く。
        x-heading: 処理
      exceptions:
        type: array
        title: 例外
        description: 送出する例外。送出しない関数は持たない。
        x-heading: 例外
        x-shape: table
        x-key: name
        items:
          type: object
          additionalProperties: false
          required:
          - name
          - condition
          properties:
            name:
              type: string
              title: 例外名
              description: 送出する例外のクラス名。
            condition:
              type: string
              title: 発生条件
              description: 送出する条件。同じ例外を複数の箇所から送るときは箇所ごとに別の要素にする。
            message:
              type: string
              title: メッセージ
            notes:
              type: string
              title: 補足
      test_setup:
        type: array
        title: セットアップ
        description: 複数のテストが共有する準備。
        x-shape: table
        x-key: name
        items:
          type: object
          additionalProperties: false
          required:
          - name
          - description
          properties:
            name:
              type: string
              title: セットアップ
            description:
              type: string
              title: 説明
            notes:
              type: string
              title: 補足
              description: fixture の物理名など。
      unit_tests:
        type: array
        title: 単体テスト
        description: |-
          条件分岐の単位で 1 行以上。自関数で送出する例外は異常の行にする。
          キャッチせずに伝播する例外には行を置かない。
        x-heading: 単体テスト
        x-shape: table
        x-key: name
        items: *id011
      connectivity_tests:
        type: array
        title: 疎通テスト
        description: 実 API を呼ぶラッパーの関数だけが持つ。使うパラメータの値の組を 1 組 = 1 テストで並べる。
        x-heading: 疎通テスト
        x-shape: table
        x-key: name
        items:
          type: object
          additionalProperties: false
          required:
          - name
          - api
          - summary
          - checks
          - cost
          properties:
            name:
              type: string
              title: テスト名
              description: '`test_ext_{関数の物理名}_when_{パラメータ値}`。'
              pattern: ^test_ext_[a-z0-9_]+$
              x-test-function: external_test_files
            api:
