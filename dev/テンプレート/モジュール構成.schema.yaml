      aliases:
        $ref: 共通.schema.yaml#/$defs/aliases
      notes:
        $ref: 共通.schema.yaml#/$defs/notes
examples:
- title: 設計書 / 種別とSchema
  lead: 種別の Schema を読み込んで種別の一覧と `$ref` の解決先を持ち、設計書のパスから種別を解決する。
  test_files:
  - tests/unit/ai_monitor/features/design_docs/test_schemas.py
  functions:
  - name: read_schema_files
    title: Schemaのファイルの読み込み
    kind: 関数
    container: features/design_docs/schemas.py
    usecase: 共通
    role: 読み込み
    summary: 作業ツリーの Schema のファイルを名前 → 中身で読む
    args:
    - name: root
      title: リポジトリの直下
      type: Path
      required: true
      description: Schema を持つリポジトリの直下
    returns:
      type: dict[str, str]
      description: ファイル名 → 中身
    process: 1. `{root}/{TEMPLATES_DIR}` の直下の `*{SCHEMA_SUFFIX}` をファイル名の順に UTF-8 で読んで返す
    exceptions:
    - name: FileNotFoundError
      condition: '`{root}/{TEMPLATES_DIR}` が無い'
      message: 標準のメッセージ
    unit_tests:
    - name: test_read_schema_files
      case: 正常
      summary: 直下の Schema だけを読む
      condition: 直下に Schema 2 つと md 1 つ、下のフォルダに Schema 1 つ
      mock: なし（一時ディレクトリ）
      expected: 直下の Schema 2 つだけ
    - name: test_read_schema_files_when_missing
      case: 異常
      summary: フォルダが無い
      condition: '`dev/テンプレート` の無い一時ディレクトリ'
      mock: なし（一時ディレクトリ）
      expected: '`FileNotFoundError`'
      exception: フォルダが無い
