$schema: https://json-schema.org/draft/2020-12/schema
title: 状態遷移
description: |-
  1 エンティティが取りうる状態と、許可された遷移。1 ファイル = 1 エンティティ。
  図は状態と遷移の表から生成する。副作用・実装の関数は別の設計書に書く。
x-kind: state_transition
x-folder: dev/設計書/状態遷移
type: object
additionalProperties: false
required:
- title
- state_transitions
properties:
  title:
    type: string
    title: タイトル
    description: '`状態遷移: {エンティティ名}`。'
    pattern: '^状態遷移: .+$'
  lead:
    $ref: 共通.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: |-
      対象を 1〜3 行で説明する。
      初回に書いた内容のまま保ち、後から情報を足さない（仕様は各項目に書く）。
      対象そのものが変わったときだけ書き換える。
  state_transitions:
    $ref: 共通.schema.yaml#/$defs/state_transitions
    title: 状態遷移
    x-heading: 状態遷移図
    x-shape: diagram
    x-diagram: state
  refs:
    type: array
    title: 関連
    items:
      $ref: 共通.schema.yaml#/$defs/ref
  notes:
    $ref: 共通.schema.yaml#/$defs/notes
    x-heading: 補足
    x-shape: sections
examples:
- title: '状態遷移: 記事'
  lead: '`記事` が取りうる状態と許可された遷移の一覧。'
  state_transitions:
    states:
    - name: 下書き
      identifier: status = draft
    - name: 公開
      identifier: status = published
    initial: 下書き
    final:
    - 公開
    transitions:
    - from: 下書き
      to: 公開
      trigger: 承認
