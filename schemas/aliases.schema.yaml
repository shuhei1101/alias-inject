$schema: https://json-schema.org/draft/2020-12/schema
title: エイリアスの定義
description: 用語・文書のエイリアス・コマンド・URL を、どの YAML のどの列から取るかを定義する aliases[] の並び。取り込む側は、自分の設定の aliases のキーからこのルートを $ref で指す。
type: array
items:
  $ref: "#/$defs/alias"
$defs:
  alias:
    title: エイリアスの要素
    description: 1 種類の引用について、読む YAML と列の対応を定義する要素。id の一意はスキーマで表せないため、読む側が確かめる。
    type: object
    additionalProperties: false
    required:
      - id
      - type
      - paths
      - fields
    properties:
      id:
        title: 要素の ID
        description: 要素の主キー。
        type: string
        minLength: 1
      enabled:
        title: 有効
        description: false のとき、この要素を使わない。
        type: boolean
        default: true
      type:
        title: 引用の種類
        description: 引用の種類。fields に書けるキーが種類ごとに決まる。
        enum:
          - term
          - doc
          - command
          - url
      paths:
        title: 読む YAML
        description: 読む YAML のパスか glob。ファイルと glob を混ぜてよい。
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
      fields:
        title: 列の対応
        description: 引用に使う値を、元の YAML のどの列から取るかの対応。キーは type ごとに決まり、値は元の YAML の列の名前。
        type: object
    allOf:
      - if:
          required:
            - type
          properties:
            type:
              const: term
        then:
          properties:
            fields:
              required:
                - id
                - match
                - description
              additionalProperties: false
              properties:
                id:
                  $ref: "#/$defs/fieldId"
                match:
                  $ref: "#/$defs/fieldMatch"
                description:
                  $ref: "#/$defs/fieldDescription"
                title:
                  $ref: "#/$defs/fieldTitle"
                related:
                  $ref: "#/$defs/fieldRelated"
                avoid:
                  $ref: "#/$defs/fieldAvoid"
      - if:
          required:
            - type
          properties:
            type:
              const: doc
        then:
          properties:
            fields:
              required:
                - id
                - match
                - description
              additionalProperties: false
              properties:
                id:
                  $ref: "#/$defs/fieldId"
                match:
                  $ref: "#/$defs/fieldMatch"
                description:
                  $ref: "#/$defs/fieldDescription"
                title:
                  $ref: "#/$defs/fieldTitle"
      - if:
          required:
            - type
          properties:
            type:
              const: command
        then:
          properties:
            fields:
              required:
                - id
                - match
                - command
              additionalProperties: false
              properties:
                id:
                  $ref: "#/$defs/fieldId"
                match:
                  $ref: "#/$defs/fieldMatch"
                command:
                  $ref: "#/$defs/fieldCommand"
                title:
                  $ref: "#/$defs/fieldTitle"
                description:
                  $ref: "#/$defs/fieldDescription"
                cwd:
                  $ref: "#/$defs/fieldCwd"
      - if:
          required:
            - type
          properties:
            type:
              const: url
        then:
          properties:
            fields:
              required:
                - id
                - match
                - url
              additionalProperties: false
              properties:
                id:
                  $ref: "#/$defs/fieldId"
                match:
                  $ref: "#/$defs/fieldMatch"
                url:
                  $ref: "#/$defs/fieldUrl"
                title:
                  $ref: "#/$defs/fieldTitle"
                description:
                  $ref: "#/$defs/fieldDescription"
    examples:
      - id: glossary
        type: term
        paths:
          - docs/用語集.yaml
        fields:
          id: id
          match:
            - name
            - aliases
          description: description
          title: name
          related: related_docs
          avoid: avoid
      - id: docs
        type: doc
        paths:
          - dev/設計書/**/index.yaml
        fields:
          id: id
          match:
            - aliases
          description: summary
          title: title
      - id: commands
        type: command
        enabled: false
        paths:
          - commands.yaml
          - scripts/*.yaml
        fields:
          id: id
          match:
            - aliases
          command: command
          title: name
          description: description
          cwd: cwd
      - id: urls
        type: url
        paths:
          - urls.yaml
        fields:
          id: id
          match:
            - aliases
          url: url
          title: name
          description: description
  fieldId:
    title: ID の列
    description: 項目の ID を持つ列の名前。
    type: string
    minLength: 1
  fieldMatch:
    title: 照合する語の列
    description: 本文・入力と照合する語が入っている列の名前の並び。列の値が並びのときは、要素ごとに照合する。
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  fieldDescription:
    title: 説明の列
    description: 項目の説明を持つ列の名前。
    type: string
    minLength: 1
  fieldTitle:
    title: タイトルの列
    description: 項目のタイトルを持つ列の名前。
    type: string
    minLength: 1
  fieldRelated:
    title: 関連の列
    description: term のとき、関連する文書の並びを持つ列の名前。
    type: string
    minLength: 1
  fieldAvoid:
    title: 避ける語の列
    description: term のとき、避ける語を持つ列の名前。
    type: string
    minLength: 1
  fieldCommand:
    title: コマンドの列
    description: command のとき、実行するコマンドを持つ列の名前。
    type: string
    minLength: 1
  fieldCwd:
    title: 実行場所の列
    description: command のとき、コマンドを実行するフォルダを持つ列の名前。
    type: string
    minLength: 1
  fieldUrl:
    title: URL の列
    description: url のとき、URL を持つ列の名前。
    type: string
    minLength: 1
